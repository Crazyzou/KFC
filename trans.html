<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频人声转文本工具</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --surface-hover: #fdfdfe;
            --border: #e8eaef;
            --border-hover: #d5d9e0;
            --text-primary: #1a1d26;
            --text-secondary: #555a68;
            --text-tertiary: #878c99;
            --text-muted: #b0b5c0;
            --accent: #4f5ef0;
            --accent-light: #f0f1ff;
            --accent-hover: #3d4de0;
            --success: #0fa87a;
            --success-light: #edfaf5;
            --danger: #e54545;
            --danger-light: #fef5f5;
            --warning: #d4880a;
            --warning-light: #fffcf5;
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.18s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 13.5px;
            line-height: 1.55;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d0d4de;
            border-radius: 10px;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .navbar {
            height: 50px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: var(--shadow-xs);
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 650;
            font-size: 14px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .navbar .brand .icon-dot {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-dot::before {
            content: '';
            width: 13px;
            height: 9px;
            border: 2px solid #fff;
            border-radius: 2px;
        }

        .icon-dot::after {
            content: '';
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 3.5px solid transparent;
            border-bottom: 3.5px solid transparent;
            border-left: 4.5px solid #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            outline: none;
            background: #fff;
            color: var(--text-secondary);
            user-select: none;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 6px rgba(79, 94, 240, 0.2);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 3px 10px rgba(79, 94, 240, 0.28);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 2px 6px rgba(15, 168, 122, 0.2);
        }

        .btn-success:hover {
            box-shadow: 0 3px 10px rgba(15, 168, 122, 0.28);
            filter: brightness(1.06);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border-color: #fcc;
        }

        .btn-danger:hover {
            background: var(--danger-light);
            border-color: #faa;
        }

        .btn-outline {
            background: #fff;
            border-color: var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: var(--surface-alt);
            border-color: var(--border-hover);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--text-tertiary);
            padding: 4px 8px;
            box-shadow: none;
            transform: none;
        }

        .btn-ghost:hover {
            background: #f1f3f7;
            color: var(--text-primary);
            box-shadow: none;
            transform: none;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11.5px;
            border-radius: var(--radius-xs);
        }

        .btn-xs {
            padding: 3px 7px;
            font-size: 10.5px;
            border-radius: 4px;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            padding: 10px;
            gap: 10px;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 12px;
            gap: 10px;
            z-index: 10;
            box-shadow: var(--shadow-xs);
        }

        .sidebar-section {
            background: var(--surface-alt);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .upload-zone {
            border: 2px dashed #dde1ea;
            border-radius: var(--radius-md);
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: #fafbfd;
            color: var(--text-tertiary);
            padding: 32px 14px;
            /* 增加垂直内边距，区域变大 */
            min-height: 500px;
            /* 设定最小高度，更显眼 */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fff;
        }

        .upload-zone .upload-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 6px;
            border-radius: 8px;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .upload-zone .upload-icon::before {
            content: '';
            width: 14px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .upload-zone .upload-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
            transform: rotate(45deg) translate(2px, 2px);
        }

        .upload-zone .upload-text {
            font-size: 12px;
            font-weight: 500;
        }

        .upload-zone .upload-text span {
            color: var(--accent);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .upload-hint {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 5px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #fff;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 4px;
            transition: all var(--transition);
        }

        .file-item:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
        }

        .file-item .fi-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #eef0f8;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
        }

        .file-item .fi-info {
            flex: 1;
            min-width: 0;
        }

        .file-item .fi-name {
            font-size: 11.5px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .fi-size {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .file-item .fi-del {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            background: none;
            border: none;
            flex-shrink: 0;
            line-height: 1;
        }

        .file-item .fi-del:hover {
            color: var(--danger);
            background: var(--danger-light);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8ecf4;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-indeterminate {
            animation: indeterminate 1.5s infinite ease-in-out;
            width: 30%;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(430%);
            }
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-width: 0;
            gap: 10px;
        }

        .tab-nav {
            display: none;
        }

        .tab-content {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
            padding: 12px;
            overflow: hidden;
            min-width: 0;
        }

        .tab-content.active {
            display: flex;
        }

        #tab-text {
            flex: 2;
        }

        #tab-trans {
            flex: 2;
        }

        #tab-audio {
            flex: 1;
        }

        .tab-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab-content::before {
            content: attr(data-panel-title);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            letter-spacing: 0.01em;
        }

        #textListContainer,
        #transListContainer,
        #audioListContainer {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 3px;
        }

        .card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 7px;
            transition: all var(--transition);
            border-left: 3px solid transparent;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
            background: var(--surface-hover);
        }

        .card:has(input[type="checkbox"]:checked) {
            border-color: var(--accent);
            background: #fafbff;
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 6px;
        }

        .ch-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .ch-right {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 600;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }

        .badge-gray {
            background: #eef0f5;
            color: #5a5f6e;
        }

        .badge-blue {
            background: #eef0ff;
            color: #4f5ef0;
        }

        .badge-green {
            background: #edfaf5;
            color: #0a8a62;
        }

        .badge-orange {
            background: #fff9f0;
            color: #b87a0a;
        }

        .badge-red {
            background: #fef5f5;
            color: #c53030;
        }

        .badge-source {
            background: #f5f5ff;
            color: #5558c0;
            font-size: 9.5px;
            padding: 1px 6px;
            border-radius: 10px;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #e0e0f5;
            cursor: default;
        }

        .source-tag {
            font-size: 10px;
            color: var(--text-tertiary);
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }

        textarea.card-textarea {
            width: 100%;
            min-height: 68px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            resize: vertical;
            background: #fff;
            color: var(--text-primary);
            transition: all var(--transition);
            line-height: 1.5;
        }

        textarea.card-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.08);
            background: #fff;
        }

        .audio-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 7px;
            transition: all var(--transition);
        }

        .audio-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
        }

        .ac-top {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .ac-name {
            font-size: 11.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
            font-weight: 500;
        }

        .ac-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .audio-progress-wrap {
            margin-top: 6px;
        }

        .audio-progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e6f0;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
        }

        .audio-progress-bar:hover {
            height: 6px;
        }

        .audio-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.06s linear;
            pointer-events: none;
        }

        .audio-time {
            font-size: 10px;
            color: var(--text-tertiary);
            text-align: right;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 14px;
            color: var(--text-tertiary);
            text-align: center;
            gap: 6px;
            height: 100%;
        }

        .empty-state .empty-icon {
            width: 44px;
            height: 44px;
            margin-bottom: 2px;
            border-radius: 10px;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            font-size: 18px;
            color: var(--text-muted);
        }

        .empty-state .empty-text {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .empty-state .empty-sub {
            font-size: 10.5px;
            opacity: 0.65;
            max-width: 210px;
            line-height: 1.4;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11.5px;
            color: var(--text-secondary);
            user-select: none;
        }

        .checkbox-wrap input[type="checkbox"] {
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
            cursor: pointer;
            border-radius: 3px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 14, 24, 0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.14s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 440px;
            max-width: 93vw;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalIn 0.18s ease;
            border: 1px solid var(--border);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
        }

        .modal-close {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-tertiary);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: #f1f3f7;
            color: var(--text-primary);
        }

        .modal-body {
            padding: 16px;
        }

        .modal-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            background: var(--surface-alt);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .modal textarea,
        .modal input[type="text"],
        .modal select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            background: #fafbfd;
            color: var(--text-primary);
            transition: all var(--transition);
        }

        .modal textarea:focus,
        .modal input[type="text"]:focus,
        .modal select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.07);
            background: #fff;
        }

        .modal label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 3px;
            margin-top: 10px;
        }

        .modal .form-row {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .modal .form-row select {
            flex: 1;
        }

        .hint {
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 4px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .slider-val {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 28px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .toast-msg {
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .workflow-steps {
            display: flex;
            gap: 3px;
            margin-bottom: 2px;
        }

        .workflow-step {
            flex: 1;
            height: 2.5px;
            border-radius: 8px;
            background: #e2e6f0;
            transition: all 0.3s ease;
        }

        .workflow-step.done {
            background: var(--accent);
        }

        .workflow-step.active {
            background: var(--accent);
            animation: pulse-step 1.4s infinite;
        }

        @keyframes pulse-step {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        .failed-list {
            background: #fffafa;
            border: 1px solid #fdd;
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            margin-top: 7px;
            font-size: 11.5px;
            color: #c53030;
            max-height: 110px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .failed-list strong {
            display: block;
            margin-bottom: 3px;
            font-size: 12px;
        }

        @media (max-width: 1200px) {
            #tab-text {
                flex: 1.8;
            }

            #tab-trans {
                flex: 1.2;
            }

            #tab-audio {
                flex: 1;
            }
        }

        @media (max-width: 960px) {
            .main-body {
                flex-direction: column;
                overflow-y: auto;
            }

            .sidebar {
                width: 100%;
                flex-shrink: 0;
                max-height: none;
            }

            .main-panel {
                flex-direction: column;
                height: auto;
            }

            .tab-content {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <nav class="navbar">
            <div class="brand">
                <div class="icon-dot"></div><span>视频人声转文本</span>
            </div>
            <div class="navbar-actions"><button class="btn btn-danger btn-sm" onclick="clearAllData()">清空数据</button>
            </div>
        </nav>
        <div class="main-body">
            <aside class="sidebar">
                <div class="workflow-steps" id="workflowSteps">
                    <div class="workflow-step" id="stepUpload"></div>
                    <div class="workflow-step" id="stepTranscribe"></div>
                    <div class="workflow-step" id="stepTranslate"></div>
                    <div class="workflow-step" id="stepAudio"></div>
                </div>
                <div class="sidebar-section">
                    <div class="section-title"><span class="dot"></span>文件上传</div>
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon"></div>
                        <div class="upload-text">拖拽文件到此处，或<span>点击上传</span></div>
                    </div>
                    <div class="upload-hint">MP4 / AVI / MOV / MKV / WEBM / MP3 / M4A / AAC / OGG / FLAC / WAV &middot;
                        单文件≤1GB</div>
                    <input type="file" id="fileInput" style="display:none" multiple accept="video/*,audio/*"
                        onchange="handleFileInput(event)">
                </div>
                <div class="sidebar-section" id="fileListSection" style="display:none;">
                    <div class="section-title" id="fileListTitle">已选择文件 (0)</div>
                    <div id="fileListContainer"></div>
                    <button class="btn btn-primary" id="transcribeBtn" onclick="startTranscribe()"
                        style="width:100%;margin-top:7px;justify-content:center;">开始转录</button>
                </div>
                <div class="sidebar-section" id="progressSection" style="display:none;">
                    <div class="section-title">处理进度</div>
                    <div class="progress-text" id="progressLabel">准备中...</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                    </div>
                </div>
            </aside>
            <div class="main-panel">
                <div class="tab-nav">
                    <button class="tab-btn active" data-tab="tab-text"
                        onclick="switchTab('tab-text', this)">原始文案</button>
                    <button class="tab-btn" data-tab="tab-trans" onclick="switchTab('tab-trans', this)">翻译结果</button>
                    <button class="tab-btn" data-tab="tab-audio" onclick="switchTab('tab-audio', this)">音频列表</button>
                </div>
                <div class="tab-content active" id="tab-text" data-panel-title="原始文案">
                    <div class="tab-toolbar">
                        <div class="toolbar-left">
                            <label class="checkbox-wrap"><input type="checkbox" id="selectAllText"
                                    onchange="toggleAllText()"> 全选</label>
                            <button class="btn btn-outline btn-sm" onclick="addTextManually()">+ 新增</button>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-success btn-sm" id="btnTranslate" onclick="openTranslateDialog()"
                                disabled>翻译选中</button>
                            <button class="btn btn-danger btn-sm" id="btnDelText" onclick="deleteSelectedText()"
                                disabled>删除选中</button>
                        </div>
                    </div>
                    <div id="textListContainer">
                        <div class="empty-state">
                            <div class="empty-icon">T</div>
                            <div class="empty-text">暂无转录文案</div>
                            <div class="empty-sub">上传文件并点击开始转录后，文案会自动出现在这里</div>
                        </div>
                    </div>
                </div>
                <div class="tab-content" id="tab-trans" data-panel-title="翻译结果">
                    <div class="tab-toolbar">
                        <div class="toolbar-left">
                            <label class="checkbox-wrap"><input type="checkbox" id="selectAllTrans"
                                    onchange="toggleAllTrans()"> 全选</label>
                            <button class="btn btn-outline btn-sm" onclick="addTransManually()">+ 新增</button>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-success btn-sm" id="btnDownloadTrans" onclick="batchDownloadTrans()"
                                disabled>下载TXT</button>
                            <button class="btn btn-primary btn-sm" id="btnTts" onclick="openTtsDialog()"
                                disabled>生成语音</button>
                            <button class="btn btn-danger btn-sm" id="btnDelTrans" onclick="deleteSelectedTrans()"
                                disabled>删除</button>
                        </div>
                    </div>
                    <div id="transListContainer">
                        <div class="empty-state">
                            <div class="empty-icon">A</div>
                            <div class="empty-text">暂无翻译内容</div>
                            <div class="empty-sub">在原始文案中勾选条目，点击翻译选中即可生成</div>
                        </div>
                    </div>
                </div>
                <div class="tab-content" id="tab-audio" data-panel-title="音频列表">
                    <div class="tab-toolbar">
                        <div class="toolbar-left"><label class="checkbox-wrap"><input type="checkbox"
                                    id="selectAllAudio" onchange="toggleAllAudio()"> 全选</label></div>
                        <div class="toolbar-right">
                            <button class="btn btn-primary btn-sm" id="btnBatchDownloadAudio"
                                onclick="batchDownloadAudio()" disabled>批量下载</button>
                            <button class="btn btn-danger btn-sm" id="btnDelAudio" onclick="deleteSelectedAudio()"
                                disabled>删除</button>
                        </div>
                    </div>
                    <div id="audioListContainer">
                        <div class="empty-state">
                            <div class="empty-icon">S</div>
                            <div class="empty-text">暂无生成音频</div>
                            <div class="empty-sub">在翻译结果中勾选条目，点击生成语音即可</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalTranslate">
        <div class="modal">
            <div class="modal-header"><span>批量翻译设置</span><button class="modal-close" id="modalTranslateClose"
                    onclick="closeModal('modalTranslate')">&times;</button></div>
            <div class="modal-body" id="translateBody">
                <label for="translateInput">目标语言（用逗号或换行分隔）</label>
                <textarea id="translateInput" rows="3" placeholder="例如：葡萄牙语、英语、日语&#10;按 Enter 快速开始翻译"></textarea>
                <div class="hint">系统将自动识别所有已勾选文案并翻译为指定语言</div>
                <div id="translateProgress" style="display:none;margin-top:12px;">
                    <div class="progress-text" id="translateProgressLabel">正在翻译... 0/0</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="translateProgressFill" style="width:0%;"></div>
                    </div>
                </div>
                <div id="translateFailedList" style="display:none;"></div>
            </div>
            <div class="modal-footer" id="translateFooter"><button class="btn btn-outline"
                    onclick="closeModal('modalTranslate')">取消</button><button class="btn btn-primary"
                    id="btnConfirmTranslate" onclick="executeTranslate()">开始翻译</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="modalTts">
        <div class="modal">
            <div class="modal-header"><span>语音生成设置</span><button class="modal-close" id="modalTtsClose"
                    onclick="closeModal('modalTts')">&times;</button></div>
            <div class="modal-body" id="ttsBody">
                <label for="ttsModel">模型选择</label><select id="ttsModel" onchange="onTtsModelChange()">
                    <option value="google">谷歌 (Google)</option>
                    <option value="aliyun">阿里云 (Aliyun)</option>
                </select>
                <label for="ttsVoice">语音音色</label>
                <div class="form-row"><select id="ttsVoice" style="flex:1;"></select><button
                        class="btn btn-outline btn-sm" id="btnVoiceDemo" onclick="playVoiceDemo()">试听</button></div>
                <div id="ttsIntervalRow"><label for="ttsInterval">段落间隔（秒）</label>
                    <div class="slider-row"><input type="range" id="ttsInterval" min="0" max="3" step="0.1" value="0.3"
                            oninput="document.getElementById('ttsIntervalVal').textContent=this.value"><span
                            class="slider-val" id="ttsIntervalVal">0.3</span></div>
                </div>
                <label style="margin-top:10px;"><input type="checkbox" id="ttsUseTextName"
                        style="accent-color:var(--accent);"> 使用原始文案作为文件名</label>
                <div id="ttsProgress" style="display:none;margin-top:12px;">
                    <div class="progress-text" id="ttsProgressLabel">正在生成... 0/0</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="ttsProgressFill" style="width:0%;"></div>
                    </div>
                </div>
                <div id="ttsFailedList" style="display:none;"></div>
            </div>
            <div class="modal-footer" id="ttsFooter"><button class="btn btn-outline"
                    onclick="closeModal('modalTts')">取消</button><button class="btn btn-primary" id="btnConfirmTts"
                    onclick="executeTts()">确认生成</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="modalAddText">
        <div class="modal">
            <div class="modal-header"><span>新增原始文案</span><button class="modal-close"
                    onclick="closeModal('modalAddText')">&times;</button></div>
            <div class="modal-body"><textarea id="addTextInput" rows="5" placeholder="输入文本内容..."></textarea></div>
            <div class="modal-footer"><button class="btn btn-outline"
                    onclick="closeModal('modalAddText')">取消</button><button class="btn btn-primary"
                    onclick="saveAddText()">保存</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="modalAddTrans">
        <div class="modal">
            <div class="modal-header"><span>新增翻译</span><button class="modal-close"
                    onclick="closeModal('modalAddTrans')">&times;</button></div>
            <div class="modal-body"><label for="addTransLang">语言标识（可选）</label><input type="text" id="addTransLang"
                    placeholder="zh / en / pt / jp / kr"><label for="addTransText">翻译内容</label><textarea
                    id="addTransText" rows="4" placeholder="输入翻译文本..."></textarea></div>
            <div class="modal-footer"><button class="btn btn-outline"
                    onclick="closeModal('modalAddTrans')">取消</button><button class="btn btn-primary"
                    onclick="saveAddTrans()">保存</button></div>
        </div>
    </div>
    <audio id="demoAudio" style="display:none;"></audio>
    <script src="./js/trans.js"></script>
</body>

</html>
