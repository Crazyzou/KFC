<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频人声转文本工具</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --surface-hover: #fdfdfe;
            --border: #e8eaef;
            --border-hover: #d5d9e0;
            --text-primary: #1a1d26;
            --text-secondary: #555a68;
            --text-tertiary: #878c99;
            --text-muted: #b0b5c0;
            --accent: #4f5ef0;
            --accent-light: #f0f1ff;
            --accent-hover: #3d4de0;
            --success: #0fa87a;
            --success-light: #edfaf5;
            --danger: #e54545;
            --danger-light: #fef5f5;
            --warning: #d4880a;
            --warning-light: #fffcf5;
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.18s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 13.5px;
            line-height: 1.55;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d0d4de;
            border-radius: 10px;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .navbar {
            height: 50px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: var(--shadow-xs);
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 650;
            font-size: 14px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .navbar .brand .icon-dot {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-dot::before {
            content: '';
            width: 13px;
            height: 9px;
            border: 2px solid #fff;
            border-radius: 2px;
        }

        .icon-dot::after {
            content: '';
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 3.5px solid transparent;
            border-bottom: 3.5px solid transparent;
            border-left: 4.5px solid #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            outline: none;
            background: #fff;
            color: var(--text-secondary);
            user-select: none;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 6px rgba(79, 94, 240, 0.2);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 3px 10px rgba(79, 94, 240, 0.28);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 2px 6px rgba(15, 168, 122, 0.2);
        }

        .btn-success:hover {
            box-shadow: 0 3px 10px rgba(15, 168, 122, 0.28);
            filter: brightness(1.06);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border-color: #fcc;
        }

        .btn-danger:hover {
            background: var(--danger-light);
            border-color: #faa;
        }

        .btn-outline {
            background: #fff;
            border-color: var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: var(--surface-alt);
            border-color: var(--border-hover);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--text-tertiary);
            padding: 4px 8px;
            box-shadow: none;
            transform: none;
        }

        .btn-ghost:hover {
            background: #f1f3f7;
            color: var(--text-primary);
            box-shadow: none;
            transform: none;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11.5px;
            border-radius: var(--radius-xs);
        }

        .btn-xs {
            padding: 3px 7px;
            font-size: 10.5px;
            border-radius: 4px;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            padding: 10px;
            gap: 10px;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 12px;
            gap: 10px;
            z-index: 10;
            box-shadow: var(--shadow-xs);
        }

        .sidebar-section {
            background: var(--surface-alt);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .upload-zone {
            border: 2px dashed #dde1ea;
            border-radius: var(--radius-md);
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: #fafbfd;
            color: var(--text-tertiary);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fff;
        }

        .upload-zone .upload-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 6px;
            border-radius: 8px;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .upload-zone .upload-icon::before {
            content: '';
            width: 14px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .upload-zone .upload-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
            transform: rotate(45deg) translate(2px, 2px);
        }

        .upload-zone .upload-text {
            font-size: 12px;
            font-weight: 500;
        }

        .upload-zone .upload-text span {
            color: var(--accent);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .upload-hint {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 5px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #fff;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 4px;
            transition: all var(--transition);
        }

        .file-item:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
        }

        .file-item .fi-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #eef0f8;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
        }

        .file-item .fi-info {
            flex: 1;
            min-width: 0;
        }

        .file-item .fi-name {
            font-size: 11.5px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .fi-size {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .file-item .fi-del {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            background: none;
            border: none;
            flex-shrink: 0;
            line-height: 1;
        }

        .file-item .fi-del:hover {
            color: var(--danger);
            background: var(--danger-light);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8ecf4;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-indeterminate {
            animation: indeterminate 1.5s infinite ease-in-out;
            width: 30%;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(430%);
            }
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-width: 0;
            gap: 10px;
        }

        .tab-nav {
            display: none;
        }

        .tab-content {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
            padding: 12px;
            overflow: hidden;
            min-width: 0;
        }

        .tab-content.active {
            display: flex;
        }

        #tab-text {
            flex: 2;
        }

        #tab-trans {
            flex: 2;
        }

        #tab-audio {
            flex: 1;
        }

        .tab-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab-content::before {
            content: attr(data-panel-title);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            letter-spacing: 0.01em;
        }

        #textListContainer,
        #transListContainer,
        #audioListContainer {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 3px;
        }

        .card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 7px;
            transition: all var(--transition);
            border-left: 3px solid transparent;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
            background: var(--surface-hover);
        }

        .card:has(input[type="checkbox"]:checked) {
            border-color: var(--accent);
            background: #fafbff;
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 6px;
        }

        .ch-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .ch-right {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 600;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }

        .badge-gray {
            background: #eef0f5;
            color: #5a5f6e;
        }

        .badge-blue {
            background: #eef0ff;
            color: #4f5ef0;
        }

        .badge-green {
            background: #edfaf5;
            color: #0a8a62;
        }

        .badge-orange {
            background: #fff9f0;
            color: #b87a0a;
        }

        .badge-red {
            background: #fef5f5;
            color: #c53030;
        }

        .badge-source {
            background: #f5f5ff;
            color: #5558c0;
            font-size: 9.5px;
            padding: 1px 6px;
            border-radius: 10px;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #e0e0f5;
            cursor: default;
        }

        .source-tag {
            font-size: 10px;
            color: var(--text-tertiary);
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }

        textarea.card-textarea {
            width: 100%;
            min-height: 68px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            resize: vertical;
            background: #fff;
            color: var(--text-primary);
            transition: all var(--transition);
            line-height: 1.5;
        }

        textarea.card-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.08);
            background: #fff;
        }

        .audio-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 7px;
            transition: all var(--transition);
        }

        .audio-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-xs);
        }

        .ac-top {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .ac-name {
            font-size: 11.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
            font-weight: 500;
        }

        .ac-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .audio-progress-wrap {
            margin-top: 6px;
        }

        .audio-progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e6f0;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
        }

        .audio-progress-bar:hover {
            height: 6px;
        }

        .audio-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.06s linear;
            pointer-events: none;
        }

        .audio-time {
            font-size: 10px;
            color: var(--text-tertiary);
            text-align: right;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 14px;
            color: var(--text-tertiary);
            text-align: center;
            gap: 6px;
            height: 100%;
        }

        .empty-state .empty-icon {
            width: 44px;
            height: 44px;
            margin-bottom: 2px;
            border-radius: 10px;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            font-size: 18px;
            color: var(--text-muted);
        }

        .empty-state .empty-text {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .empty-state .empty-sub {
            font-size: 10.5px;
            opacity: 0.65;
            max-width: 210px;
            line-height: 1.4;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11.5px;
            color: var(--text-secondary);
            user-select: none;
        }

        .checkbox-wrap input[type="checkbox"] {
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
            cursor: pointer;
            border-radius: 3px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 14, 24, 0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.14s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 440px;
            max-width: 93vw;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalIn 0.18s ease;
            border: 1px solid var(--border);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
        }

        .modal-close {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-tertiary);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: #f1f3f7;
            color: var(--text-primary);
        }

        .modal-body {
            padding: 16px;
        }

        .modal-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            background: var(--surface-alt);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .modal textarea,
        .modal input[type="text"],
        .modal select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            background: #fafbfd;
            color: var(--text-primary);
            transition: all var(--transition);
        }

        .modal textarea:focus,
        .modal input[type="text"]:focus,
        .modal select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 94, 240, 0.07);
            background: #fff;
        }

        .modal label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 3px;
            margin-top: 10px;
        }

        .modal .form-row {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .modal .form-row select {
            flex: 1;
        }

        .hint {
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 4px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .slider-val {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 28px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .toast-msg {
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .workflow-steps {
            display: flex;
            gap: 3px;
            margin-bottom: 2px;
        }

        .workflow-step {
            flex: 1;
            height: 2.5px;
            border-radius: 8px;
            background: #e2e6f0;
            transition: all 0.3s ease;
        }

        .workflow-step.done {
            background: var(--accent);
        }

        .workflow-step.active {
            background: var(--accent);
            animation: pulse-step 1.4s infinite;
        }

        @keyframes pulse-step {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        .failed-list {
            background: #fffafa;

                    placeholder="zh / en / pt / jp / kr"><label for="addTransText">翻译内容</label><textarea
                    id="addTransText" rows="4" placeholder="输入翻译文本..."></textarea></div>
            <div class="modal-footer"><button class="btn btn-outline"

    <script>
        const BASE = 'https://149.28.88.166:3005';
        let fileList = [];
        let textList = [];
        let transList = [];
        let audioList = [];
        let isTranscribing = false;
        let currentPlayIdx = -1;
        let currentAudioEl = null;
        let voiceListCache = { google: [], aliyun: [] };
        let pendingTtsItems = [];
        const SOURCE_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#14b8a6',
            '#f97316', '#84cc16', '#a855f7', '#22d3ee', '#fb7185', '#2dd4bf', '#eab308'
        ];

        function getSourceColor(fromTextId) {
            if (!fromTextId) return '#c0c5d0'; let hash = 0; for (let i = 0; i < fromTextId
                .length; i++) {
                hash = ((hash << 5) - hash) + fromTextId.charCodeAt(i);
                hash |= 0;
            } return SOURCE_COLORS[Math.abs(hash) % SOURCE_COLORS.length];
        }

        function getOriginSnippet(fromTextId) {
            if (!fromTextId) return ''; const o = textList.find(t => t.id === fromTextId); if (
                !o || !o.text) return ''; const c = o.text.replace(/\s+/g, ' ').trim(); return c.length > 25 ? c.slice(0, 25) +
                    '...' : c;
        }

        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9); }

        function formatSize(b) {
            if (!b || b === 0) return '0 B'; const k = 1024,
                arr = ['B', 'KB', 'MB', 'GB']; const i = Math.floor(Math.log(b) / Math.log(k)); return parseFloat((b / Math.pow(
                    k, i)).toFixed(2)) + ' ' + arr[i];
        }

        function formatTime(s) {
            if (isNaN(s) || s < 0) return '0:00'; const m = Math.floor(s / 60),
                sec = Math.floor(s % 60); return m + ':' + sec.toString().padStart(2, '0');
        }

        function getLangName(c) {
            const m = { zh: '中文', pt: '葡萄牙语', en: '英语', jp: '日语', kr: '韩语' }; return m[c] || c ||
                '未知';
        }

        function getBadgeClass(c) {
            const m = {
                zh: 'badge-blue', en: 'badge-green', pt: 'badge-orange', jp: 'badge-gray',
                kr: 'badge-red'
            }; return m[c] || 'badge-gray';
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s; return d.innerHTML;
        }

        function escapeAttr(s) {
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g,
                '&lt;').replace(/>/g, '&gt;');
        }

        function showToast(msg, type = 'info') {
            const e = document.querySelector('.toast-msg'); if (e) e.remove(); const t =
                document.createElement('div');
            t.className = 'toast-msg';
            t.textContent = msg; const c = { info: '#4f5ef0', success: '#0fa87a', error: '#e54545', warning: '#d4880a' };
            t.style.cssText =
                `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:${c[type] || c.info};color:#fff;padding:10px 20px;border-radius:18px;font-size:12.5px;font-weight:500;box-shadow:0 5px 16px rgba(0,0,0,0.16);pointer-events:none;animation:toastIn 0.3s ease;max-width:88vw;text-align:center;`;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transition = 'opacity 0.3s';
            }, 2300);
            setTimeout(() => t.remove(), 2900);
        }

        function showConfirm(msg) {
            return new Promise(r => {
                const o = document.createElement('div');
                o.className = 'modal-overlay';
                o.style.display = 'flex';
                o.innerHTML =
                    `<div class="modal" style="width:350px;"><div class="modal-header"><span>确认操作</span><button class="modal-close close-confirm">&times;</button></div><div class="modal-body"><p style="font-size:13px;margin:0;line-height:1.5;">${msg}</p></div><div class="modal-footer"><button class="btn btn-outline cancel-confirm">取消</button><button class="btn btn-primary confirm-confirm">确认</button></div></div>`;
                document.body.appendChild(o); const c = (v) => {
                    o.style.display = 'none';
                    setTimeout(() => o.remove(), 180);
                    r(v);
                };
                o.querySelector('.close-confirm').onclick = () => c(false);
                o.querySelector('.cancel-confirm').onclick = () => c(false);
                o.querySelector('.confirm-confirm').onclick = () => c(true);
                o.addEventListener('click', e => { if (e.target === o) c(false); });
            });
        }

        function copyText(t) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(t).then(() => showToast('已复制',
                    'success')).catch(() => showToast('复制失败', 'error'));
            } else {
                const ta = document.createElement(
                    'textarea');
                ta.value = t;
                ta.style.cssText = 'position:fixed;left:-9999px;';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('已复制', 'success');
            }
        }

        function downloadTxt(t, n) {
            const b = new Blob([t], { type: 'text/plain;charset=utf-8' }); const u = URL.createObjectURL(
                b); const a = document.createElement('a');
            a.href = u;
            a.download = (n || '文案') + '_' + Date.now() + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(u);
        }

        function openModal(id) { document.getElementById(id).classList.add('show'); }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('modal-overlay')) e.target.classList
                .remove('show');
        });

        function updateWorkflowSteps() {
            const s = {
                u: document.getElementById('stepUpload'), t: document.getElementById(
                    'stepTranscribe'), r: document.getElementById('stepTranslate'), a: document.getElementById(
                        'stepAudio')
            };
            Object.values(s).forEach(x => x.className = 'workflow-step'); if (fileList.length > 0) s.u.classList.add('done'); if (
                textList.length > 0) s.t.classList.add('done'); if (transList.length > 0) s.r.classList.add('done'); if (audioList
                    .length > 0) s.a.classList.add('done'); if (isTranscribing) s.t.classList.add('active');
        }
        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', function (e) {
            e.preventDefault();
            this.style.borderColor = '#4f5ef0';
            this.style.background = '#f0f1ff';
        });
        uploadZone.addEventListener('dragleave', function (e) {
            e.preventDefault();
            this.style.borderColor = '#d8dce8';
            this.style.background = '#fafbfd';
        });
        uploadZone.addEventListener('drop', function (e) {
            e.preventDefault();
            this.style.borderColor = '#d8dce8';
            this.style.background = '#fafbfd'; const f = e.dataTransfer.files; if (f && f.length) processFiles(Array.from(
                f));
        });

        function handleFileInput(e) {
            const f = e.target.files; if (f && f.length) processFiles(Array.from(f));
            e.target.value = '';
        }

        function processFiles(files) {
            files.forEach(f => {
                const isVid = f.type.startsWith('video/');
                const isAud = f.type.startsWith('audio/');
                if (!isVid && !isAud) { showToast(f.name + ' 不是音视频文件，已跳过', 'warning'); return; }
                if (f.size > 1024 * 1024 * 1024) { showToast(f.name + ' 超过1GB，已跳过', 'warning'); return; }
                if (fileList.some(item => item.name === f.name && item.size === f.size)) { showToast(f.name + ' 已存在', 'warning'); return; }
                fileList.push({ uid: genId(), name: f.name, size: f.size, raw: f });
            });
            renderFileList();
            updateWorkflowSteps();

            // ✅ 新增：若当前没有正在进行的转录任务，且文件列表不为空，则自动开始转录 
            if (!isTranscribing && fileList.length > 0) {
                setTimeout(() => {
                    if (!isTranscribing && fileList.length > 0) {
                        startTranscribe();
                    }
                }, 300); // 延迟300ms，确保UI渲染完成且拖拽事件处理完毕 
            }
        }

        function removeFile(i) {
            fileList.splice(i, 1);
            renderFileList();
            updateWorkflowSteps();
        }

        function renderFileList() {
            const s = document.getElementById('fileListSection'),
                c = document.getElementById('fileListContainer'),
                t = document.getElementById('fileListTitle'); if (fileList.length === 0) {
                    s.style.display = 'none';
                    updateWorkflowSteps(); return;
                }
            s.style.display = 'block';
            t.textContent = '已选择文件 (' + fileList.length + ')';
            c.innerHTML = fileList.map((f, i) =>
                `<div class="file-item"><span class="fi-icon">F</span><div class="fi-info"><div class="fi-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div><div class="fi-size">${formatSize(f.size)}</div></div><button class="fi-del" onclick="removeFile(${i})" title="移除">&times;</button></div>`
            ).join('');
            updateWorkflowSteps();
        }
        async function startTranscribe() {
            if (fileList.length === 0) return showToast('请先选择文件', 'warning'); if (
                isTranscribing) return;
            isTranscribing = true;
            updateWorkflowSteps(); const ps = document.getElementById('progressSection'),
                pf = document.getElementById('progressFill'),
                pl = document.getElementById('progressLabel'),
                btn = document.getElementById('transcribeBtn');
            ps.style.display = 'block';
            btn.disabled = true;
            btn.textContent = '转录中...';
            pf.className = 'progress-fill progress-indeterminate';
            pl.textContent = '正在处理: ' + fileList[0].name; try {
                for (let i = 0; i < fileList.length; i++) {
                    const fi =
                        fileList[i];
                    pl.textContent = `处理中 (${i + 1}/${fileList.length}): ${fi.name}`; const fd = new FormData(); const isV = fi
                        .raw.type.startsWith('video/'); const url = isV ? '/api/transcribe' : '/api/transcribe-audio';
                    fd.append(isV ? 'video' : 'audio', fi.raw); const res = await fetch(BASE + url, {
                        method: 'POST',
                        body: fd
                    }); if (!res.ok) throw new Error('HTTP ' + res.status); if (isV) {
                        const reader = res.body
                            .getReader(); const decoder = new TextDecoder(); let buf = ''; while (true) {
                                const { done,
                                    value } = await reader.read(); if (done) break;
                                buf += decoder.decode(value, { stream: true }); const lines = buf.split('\n');
                                buf = lines.pop() || ''; for (const line of lines) {
                                    if (line.startsWith('data: ')) {
                                        try {
                                            const d =
                                                JSON.parse(line.slice(6)); if (d.type === 'complete') {
                                                    textList.push({
                                                        id: genId(),
                                                        source: fi.name, origin: d.data.originalTranscription || '', text: d
                                                            .data.chineseTranscription || '', selected: false
                                                    });
                                                    renderTextList();
                                                }
                                        } catch (e) { }
                                    }
                                }
                            }
                    } else {
                        const json = await res.json();
                        textList.push({
                            id: genId(), source: fi.name, origin: json.originalTranscription || '', text: json
                                .chineseTranscription || '', selected: false
                        });
                        renderTextList();
                    }
                }
                pf.className = 'progress-fill';
                pf.style.width = '100%';
                pl.textContent = '转录完成';
                textList.forEach(x => x.selected = true);
                renderTextList();
                updateWorkflowSteps(); if (textList.length > 0) switchTab('tab-text', document.querySelector(
                    '.tab-btn[data-tab="tab-text"]'));
                showToast('转录完成，共 ' + textList.length + ' 条文案', 'success');
            } catch (err) {
                pl.textContent = '转录失败: ' + err
                    .message;
                showToast('转录失败: ' + err.message, 'error');
            } finally {
                isTranscribing = false;
                btn.disabled = false;

        async function executeTranslate() {
            const input = document.getElementById('translateInput').value.trim();
            if (!input) return showToast('请输入目标语言', 'warning');
            const btn = document.getElementById('btnConfirmTranslate');
            const pd = document.getElementById('translateProgress');
            const pl = document.getElementById('translateProgressLabel');
            const pf = document.getElementById('translateProgressFill');
            const ft = document.getElementById('translateFooter');
            const cb = document.getElementById('modalTranslateClose');
            const fd = document.getElementById('translateFailedList');

            btn.disabled = true;
            ft.style.display = 'none';
            pd.style.display = 'block';
            fd.style.display = 'none';
            cb.style.display = 'none';

            try {
                const lr = await fetch(BASE + '/api/extract-target-languages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ languageInstruction: input })
                });
                if (!lr.ok) throw new Error('语言解析失败');
                const lj = await lr.json();
                const langs = lj.extractedLanguages || [];
                if (!langs.length) throw new Error('未识别到有效目标语言');
                const sel = textList.filter(i => i.selected);
                const total = sel.length * langs.length;
                let done = 0;
                const failed = [];

                pl.textContent = `正在翻译... 0/${total}`;
                pf.style.width = '0%';

                // 为每一个翻译任务创建一个Promise，完成后立即更新界面 
                const tasks = [];
                for (const t of sel) {
                    for (const lo of langs) {
                        tasks.push({ ti: t, lo: lo });
                    }
                }

                // 并行发起所有请求，并在每个完成时直接处理 
                const promises = tasks.map(task =>
                    fetch(BASE + '/api/translate-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: task.ti.text, targetLanguage: task.lo.language })
                    })
                        .then(async r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            const json = await r.json();
                            return { success: true, task, json };
                        })
                        .catch(err => {
                            return { success: false, task, error: err.message || '未知错误' };
                        })
                        .then(result => {
                            // 处理单个结果（无论成功或失败）
                            done++;
                            if (result.success) {
                                const { task, json } = result;
                                const lc = task.lo.ttsCode || task.lo.language || '';
                                transList.push({
                                    id: genId(),
                                    text: json.translatedText || '',
                                    lang: lc,
                                    source: task.ti.source + ' - ' + getLangName(task.lo.language),
                                    fromTextId: task.ti.id,
                                    selected: false
                                });
                                renderTransList();  // 实时显示新增的翻译 
                            } else {
                                failed.push({
                                    text: (result.task.ti.text || '').slice(0, 40),
                                    lang: getLangName(result.task.lo.language),
                                    error: result.error
                                });
                            }

                            // 更新进度 
                            pl.textContent = `正在翻译... ${done}/${total}`;
                            pf.style.width = ((done / total) * 100) + '%';
                        })
                );

                // 等待所有请求完成（只是为了确保finally执行时间正确）
                await Promise.allSettled(promises);

                // 所有请求处理完毕后的收尾 
                transList.forEach(x => x.selected = true);
                renderTransList();
                updateWorkflowSteps();

                if (failed.length > 0) {
                    fd.style.display = 'block';
                    fd.innerHTML = `<div class="failed-list"><strong>以下 ${failed.length} 条翻译失败：</strong>${failed.map(f => '&bull; "' + escapeHtml(f.text) + '…" → ' + f.lang + ' (' + f.error + ')').join('<br>')}</div>`;
                    showToast(`翻译部分完成：${done - failed.length} 成功，${failed.length} 失败`, 'warning');
                } else {
                    closeModal('modalTranslate');
                    showToast(`翻译完成，共 ${done} 条译文`, 'success');
                }
                switchTab('tab-trans', document.querySelector('.tab-btn[data-tab="tab-trans"]'));
            } catch (err) {
                showToast('翻译失败: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                ft.style.display = 'flex';
                pd.style.display = 'none';
                cb.style.display = '';
            }
        }

            document.getElementById('selectAllAudio').checked = audioList.length > 0 && audioList.every(i => i.selected);
        }

        function toggleAllAudio() {
            const c = document.getElementById('selectAllAudio').checked;
            audioList.forEach(i => i.selected = c);
            renderAudioList();
        }
        async function deleteAudio(i) {
            if (!await showConfirm('确定删除该音频记录？')) return; if (currentPlayIdx === i) stopAudio();
            audioList.splice(i, 1);
            renderAudioList();
            updateWorkflowSteps();
            showToast('已删除', 'success');
        }
        async function deleteSelectedAudio() {
            const s = audioList.filter(i => i.selected); if (s.length === 0) return showToast(
                '请先勾选音频', 'warning'); if (!await showConfirm(`确定删除选中的 ${s.length} 个音频？`)) return; if (currentPlayIdx >= 0 && audioList[
                    currentPlayIdx] && audioList[currentPlayIdx].selected) stopAudio(); for (let i = audioList.length - 1; i >=
                        0; i--) { if (audioList[i].selected) audioList.splice(i, 1); }
            renderAudioList();
            updateWorkflowSteps();
            showToast('已批量删除', 'success');
        }

        function batchDownloadAudio() {
            const s = audioList.filter(i => i.selected); if (s.length === 0) return showToast(
                '请先勾选音频', 'warning');
            s.forEach(a => downloadAudioFile(a.file, a.display || a.file));
            showToast('开始批量下载', 'success');
        }
        async function downloadAudioFile(fn, dn) {
            try {
                const r = await fetch(BASE + '/api/download-audio/' +
                    encodeURIComponent(fn), { method: 'GET', headers: { 'Accept': 'audio/*,*/*' } }); if (!r.ok) throw new Error(
                        '下载失败'); const b = await r.blob(); const u = URL.createObjectURL(b); const a = document.createElement('a');
                a.href = u;
                a.download = dn || fn;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(u);
            } catch (e) {
                window.open(BASE + '/api/download-audio/' + encodeURIComponent(fn),
                    '_blank');
            }
        }

        function stopAudio() {
            if (currentAudioEl) {
                currentAudioEl.pause();
                currentAudioEl = null;
            } const oi = currentPlayIdx;
            currentPlayIdx = -1; if (oi >= 0) {
                const w = document.getElementById('audioProgressWrap' + oi); const b = document
                    .getElementById('playBtn' + oi); if (w) w.style.display = 'none'; if (b) b.textContent = '播放';
            }
        }

        function togglePlayAudio(i) {
            if (currentPlayIdx === i) { stopAudio(); return; }
            stopAudio();
            currentPlayIdx = i; const ae = document.getElementById('audioEl' + i); const b = document.getElementById('playBtn' + i); const
                w = document.getElementById('audioProgressWrap' + i); if (!ae) return;
            currentAudioEl = ae;
            ae.volume = 0.7;
            ae.play().catch(() => {
                showToast('音频加载失败', 'error');
                stopAudio();
            }); if (b) b.textContent = '暂停'; if (w) w.style.display = 'block';
        }

        function onAudioLoaded(i) {
            const ae = document.getElementById('audioEl' + i); const td = document.getElementById(
                'audioTime' + i); if (ae && td && ae.duration) td.textContent = '0:00 / ' + formatTime(ae.duration);
        }

        function onAudioTick(i) {
            const ae = document.getElementById('audioEl' + i); const f = document.getElementById(
                'audioProgressFill' + i); const td = document.getElementById('audioTime' + i); if (ae && f && ae.duration) {
                    const p =
                        (ae.currentTime / ae.duration) * 100;
                    f.style.width = p + '%'; if (td) td.textContent = formatTime(ae.currentTime) + ' / ' + formatTime(ae.duration);
                }
        }

        function onAudioEnd(i) {
            const b = document.getElementById('playBtn' + i); const w = document.getElementById(
                'audioProgressWrap' + i); const f = document.getElementById('audioProgressFill' + i); if (b) b.textContent =
                    '播放'; if (w) w.style.display = 'none'; if (f) f.style.width = '0%';
            currentPlayIdx = -1;
            currentAudioEl = null;
        }

        function onAudioError(i) {
            const b = document.getElementById('playBtn' + i); const w = document.getElementById(
                'audioProgressWrap' + i); if (b) b.textContent = '播放'; if (w) w.style.display = 'none';
            currentPlayIdx = -1;
            currentAudioEl = null;
            showToast('音频加载出错', 'error');
        }

        function seekAudio(e, i) {
            const ae = document.getElementById('audioEl' + i); if (!ae || !ae.duration) return; const r = e
                .currentTarget.getBoundingClientRect(); const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
            ae.currentTime = p * ae.duration;
        }

        function switchTab(tid, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove(
                'active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); const c = document.getElementById(
                tid); if (c) c.classList.add('active'); if (btn) btn.classList.add('active');
        }
        async function clearAllData() {
            if (!await showConfirm('确定清空所有上传文件、文案、翻译和音频数据？此操作不可恢复！')) return;
            stopAudio();
            fileList = [];
            textList = [];
            transList = [];
            audioList = [];
            document.getElementById('fileListSection').style.display = 'none';
            document.getElementById('progressSection').style.display = 'none';
            renderTextList();
            renderTransList();
            renderAudioList();
            updateWorkflowSteps();
            showToast('全部数据已清空', 'success');
        }
        document.addEventListener('DOMContentLoaded', () => {
            renderTextList();
            renderTransList();
            renderAudioList();
            loadVoiceOptions('google');
            updateWorkflowSteps();
        });
    </script>
</body>

</html>
