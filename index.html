                                    <div class="ad-optimization-translation">
                                        <div class="ad-optimization-translation-label">中文翻译:</div>
                                        <div>${v.trans}</div>
                                    </div>
                                </div>
                            </div>`;
                        });

                        container.innerHTML = html || '<div class="result-line">生成失败</div>';
                        container.style.display = 'block';

                    } catch (err) {
                        console.error(err);
                        container.innerHTML = '<div class="result-line">优化失败，请重试</div>';
                        container.style.display = 'block';
                    } finally {
                        UIController.setLoading(btn, loading, false);
                    }
                });
            },

            // 功能4: AI绘画预设优化
            initPaintOptimizer() {
                const resultBox = document.getElementById('paint-result-box');
                const input = document.getElementById('paint-input');
                const genBtn = document.getElementById('paint-generate-btn');
                const clearBtn = document.getElementById('paint-clear-btn');

                const copySinglePrompt = (text) => copyToClipboard(text);
                window.copySinglePrompt = copySinglePrompt;

                const generate = async () => {
                    const userText = input.value.trim();
                    if (!userText) return alert('请输入绘画需求');

                    genBtn.disabled = true;
                    let fullHtml = '';

                    try {
                        for (let i = 1; i <= 3; i++) {
                            resultBox.innerHTML = fullHtml + `<div class="typing-indicator">正在生成第 ${i} 版预设，请稍候...</div>`;

                            const prompt = `你是专业AI绘画提示词架构师，精通Midjourney与Stable Diffusion。

用户输入：${userText}

第一步：自动解析用户真实用意
用户输入可能非常简短、模糊、口语化，你需要智能推断：
- 主体是什么
- 场景/环境
- 风格倾向（写实、动漫、科幻、国风、治愈、赛博、复古等）
- 氛围、色调、情绪
- 构图与画质偏好

第二步：基于解析结果，生成第 ${i} 版专业英文提示词
要求：
- 结构完整：主体 + 场景 + 光影 + 材质 + 画质 + 构图 + 色彩
- 专业、精准、画面感极强
- 适配MJ/SD，可直接使用
- 只输出最终英文提示词，不解释、不分析、不输出中文`;

                            const opt = await this.aiProcessor.getAIResponse(prompt);
                            const finalPrompt = `${opt.trim()}, ${CONFIG.POSITIVE_PROMPT} --no ${CONFIG.NEGATIVE_PROMPT}`;

                            const transPrompt = `请将以下英文绘画提示词翻译成通顺的中文：\n${finalPrompt}`;
                            const trans = await this.aiProcessor.getAIResponse(transPrompt);

                            // 安全处理引号
                            const safePrompt = finalPrompt.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/"/g, "&quot;");

                            fullHtml += `
                            <div class="paint-version">
                                <div class="paint-version-header">
                                    <h4><i class="fas fa-palette"></i> 第${i}版优化</h4>
                                    <button class="paint-copy-btn" onclick='copySinglePrompt("${safePrompt.replace(/'/g, "\\'")}")'><i class="far fa-copy"></i>一键复制</button>
                                </div>
                                <div class="paint-prompt">${finalPrompt}</div>
                                <div class="paint-translate"><strong>中文参考：</strong>${trans}</div>
                            </div>`;

                            resultBox.innerHTML = fullHtml;
                            await delay(300);
                        }

                        fullHtml += `<div class="paint-success"><i class="fas fa-check-circle"></i> 3版提示词优化完成！</div>`;
                        resultBox.innerHTML = fullHtml;

                    } catch (err) {
                        console.error(err);
                        resultBox.innerHTML = `<div style="color:red; padding:10px;">优化失败，请重试</div>`;
                    } finally {
                        genBtn.disabled = false;
                    }
                };

                genBtn.addEventListener('click', generate);
                clearBtn.addEventListener('click', () => {
                    resultBox.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">输入你的绘画需求，点击生成，自动优化3版专业提示词（带中文翻译）</div>`;
                    input.value = '';
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
                });
            },

            // 功能5: YouTube 查询
            initYoutubeModule() {
                const fetchBtn = document.getElementById('youtubeFetchBtn');
                const urlInput = document.getElementById('youtubeUrls');
                const convertBtn = document.getElementById('convertToShortBtn');
                const closePlayerBtn = document.getElementById('closePlayer');

                // 挂载全局函数
                window.showVideoPlayer = this.showVideoPlayer.bind(this);
                window.hideVideoPlayer = this.hideVideoPlayer.bind(this);
                window.copyYoutubeColumn = this.copyYoutubeColumn.bind(this);
                window.toggleSortViews = this.toggleSortViews.bind(this);
                window.processYoutubeUrls = this.processYoutubeUrls.bind(this);
                window.copyImage = this.copyImage.bind(this);
                window.downloadAllThumbnails = this.downloadAllThumbnails.bind(this);
                window.getLosslessShortThumbnail = this.getLosslessShortThumbnail.bind(this);
                window.loadImage = this.loadImage.bind(this);

                window.toggleAllCheckboxes = function (selectAllCheckbox) {
                    const checked = selectAllCheckbox.checked;
                    document.querySelectorAll('.row-checkbox').forEach(cb => {
                        cb.checked = checked;
                        const row = cb.closest('tr');
                        if (row) {
                            checked ? row.classList.add('row-selected') : row.classList.remove('row-selected');
                        }
                    });
                    updateSelectedCount();
                };

                window.copySelectedUrls = function () {
                    const selected = [];
                    document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
                        const url = cb.closest('tr').getAttribute('data-url');
                        if (url) selected.push(url);
                    });
                    if (selected.length === 0) {
                        showToast('⚠️ 请至少选择一个视频');
                        return;
                    }
                    navigator.clipboard.writeText(selected.join('\n')).then(() => {
                        showToast(`✅ 已复制 ${selected.length} 个链接到剪贴板`);
                    });
                };

                // 更新选中计数（可选，显示在按钮上）
                function updateSelectedCount() {
                    const count = document.querySelectorAll('.row-checkbox:checked').length;
                    const btn = document.querySelector('.btn-copy-selected span');
                    if (btn) {
                        btn.textContent = count > 0 ? `复制选中 (${count})` : '复制选中';
                    }
                }

                // 绑定事件
                fetchBtn.addEventListener('click', () => this.processYoutubeUrls());
                urlInput.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') this.processYoutubeUrls(); });
                convertBtn.addEventListener('click', () => this.convertToShort());
                closePlayerBtn.addEventListener('click', () => this.hideVideoPlayer());
            },

            // YouTube 辅助方法
            extractVideoId(url) {
                try {
                    if (url.includes('youtube.com/watch?v=')) return url.split('v=')[1].split('&')[0];
                    if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
                    if (url.includes('youtube.com/shorts/')) return url.split('shorts/')[1].split('?')[0];
                } catch (e) { }
                return null;
            },

            formatNumber(num) {
                const n = parseInt(num);
                if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
                if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
                return n.toString();
            },

            parseDuration(duration) {
                const m = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/) || [];
                const parts = [];
                if (m[1]) parts.push(m[1] + '小时');
                if (m[2]) parts.push(m[2] + '分钟');
                if (m[3]) parts.push(m[3] + '秒');
                return parts.join('') || "未知";
            },

            formatUploadDate(dateStr) {
                const d = new Date(dateStr);
                const now = new Date();
                const diff = Math.floor((now - d) / 86400000);
                if (diff === 0) return "今天";
                if (diff === 1) return "昨天";
                if (diff < 30) return diff + "天前";
                if (diff < 365) return Math.floor(diff / 30) + "个月前";
                return Math.floor(diff / 365) + "年前";
            },

            getAvailableYtApiKey() {
                for (const key of CONFIG.YT_API_KEYS) {
                    if (STATE.ytApiKeyStatus[key].isActive && !STATE.ytApiKeyStatus[key].quotaExceeded) return key;
                }
                showToast("所有API今日配额已用尽，请明天再试");
                return null;
            },

            async fetchVideoData(vid) {
                const key = this.getAvailableYtApiKey();
                if (!key) return null;
                try {
                    const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails,snippet&id=${vid}&key=${key}`);
                    if (r.status === 403) {
                        STATE.ytApiKeyStatus[key].quotaExceeded = true;
                        return this.fetchVideoData(vid); // 递归尝试下一个 Key
                    }
                    const j = await r.json();
                    return j.items?.[0] || null;
                } catch {
                    return null;
                }
            },

            async getBestThumbnail(vid) {
                const list = ['maxresdefault', 'hqdefault', 'mqdefault', 'default'];
                for (const q of list) {
                    const u = `https://i.ytimg.com/vi/${vid}/${q}.jpg`;
                    try {
                        const r = await fetch(u, { method: 'HEAD' });
                        if (r.ok) return u;
                    } catch { }
                }
                return `https://i.ytimg.com/vi/${vid}/default.jpg`;
            },

            loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            },

            async getLosslessShortThumbnail(videoId) {
                try {
                    const highResUrl = await this.getBestThumbnail(videoId);
                    if (!highResUrl.includes('maxresdefault.jpg')) return highResUrl;

                    const img = await this.loadImage(highResUrl);
                    const canvas = document.createElement('canvas');
                    canvas.width = img.height * (9 / 16);
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(
                        img,
                        Math.round((img.width - canvas.width) / 2), 0, Math.round(canvas.width), img.height,
                        0, 0, canvas.width, canvas.height
                    );
                    return canvas.toDataURL('image/jpeg', 0.9);
                } catch (error) {
                    console.error('缩略图裁剪失败', error);
                    return await this.getBestThumbnail(videoId);
                }
            },

            async copyImage(img) {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const tempImg = new Image();
                    tempImg.crossOrigin = 'anonymous';
                    tempImg.src = img.src;
                    await new Promise((resolve, reject) => { tempImg.onload = resolve; tempImg.onerror = reject; });
                    canvas.width = tempImg.naturalWidth;
                    canvas.height = tempImg.naturalHeight;
                    ctx.drawImage(tempImg, 0, 0);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    showToast("缩略图已复制");
                } catch (error) {
                    console.error("复制失败:", error);
                    await copyToClipboard(img.src);
                    showToast("复制失败，已复制图片链接");
                }
            },

            async downloadAllThumbnails() {
                const imgs = document.querySelectorAll(".youtube-thumbnail");
                if (!imgs.length) return;
                const zip = new JSZip();
                const f = zip.folder("youtube_thumbnails");
                const dp = document.getElementById("downloadProgress");
                dp.style.display = "block";

                for (let i = 0; i < imgs.length; i++) {
                    try {
                        const r = await fetch(imgs[i].src);
                        const b = await r.blob();
                        f.file(`${i + 1}.jpg`, b);
                        const pct = Math.round(((i + 1) / imgs.length) * 100);
                        document.getElementById("downloadProgressBar").style.width = pct + "%";
                        document.getElementById("downloadProgressPercent").innerText = pct + "%";
                        document.getElementById("downloadProgressText").innerText = `打包中 ${i + 1}/${imgs.length}`;
                    } catch { }
                }
                const blob = await zip.generateAsync({ type: "blob" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "youtube_thumbnails.zip";
                a.click();
                dp.style.display = "none";
                showToast("全部缩略图已打包下载");
            },

            showVideoPlayer(url) {
                const vid = this.extractVideoId(url);
                if (!vid) return;
                STATE.currentVideoId = vid;
                const o = document.getElementById("videoPlayerOverlay");
                o.classList.add("show");
                if (STATE.youtubeApiReady && STATE.ytPlayer) {
                    setTimeout(() => {
                        STATE.ytPlayer.loadVideoById(vid);
                        STATE.ytPlayer.playVideo();
                    }, 100);
                }
            },

            hideVideoPlayer() {
                const o = document.getElementById("videoPlayerOverlay");
                o.classList.remove("show");
                if (STATE.ytPlayer) STATE.ytPlayer.stopVideo();
            },

            copyYoutubeColumn(colIndex) {
                const table = document.querySelector('.youtube-table');
                if (!table) return;
                const rows = table.querySelectorAll('tbody tr');
                const textList = [];
                rows.forEach(row => {
                    const cell = row.cells[colIndex];
                    if (!cell) return;
                    let val = cell.innerText.trim().replace(/^获取失败$/, '');
                    if (!val) return;
                    if (colIndex === 4) val = `播放量：${val}`;
                    textList.push(val);
                });
                if (textList.length) copyToClipboard(textList.join('\n')).then(() => showToast(`已复制该列共 ${textList.length} 条数据`));
            },

            parseViewCount(str) {
                if (!str || str.includes('失败')) return 0;
                str = str.trim();
                if (str.includes('亿')) return parseFloat(str) * 100000000;
                if (str.includes('w')) return parseFloat(str) * 10000;
                const num = parseInt(str.replace(/[^0-9]/g, ''));
                return isNaN(num) ? 0 : num;
            },

            toggleSortViews() {
    const tbody = document.querySelector('.youtube-table tbody');
    if (!tbody) return;
 
    const icon = document.getElementById('sortIcon');
    const rows = Array.from(tbody.querySelectorAll('tr'));
 
    // 三态循环：original → desc → asc → original  （改这里）
    switch (STATE.sortState) {
        case 'original':
            // 当前原始顺序 → 切换到降序（优先倒序）
            rows.sort((a, b) => {
                const viewA = this.parseViewCount(a.cells[4].innerText);
                const viewB = this.parseViewCount(b.cells[4].innerText);
                return viewB - viewA;  // 降序 
            });
            STATE.sortState = 'desc';
            icon.className = 'fas fa-sort-amount-down';
            showToast('播放量已降序排列（从高到低）');
            break;
 
        case 'desc':
            // 当前降序 → 切换到升序 
            rows.sort((a, b) => {
                const viewA = this.parseViewCount(a.cells[4].innerText);
                const viewB = this.parseViewCount(b.cells[4].innerText);
                return viewA - viewB;  // 升序 
            });
            STATE.sortState = 'asc';
            icon.className = 'fas fa-sort-amount-up';
            showToast('播放量已升序排列（从低到高）');
            break;
 
        case 'asc':
            // 当前升序 → 恢复原始顺序 
            if (STATE.originalRows.length > 0) {
                tbody.innerHTML = '';
                STATE.originalRows.forEach(row => tbody.appendChild(row));
            }
            STATE.sortState = 'original';
            icon.className = 'fas fa-sort';
            showToast('已恢复原始顺序');
            break;
    }
 
    // 如果不是恢复原始顺序，则需要将排序后的行重新插入 
    if (STATE.sortState !== 'original') {
        rows.forEach(row => tbody.appendChild(row));
    }
},

            convertToShort() {
                const textarea = document.getElementById('youtubeUrls');
                const text = textarea.value.trim();
                if (!text) return showToast('请先输入链接');

                const lines = text.split('\n').map(line => line.trim());
                const result = lines.map(line => {
                    const vid = this.extractVideoId(line);
                    return vid ? `https://www.youtube.com/shorts/${vid}` : line;
                });

                textarea.value = result.join('\n');
                showToast('已转换为 Shorts 标准链接');
            },

            validUrls: [], // 暂存当前有效链接

            async processYoutubeUrls() {
                const text = document.getElementById("youtubeUrls").value.trim();
                const lines = text.split("\n").map(i => i.trim()).filter(Boolean);
                if (lines.length === 0) return showToast("请输入至少一个YouTube链接");

                const btn = document.getElementById("youtubeFetchBtn");
                const bar = document.getElementById("youtubeProgressContainer");
                const pText = document.getElementById("youtubeProgressText");
                const pCount = document.getElementById("youtubeProgressCount");
                const pBar = document.getElementById("youtubeProgressBar");
                const area = document.getElementById("youtubeResultsArea");

                btn.disabled = true;
                bar.style.display = "block";
                area.innerHTML = "";
                this.validUrls = [];

                // 创建表格
                const table = document.createElement("table");
                table.className = "youtube-table";
                table.innerHTML = `
    <thead>
        <tr>
            <th class="select-col">
                <div class="select-all-checkbox-wrap">
                    <input type="checkbox" id="selectAllCheckbox" onclick="toggleAllCheckboxes(this)" title="全选/取消全选">
                    <button class="btn-copy-selected" 
                            onclick="event.stopPropagation(); copySelectedUrls()" 
                            title="复制选中行的链接">
                        <i class="fas fa-copy"></i>
                        <span>复制选中</span>
                    </button>
                </div>
            </th>
            <th onclick="window.copyYoutubeColumn(1)">视频链接<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制整列</small></th>
            <th onclick="window.copyYoutubeColumn(2)">标题<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(3)">频道<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(4)" style="cursor: pointer;">
                播放
                <button id="sortViewsBtn" class="sort-btn" onclick="event.stopPropagation(); window.toggleSortViews();" style="margin-left:5px;">
                    <i id="sortIcon" class="fas fa-sort"></i>
                </button>
            </th>
            <th onclick="window.copyYoutubeColumn(5)">评论<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(6)">发布<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(7)">时长<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.downloadAllThumbnails()" title="点击打包下载所有缩略图">缩略图<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击打包下载</small></th>
        </tr>
    </thead>
    <tbody></tbody>
`;
                area.appendChild(table);
                const tbody = table.querySelector("tbody");

                for (let i = 0; i < lines.length; i++) {
                    const url = lines[i];
                    const vid = this.extractVideoId(url);

                    // 更新进度条
                    pText.innerText = `正在查询 ${i + 1}/${lines.length}`;
                    pCount.innerText = `${i + 1}/${lines.length}`;
                    pBar.style.width = ((i + 1) / lines.length) * 100 + "%";

                    if (!vid) continue;
                    this.validUrls.push(url);
                    const isShort = url.includes("shorts");

                    const tr = document.createElement("tr");
                    tr.setAttribute('data-url', url);   // 存储原始链接方便复制 

                    // 新增：复选框列（美化版）
                    const tdCheck = document.createElement("td");
                    tdCheck.className = "select-col";
                    const cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.className = "row-checkbox";
                    // 勾选/取消时切换行高亮
                    cb.addEventListener('change', function () {
                        if (this.checked) {
                            tr.classList.add('row-selected');
                        } else {
                            tr.classList.remove('row-selected');
                        }
                        updateSelectedCount();
                    });
                    tdCheck.appendChild(cb);
                    tr.appendChild(tdCheck);

                    // 1. 链接
                    const td1 = document.createElement("td");
                    td1.innerHTML = `
                        <div style="font-size:12px;word-break:break-all;margin-bottom:6px;">${url}</div>
                        <div class="youtube-link-btns">
                            <button class="youtube-link-btn play" onclick="window.showVideoPlayer('${url}')"><i class="fas fa-play"></i>播放</button>
                            <button class="youtube-link-btn jump" onclick="window.open('${url}','_blank')"><i class="fas fa-external-link-alt"></i>打开</button>
                            <button class="youtube-link-btn copy" onclick="navigator.clipboard.writeText('${url}').then(()=>showToast('链接已复制'))"><i class="fas fa-copy"></i>复制</button>
                        </div>`;
                    tr.appendChild(td1);

                    // 2-7. 占位
                    const td2 = document.createElement("td"); td2.className = "youtube-title-cell"; td2.innerText = "加载中..."; tr.appendChild(td2);
                    const td3 = document.createElement("td"); td3.innerText = "..."; tr.appendChild(td3);
                    const td4 = document.createElement("td"); td4.innerText = "..."; tr.appendChild(td4);
                    const td5 = document.createElement("td"); td5.innerText = "..."; tr.appendChild(td5);
                    const td6 = document.createElement("td"); td6.innerText = "..."; tr.appendChild(td6);
                    const td7 = document.createElement("td"); td7.innerText = "..."; tr.appendChild(td7);

                    // 8. 缩略图
                    const td8 = document.createElement("td");
                    const wrap = document.createElement("div");
                    wrap.className = "youtube-thumbnail-container";
                    const img = document.createElement("img");
                    img.className = "youtube-thumbnail";
                    img.src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
                    const badge = document.createElement("div");
                    badge.className = "youtube-badge";
                    badge.innerText = isShort ? `#${i + 1}竖` : `#${i + 1}`;
                    wrap.appendChild(img); wrap.appendChild(badge); td8.appendChild(wrap);
                    tr.appendChild(td8);

                    tbody.appendChild(tr);

                    // 点击复制事件
                    [td2, td3, td4, td5, td6, td7].forEach(cell => {
                        cell.onclick = () => copyToClipboard(cell.innerText);
                    });
                    img.onclick = async () => {
                        await this.copyImage(img);
                        badge.innerText = "已复制";
                    };

                    // 异步拉取数据并回填
                    const data = await this.fetchVideoData(vid);
                    if (data) {
                        const t = data.snippet.title;
                        td2.innerText = t.length > 22 ? t.substring(0, 22) + "..." : t;
                        td2.title = t;
                        td3.innerText = data.snippet.channelTitle;
                        td4.innerHTML = `<span class="youtube-view-count">${this.formatNumber(data.statistics.viewCount || 0)}</span>`;
                        td5.innerText = this.formatNumber(data.statistics.commentCount || 0);
                        td6.innerText = this.formatUploadDate(data.snippet.publishedAt);
                        td7.innerText = this.parseDuration(data.contentDetails.duration);

                        if (isShort) {
                            this.getLosslessShortThumbnail(vid).then(u => img.src = u);
                        } else {
                            this.getBestThumbnail(vid).then(u => img.src = u);
                        }
                    } else {
                        [td2, td3, td4, td5, td6, td7].forEach(c => c.innerHTML = `<span class='youtube-error'>获取失败</span>`);
                    }
                }
// 保存原始行顺序（所有行都已插入 tbody）
STATE.originalRows = Array.from(tbody.children);
STATE.sortState = 'original';   // 重置排序状态
                
                btn.disabled = false;
                pText.innerText = "查询完成";
                showToast("YouTube 数据查询完成");
            }
        };

        // ================== 全局 YouTube API 回调 ==================
        window.onYouTubeIframeAPIReady = function () {
            STATE.youtubeApiReady = true;
            STATE.ytPlayer = new YT.Player('playerContainer', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
                events: {
                    onError: () => {
                        showToast("视频无法播放，已为你打开新标签页");
                        window.open(`https://youtu.be/${STATE.currentVideoId}`, "_blank");
                        Modules.hideVideoPlayer();
                    }
                }
            });
        };

        // ================== 主入口 ==================
        document.addEventListener('DOMContentLoaded', function () {
            const ai = new AITitleProcessor();
            UIController.init();
            Modules.init(ai);
            // hljs.highlightAll(); // 初始页面无代码块，按需高亮
        });
    </script>
