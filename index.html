<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI多功能工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --text-color: #2b2d42;
            --text-secondary: #5a6268;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --warning-color: #f8961e;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 15px 30px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            height: 100vh;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .function-area {
            width: 380px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .tool-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-color);
        }

        .tool-card.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.05), rgba(76, 201, 240, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title .icon {
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border-radius: 50%;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        .result-area {
            flex: 1;
            min-height: calc(100vh - 3rem);
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 2rem;
            overflow-y: auto;
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .function-panel {
            display: none;
            width: 100%;
            height: 100%;
        }

        .function-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .input-group {
            margin-bottom: 1.75rem;
            width: 100%;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 140px;
            resize: vertical;
            transition: var(--transition);
            background-color: var(--bg-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            cursor: pointer;
            outline: none;
            border: 0;
            vertical-align: middle;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            text-transform: uppercase;
            padding: 1.25em 2em;
            background: #e0f7fa;
            border: 2px solid #4fc3f7;
            border-radius: 0.75em;
            transform-style: preserve-3d;
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                background 150ms cubic-bezier(0, 0, 0.58, 1);
            white-space: nowrap;
        }

        .btn::before {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #80deea;
            border-radius: inherit;
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.625em 0 0 #b3e5fc;
            transform: translate3d(0, 0.75em, -1em);
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
            z-index: -1;
        }

        .btn:hover {
            background: #b2ebf2;
            transform: translate(0, 0.25em);
        }

        .btn:hover::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.5em 0 0 #b3e5fc;
            transform: translate3d(0, 0.5em, -1em);
        }

        .btn:active {
            background: #b2ebf2;
            transform: translate(0em, 0.75em);
        }

        .btn:active::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0 #b3e5fc;
            transform: translate3d(0, 0, -1em);
        }

        .btn:disabled {
            background: #e0e0e0;
            border-color: #bdbdbd;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: none;
            gap: 0.75rem;
        }

        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-container {
            margin-top: 1.75rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        .result-header {
            padding: 0.875rem 1.25rem;
            background-color: rgba(248, 249, 250, 0.9);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-content {
            padding: 0.5rem;
            line-height: 1.6;
            background-color: var(--card-bg);
            white-space: pre-wrap;
            font-size: 0.9rem;
            overflow-y: auto;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .empty-tip {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            gap: 1rem;
        }

        .empty-tip i {
            font-size: 3rem;
            color: var(--border-color);
        }

        /* 绘画提示词优化专用样式 */
        .paint-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1rem;
        }

        .paint-result-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-color);
        }

        .paint-version {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .paint-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .paint-version h4 {
            font-size: 14px;
            color: #4361ee;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .paint-copy-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4361ee;
            transition: all 0.2s;
        }

        .paint-copy-btn:hover {
            background: #4361ee;
            color: white;
        }

        .paint-prompt {
            font-size: 13px;
            line-height: 1.5;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 8px;
        }

        .paint-translate {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
            border-left: 3px solid #4361ee;
            margin-top: 6px;
        }

        .paint-success {
            text-align: center;
            padding: 16px;
            color: #10b981;
            font-weight: bold;
            font-size: 15px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            margin-top: 8px;
        }

        .paint-input-container {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
            margin-top: 0.5rem;
        }

        .paint-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            min-height: 60px;
            max-height: 150px;
            background-color: var(--card-bg);
            transition: var(--transition);
            line-height: 1.5;
        }

        .paint-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .paint-btn {
            padding: 0.75rem;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 60px;
        }

        .paint-btn:hover {
            background: linear-gradient(135deg, #3a56d4, #3ab6e0);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .paint-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .paint-clear-btn {
            padding: 0.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            min-height: 40px;
        }

        .paint-clear-btn:hover {
            background-color: rgba(67, 97, 238, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            background-color: #e6f7ff;
            border-radius: 12px;
            display: inline-flex;
            border: 1px solid #91d5ff;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin: 0 2px;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .function-area {
                width: 100%;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }

            .tool-card {
                width: calc(50% - 0.5rem);
            }

            .result-area {
                flex: none;
                width: 100%;
                height: auto;
                min-height: 500px;
            }
        }

        @media (max-width: 768px) {
            body {
                font-size: 15px;
                overflow-y: auto;
                height: auto;
            }

            .container {
                padding: 1rem;
                gap: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .tool-card {
                width: 100%;
            }

            .result-area {
                padding: 1.5rem;
                min-height: 400px;
            }

            textarea {
                min-height: 120px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="function-area">
            <header>
                <h1>Wow工具集合</h1>
                <p class="subtitle">常用的一些工具的集合</p>
            </header>

            <div class="tool-card" data-target="panel1">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon"><i class="fas fa-align-left"></i></span>
                        翻译结果分行
                    </div>
                    <div class="card-desc">识别语言并分行</div>
                </div>
            </div>

            <div class="tool-card" data-target="panel2">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon"><i class="fas fa-link"></i></span>
                        Wow链接填表
                    </div>
                    <div class="card-desc">把发给运营的发给我</div>
                </div>
            </div>

            <div class="tool-card" data-target="panel3">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon"><i class="fas fa-magic"></i></span>
                        广告文案优化
                    </div>
                    <div class="card-desc">把文案给我(仅限青少年)</div>
                </div>
            </div>

            <div class="tool-card" data-target="panel4">
                <div class="card-header">
                    <div class="card-title">
                        <span class="icon"><i class="fas fa-palette"></i></span>
                        AI绘画预设优化
                    </div>
                    <div class="card-desc">输入文本，自动优化3次高质量提示词</div>
                </div>
            </div>
        </div>

        <div class="result-area" id="resultArea">
            <div class="empty-tip" id="emptyTip">
                <i class="fas fa-hand-pointer"></i>
                请选择左侧的功能开始操作
            </div>

            <div class="function-panel" id="panel1">
                <div class="input-group">
                    <label for="text-separator-input"><i class="fas fa-info-circle"></i>输入需要分隔的文本</label>
                    <textarea id="text-separator-input" placeholder="例如: 你好,世界"></textarea>
                </div>
                <button class="btn" id="text-separator-btn"><i class="fas fa-cut"></i> 分隔文本并识别语言</button>
                <div class="loading" id="separator-loading">
                    <div class="spinner"></div>正在全速处理中...
                </div>
            </div>

            <div class="function-panel" id="panel2">
                <div class="input-group">
                    <label for="link-lang-input"><i class="fas fa-info-circle"></i>输入包含链接的文本</label>
                    <textarea id="link-lang-input" placeholder="例如: zoo  译  @孟详皓..."></textarea>
                </div>
                <button class="btn" id="link-lang-btn"><i class="fas fa-extract"></i> 提取链接和语言</button>
                <div class="loading" id="link-lang-loading">
                    <div class="spinner"></div>正在提取...
                </div>
            </div>

            <div class="function-panel" id="panel3">
                <div class="input-group">
                    <label for="ad-text-input"><i class="fas fa-info-circle"></i>输入需要优化的广告文案</label>
                    <textarea id="ad-text-input" placeholder="例如: design your skin for roblox"></textarea>
                </div>
                <button class="btn" id="ad-text-btn"><i class="fas fa-wand-magic-sparkles"></i> 优化文案</button>
                <div class="loading" id="ad-text-loading">
                    <div class="spinner"></div>正在优化...
                </div>
            </div>

            <!-- 功能4：AI绘画预设优化（升级版） -->
            <div class="function-panel" id="panel4">
                <div class="paint-container">
                    <div class="paint-result-box" id="paint-result-box">
                        <div style="text-align:center; color:#64748b; padding:20px;">
                            输入你的绘画需求，点击生成，自动优化3版专业提示词（带中文翻译）
                        </div>
                    </div>
                    <div class="paint-input-container">
                        <textarea class="paint-input" id="paint-input"
                            placeholder="输入简单描述，例如：一只可爱的白色小猫，坐在花园里"></textarea>
                        <div class="button-group">
                            <button class="paint-btn" id="paint-generate-btn"><i class="fas fa-magic"></i><span
                                    class="btn-text">生成</span></button>
                            <button class="paint-clear-btn" id="paint-clear-btn"><i class="fas fa-trash-alt"></i><span
                                    class="btn-text">清空</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> 已复制到剪贴板</div>

    <script>
        class AITitleProcessor {
            constructor() {
                this.apiKey = "6869437c-0d6b-42ee-8c6d-4c865ca9b475";
                this.apiUrl = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";
            }
            async getAIResponse(prompt) {
                try {
                    const response = await fetch(this.apiUrl, {
                        method: "POST",
                        headers: { Authorization: `Bearer ${this.apiKey}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "ep-20250813143100-7b9vf", messages: [{ role: "user", content: prompt }] })
                    });
                    if (!response.ok) throw new Error(`AI请求失败: ${response.status}`);
                    const result = await response.json();
                    return result.choices?.[0]?.message?.content?.trim() || '';
                } catch (error) {
                    console.error("AI请求错误:", error);
                    throw error;
                }
            }
        }

        const POSITIVE_PROMPT = "masterpiece, best quality, 8K UHD, ultra detailed, hyper realistic, intricate details, sharp focus, cinematic lighting, professional photography, vibrant colors, depth of field, cinematic composition";
        const NEGATIVE_PROMPT = "worst quality, low quality, blurry, pixelated, ugly, deformed, disfigured, bad anatomy, extra limbs, missing fingers, watermark, text, signature";

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // 复制单版提示词
        function copySinglePrompt(text) {
            navigator.clipboard.writeText(text).then(() => showToast());
        }

        document.addEventListener('DOMContentLoaded', function () {
            const aiProcessor = new AITitleProcessor();
            const toolCards = document.querySelectorAll('.tool-card');
            const functionPanels = document.querySelectorAll('.function-panel');
            const resultArea = document.getElementById('resultArea');
            const emptyTip = document.getElementById('emptyTip');

            toolCards.forEach(card => {
                card.addEventListener('click', function () {
                    toolCards.forEach(c => c.classList.remove('active'));
                    functionPanels.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.target).classList.add('active');
                    resultArea.classList.add('show');
                    emptyTip.style.display = 'none';
                });
            });

            // ====================== 功能4：AI绘画预设优化（带中文翻译 + 一键复制） ======================
            const paintResultBox = document.getElementById('paint-result-box');
            const paintInput = document.getElementById('paint-input');
            const paintGenerateBtn = document.getElementById('paint-generate-btn');
            const paintClearBtn = document.getElementById('paint-clear-btn');

            async function generatePaintPrompt() {
                const userText = paintInput.value.trim();
                if (!userText) { alert('请输入绘画需求'); return; }

                paintGenerateBtn.disabled = true;
                paintResultBox.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;

                try {
                    let fullHtml = '';
                    for (let i = 1; i <= 3; i++) {
                        paintResultBox.innerHTML = fullHtml + `<div class="typing-indicator">正在生成第 ${i} 版预设，请稍候...</div>`;

                        // 生成提示词
                        const prompt = `你是顶级AI绘画提示词工程师，用户需求：${userText}，生成专业完整提示词，只输出结果`;
                        const optimized = await aiProcessor.getAIResponse(prompt);
                        const finalPrompt = `${optimized.trim()}, ${POSITIVE_PROMPT} --no ${NEGATIVE_PROMPT}`;

                        // 生成中文翻译
                        const translatePrompt = `请把这段AI绘画提示词翻译成通顺自然的中文：${finalPrompt}`;
                        const translateResult = await aiProcessor.getAIResponse(translatePrompt);

                        // 拼接带复制按钮 + 中文翻译
                        fullHtml += `
                        <div class="paint-version">
                            <div class="paint-version-header">
                                <h4><i class="fas fa-palette"></i> 第${i}版优化</h4>
                                <button class="paint-copy-btn" onclick='copySinglePrompt(\`${finalPrompt.replace(/`/g, "")}\`)'><i class="far fa-copy"></i>一键复制</button>
                            </div>
                            <div class="paint-prompt">${finalPrompt}</div>
                            <div class="paint-translate"><strong>中文参考：</strong>${translateResult}</div>
                        </div>`;

                        paintResultBox.innerHTML = fullHtml;
                        await delay(600);
                    }

                    fullHtml += `<div class="paint-success"><i class="fas fa-check-circle"></i> 3版提示词优化完成！带中文翻译，可直接复制使用</div>`;
                    paintResultBox.innerHTML = fullHtml;

                } catch (err) {
                    paintResultBox.innerHTML = `<div style="color:red; padding:10px;">优化失败，请重试</div>`;
                    console.error(err);
                } finally {
                    paintGenerateBtn.disabled = false;
                }
            }

            function clearPaintResult() {
                paintResultBox.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">输入你的绘画需求，点击生成，自动优化3版专业提示词（带中文翻译）</div>`;
                paintInput.value = '';
            }

            paintGenerateBtn.addEventListener('click', generatePaintPrompt);
            paintClearBtn.addEventListener('click', clearPaintResult);

            paintInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generatePaintPrompt();
                }
            });
        });
    </script>
</body>

</html>
