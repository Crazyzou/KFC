<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wow工具箱</title>
    <link rel="icon" href="https://i.pinimg.com/originals/5c/2b/20/5c2b2023053650ec890d690da18880fa.jpg"
        type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js">
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --text-color: #2b2d42;
            --text-secondary: #5a6268;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --warning-color: #f8961e;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 15px 30px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
            --youtube-red: #ff0000;
            --youtube-pink: #FF8E8E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            height: 100vh;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .function-area {
            width: 380px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .tool-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-color);
        }

        .tool-card.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.05), rgba(76, 201, 240, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title .icon {
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border-radius: 50%;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        .result-area {
            flex: 1;
            min-height: calc(100vh - 3rem);
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 2rem;
            overflow-y: auto;
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .function-panel {
            display: none;
            width: 100%;
            height: 100%;
        }

        .function-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .input-group {
            margin-bottom: 1.75rem;
            width: 100%;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 140px;
            resize: vertical;
            transition: var(--transition);
            background-color: var(--bg-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            cursor: pointer;
            outline: none;
            border: 0;
            vertical-align: middle;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            text-transform: uppercase;
            padding: 1.25em 2em;
            background: #e0f7fa;
            border: 2px solid #4fc3f7;
            border-radius: 0.75em;
            transform-style: preserve-3d;
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                background 150ms cubic-bezier(0, 0, 0.58, 1);
            white-space: nowrap;
        }

        .btn::before {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #80deea;
            border-radius: inherit;
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.625em 0 0 #b3e5fc;
            transform: translate3d(0, 0.75em, -1em);
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
            z-index: -1;
        }

        .btn:hover {
            background: #b2ebf2;
            transform: translate(0, 0.25em);
        }

        .btn:hover::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.5em 0 0 #b3e5fc;
            transform: translate3d(0, 0.5em, -1em);
        }

        .btn:active {
            background: #b2ebf2;
            transform: translate(0em, 0.75em);
        }

        .btn:active::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0 #b3e5fc;
            transform: translate3d(0, 0, -1em);
        }

        .btn:disabled {
            background: #e0e0e0;
            border-color: #bdbdbd;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: none;
            gap: 0.75rem;
        }

        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-container {
            margin-top: 1.75rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        .result-header {
            padding: 0.875rem 1.25rem;
            background-color: rgba(248, 249, 250, 0.9);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-content {
            padding: 0.5rem;
            line-height: 1.6;
            background-color: var(--card-bg);
            white-space: pre-wrap;
            font-size: 0.9rem;
            overflow-y: auto;
        }

        .result-line {
            position: relative;
            padding: 0.5rem 1.75rem 0.5rem 0.75rem;
            margin: 0;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .result-line:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }

        .line-copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .result-line:hover .line-copy-btn {
            opacity: 0.7;
        }

        .line-copy-btn:hover {
            opacity: 1 !important;
            color: var(--primary-color);
            background: rgba(67, 97, 238, 0.1);
        }

        .line-copy-btn i {
            font-size: 0.85rem;
        }

        .link-lang-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .link-lang-table thead {
            background-color: rgba(248, 249, 250, 0.9);
        }

        .link-lang-table th,
        .link-lang-table td {
            padding: 0.875rem 1.25rem;
            border: 1px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-lang-table th {
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
        }

        .link-lang-table td {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .link-lang-table tr:hover td {
            background-color: rgba(67, 97, 238, 0.05);
        }

        .header-copy-btn {
            margin-left: 0.75rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-secondary);
        }

        .header-copy-btn i {
            font-size: 0.7rem;
        }

        .header-copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn i {
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .toast i {
            font-size: 1.1rem;
        }

        .empty-tip {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            gap: 1rem;
        }

        .empty-tip i {
            font-size: 3rem;
            color: var(--border-color);
        }

        .lang-result-box {
            margin-top: 1.5em;
            background-color: rgba(67, 97, 238, 0.05);
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-color);
        }

        .lang-result-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-result-value {
            font-size: 1rem;
        }

        .markdown-content {
            font-family: inherit;
            line-height: 1.7;
            color: var(--text-color);
            overflow-wrap: break-word;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }

        .markdown-content h1 {
            font-size: 1.8em;
        }

        .markdown-content h2 {
            font-size: 1.5em;
        }

        .markdown-content h3 {
            font-size: 1.3em;
        }

        .markdown-content h4 {
            font-size: 1.1em;
        }

        .markdown-content h5 {
            font-size: 1em;
        }

        .markdown-content h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .markdown-content p {
            margin-bottom: 1.2em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1.2em;
            padding-left: 2em;
        }

        .markdown-content li {
            margin-bottom: 0.5em;
        }

        .markdown-content pre {
            position: relative;
            background-color: #282c34;
            border-radius: var(--radius-sm);
            padding: 1em;
            overflow-x: auto;
            margin: 1.2em 0;
        }

        .markdown-content pre code {
            display: block;
            padding: 0;
            background: transparent;
            color: #abb2bf;
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .markdown-content code.inline-code {
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            background-color: rgba(175, 184, 193, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
            color: #e06c75;
        }

        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #abb2bf;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            z-index: 1;
            transition: all 0.2s;
        }

        .code-copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .markdown-content pre:hover .code-copy-btn {
            opacity: 1;
        }

        .markdown-content blockquote {
            margin: 1.2em 0;
            padding: 0.8em 1.2em;
            border-left: 4px solid var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
            color: var(--text-secondary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .markdown-content a:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2em 0;
            border: 1px solid var(--border-color);
        }

        .markdown-content th,
        .markdown-content td {
            padding: 0.75em 1em;
            border: 1px solid var(--border-color);
        }

        .markdown-content th {
            background-color: rgba(248, 249, 250, 0.9);
            font-weight: 600;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.5em 0;
        }

        .markdown-content img {
            max-width: 100%;
            border-radius: var(--radius-sm);
        }

        .ad-optimization-result {
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .ad-optimization-header {
            padding: 0.75rem 1rem;
            background-color: rgba(67, 97, 238, 0.1);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ad-optimization-content {
            padding: 1rem;
            background-color: var(--card-bg);
        }

        .ad-optimization-version {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .ad-optimization-text {
            margin-bottom: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ad-optimization-translation {
            padding: 0.75rem;
            background-color: rgba(76, 201, 240, 0.1);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-color);
        }

        .ad-optimization-translation-label {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--accent-color);
        }

        .paint-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .paint-result-box {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .paint-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .paint-version-header h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .paint-copy-btn {
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .paint-copy-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .paint-prompt {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color);
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            background: rgba(67, 97, 238, 0.03);
            border-radius: var(--radius-sm);
        }

        .paint-translate {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 0.75rem;
            background: rgba(76, 201, 240, 0.05);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-color);
        }

        .paint-success {
            text-align: center;
            padding: 1rem;
            color: var(--success-color);
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .typing-indicator {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .paint-input-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .paint-input {
            min-height: 120px;
            font-size: 1rem;
            border-radius: var(--radius-sm);
            padding: 1rem;
            border: 1px solid var(--border-color);

        .history-detail {

        .history-back-btn {

        @media (max-width: 1024px) {

            YT_API_KEYS: [
                "AIzaSyBX7YiD9hL6V5_uoG-5dVvoZ6mdNTvLWIM",
                "AIzaSyDIC5HCCD0UIjHu3F988-3rYg7Eax2hnAQ",

            ],
            // ⚡ 并发查询数（可调整：建议4-8，默认6）
            YT_CONCURRENT_BATCH_SIZE: 10
        };

        const STATE = {
            extractedLinks: [],
            extractedLangs: [],
            ytApiKeyStatus: {},
            youtubeApiReady: false,
            ytPlayer: null,
            currentVideoId: "",
            sortState: 'original',
            originalRows: [],
            // ⚡ Key池轮换索引
            currentKeyIndex: 0
        };

        CONFIG.YT_API_KEYS.forEach(key => {
            STATE.ytApiKeyStatus[key] = { lastUsed: null, errorCount: 0, isActive: true, quotaExceeded: false };
        });

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function showToast(msg = "已复制到剪贴板") {
            const toast = document.getElementById('toast');
            document.getElementById("toastMessage").innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text) {
            return navigator.clipboard.writeText(text).then(() => showToast()).catch(err => console.error('复制失败:', err));
        }

        function copyLineText(button) {
            copyToClipboard(button.parentElement.textContent.replace('复制', '').trim());
        }

        function copyCodeBlock(button) {
            const code = button.parentElement.querySelector('code').textContent;
            copyToClipboard(code).then(() => {
                const originalText = button.textContent;
                button.textContent = '已复制!';
                setTimeout(() => button.textContent = originalText, 2000);
            });
        }

        function openShortsPlayer(videoUrl, videoData) {
            const overlay = document.getElementById('shortsPlayerOverlay');
            document.getElementById('shortsChannelNameBottom').innerText = videoData.channel || '频道名称';
            const avatar = document.getElementById('shortsChannelAvatar');
            if (videoData.channel) {
                avatar.style.backgroundColor = stringToColor(videoData.channel);
                avatar.innerText = videoData.channel.charAt(0).toUpperCase();
            }
            document.getElementById('shortsLikeCount').innerText = videoData.likeCount || '0';
            document.getElementById('shortsCommentCount').innerText = videoData.commentCount || '0';
            document.getElementById('shortsViewCountBadge').innerText = '👁 ' + (videoData.viewCount || '0');
            document.getElementById('shortsLikeCountBadge').innerText = '👍 ' + (videoData.likeCount || '0');
            const vid = extractVideoIdSimple(videoUrl);
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&controls=0&modestbranding=1&rel=0&showinfo=0&playsinline=1`;
            iframe.allow = 'autoplay; encrypted-media';
            iframe.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0;border:none;';
            const wrapper = document.getElementById('shortsPlayerIframe');
            wrapper.innerHTML = '';
            wrapper.appendChild(iframe);
            overlay.classList.add('show');
            startShortsProgress();
        }

        function closeShortsPlayer() {
            const overlay = document.getElementById('shortsPlayerOverlay');
            overlay.classList.remove('show');
            document.getElementById('shortsPlayerIframe').innerHTML = '';
            stopShortsProgress();

        function extractVideoIdSimple(url) {

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return '#' + '00000'.substring(0, 6 - c.length) + c;
        }

                function updateSelectedCount() {
                    const count = document.querySelectorAll('.row-checkbox:checked').length;
                    const span = document.querySelector('.btn-copy-selected span');
                    if (span) span.textContent = count > 0 ? `复制选中 (${count})` : '复制选中';
                }

                fetchBtn.addEventListener('click', () => this.processYoutubeUrls());
                urlInput.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'Enter') this
                        .processYoutubeUrls();
                });
                convertBtn.addEventListener('click', () => this.convertToShort());
                closePlayerBtn.addEventListener('click', () => this.hideVideoPlayer());
                clearInputBtn.addEventListener('click', () => {
                    document.getElementById('youtubeUrls').value = '';
                    showToast('输入框已清空');
                });
                document.getElementById('historyBtn').addEventListener('click', openHistory);
            },

            extractVideoId(url) {
                try {
                    if (url.includes('youtube.com/watch?v=')) return url.split('v=')[1].split('&')[0];
                    if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
                    if (url.includes('youtube.com/shorts/')) return url.split('shorts/')[1].split('?')[0];
                } catch (e) { }
                return null;
            },

            formatNumber(num) {
                const n = parseInt(num);
                if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
                if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
                return n.toString();
            },

            parseDuration(duration) {
                const m = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/) || [];
                const parts = [];
                if (m[1]) parts.push(m[1] + '小时');
                if (m[2]) parts.push(m[2] + '分钟');
                if (m[3]) parts.push(m[3] + '秒');
                return parts.join('') || "未知";
            },

            formatUploadDate(dateStr) {
                const d = new Date(dateStr);
                const now = new Date();
                const diff = Math.floor((now - d) / 86400000);
                if (diff === 0) return "今天";
                if (diff === 1) return "昨天";
                if (diff < 30) return diff + "天前";
                if (diff < 365) return Math.floor(diff / 30) + "个月前";
                return Math.floor(diff / 365) + "年前";
            },

            // ⚡ 从Key池中获取一个可用的API Key（轮询方式，支持并发）
            getAvailableKeyFromPool() {
                const totalKeys = CONFIG.YT_API_KEYS.length;
                for (let i = 0; i < totalKeys; i++) {
                    const idx = (STATE.currentKeyIndex + i) % totalKeys;
                    const key = CONFIG.YT_API_KEYS[idx];
                    if (STATE.ytApiKeyStatus[key].isActive && !STATE.ytApiKeyStatus[key].quotaExceeded) {
                        STATE.currentKeyIndex = (idx + 1) % totalKeys;
                        return key;
                    }
                }
                return null;
            },

            // ⚡ 带重试和Key轮换的数据获取
            async fetchVideoDataWithRetry(vid, maxRetries = 3) {
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    const key = this.getAvailableKeyFromPool();
                    if (!key) {
                        if (attempt < maxRetries - 1) { await delay(300 * (attempt + 1)); continue; }
                        return null;
                    }
                    try {
                        const r = await fetch(
                            `https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails,snippet&id=${vid}&key=${key}`
                        );
                        if (r.status === 403) {
                            STATE.ytApiKeyStatus[key].quotaExceeded = true;
                            STATE.ytApiKeyStatus[key].isActive = false;
                            continue;
                        }
                        if (!r.ok) { await delay(200 * (attempt + 1)); continue; }
                        const j = await r.json();
                        return j.items?.[0] || null;
                    } catch (err) {
                        if (attempt < maxRetries - 1) await delay(300 * (attempt + 1));
                    }
                }
                return null;
            },

            // ⚡ 获取最佳缩略图（直接使用API返回的URL，无需HEAD请求）
            getBestThumbnailFromSnippet(snippet) {
                if (!snippet || !snippet.thumbnails) return null;
                const thumbs = snippet.thumbnails;
                return thumbs.maxres?.url || thumbs.standard?.url || thumbs.high?.url || thumbs.medium?.url || thumbs
                    .default?.url || null;
            },

            // ⚡ 保留原有方法以兼容（但优化为直接尝试maxres，失败回退）
            async getBestThumbnail(vid) {
                const url = `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`;
                try {
                    const r = await fetch(url, { method: 'HEAD' });
                    if (r.ok) return url;
                } catch (e) { }
                return `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
            },

            loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            },

            async getLosslessShortThumbnail(videoId) {
                try {
                    const highResUrl = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
                    const img = await this.loadImage(highResUrl);
                    const canvas = document.createElement('canvas');
                    canvas.width = img.height * (9 / 16);
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, Math.round((img.width - canvas.width) / 2), 0, Math.round(canvas.width), img.height,
                        0, 0, canvas.width, canvas.height);
                    return canvas.toDataURL('image/jpeg', 0.9);
                } catch (error) {
                    return `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
                }
            },

            async copyImage(img) {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const tempImg = new Image();
                    tempImg.crossOrigin = 'anonymous';
                    tempImg.src = img.src;
                    await new Promise((resolve, reject) => {
                        tempImg.onload = resolve;
                        tempImg.onerror = reject;
                    });
                    canvas.width = tempImg.naturalWidth;
                    canvas.height = tempImg.naturalHeight;
                    ctx.drawImage(tempImg, 0, 0);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    showToast("缩略图已复制");
                } catch (error) {
                    await copyToClipboard(img.src);
                    showToast("复制失败，已复制图片链接");
                }
            },

            async downloadAllThumbnails() {
                const imgs = document.querySelectorAll(".youtube-thumbnail");
                if (!imgs.length) return;
                const zip = new JSZip();
                const f = zip.folder("youtube_thumbnails");
                const dp = document.getElementById("downloadProgress");
                dp.style.display = "block";
                for (let i = 0; i < imgs.length; i++) {
                    try {
                        const r = await fetch(imgs[i].src);
                        const b = await r.blob();
                        f.file(`${i + 1}.jpg`, b);
                        const pct = Math.round(((i + 1) / imgs.length) * 100);
                        document.getElementById("downloadProgressBar").style.width = pct + "%";
                        document.getElementById("downloadProgressPercent").innerText = pct + "%";
                        document.getElementById("downloadProgressText").innerText = `打包中 ${i + 1}/${imgs.length}`;
                    } catch (e) { }
                }
                const blob = await zip.generateAsync({ type: "blob" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "youtube_thumbnails.zip";
                a.click();
                dp.style.display = "none";
                showToast("全部缩略图已打包下载");
            },

            showVideoPlayer(url) {
                const tr = event.target.closest('tr');
                if (!tr) {
                    openShortsPlayer(url, {
                        title: '未知标题', channel: '未知频道', likeCount: '0', commentCount: '0',
                        viewCount: '0', thumbnail: `https://i.ytimg.com/vi/${extractVideoIdSimple(url)}/mqdefault.jpg`
                    });
                    return;
                }
                const cells = tr.cells;
                let title = '',
                    channel = '',
                    likeCount = '0',
                    commentCount = '0',
                    viewCount = '0',
                    thumbnail = '';
                if (cells.length >= 9) {
                    title = cells[2]?.innerText.trim() || '未知标题';
                    channel = cells[3]?.innerText.trim() || '未知频道';
                    likeCount = tr.getAttribute('data-likecount') || '0';
                    commentCount = cells[5]?.innerText.trim() || '0';
                    viewCount = cells[4]?.innerText.trim() || '0';
                    const img = cells[8]?.querySelector('img');
                    if (img) thumbnail = img.src;
                }
                openShortsPlayer(url, { title, channel, likeCount, commentCount, viewCount, thumbnail });
            },

            hideVideoPlayer() {
                const o = document.getElementById("videoPlayerOverlay");
                o.classList.remove("show");
                if (STATE.ytPlayer) STATE.ytPlayer.stopVideo();
            },

            copyYoutubeColumn(colIndex) {
                const table = document.querySelector('.youtube-table');
                if (!table) return;
                const rows = table.querySelectorAll('tbody tr');
                const textList = [];
                rows.forEach(row => {
                    const cell = row.cells[colIndex];
                    if (!cell) return;
                    let val;
                    if (colIndex === 1) {
                        const linkDiv = cell.querySelector('.link-url-text');
                        val = linkDiv ? linkDiv.textContent.trim() : '';
                    } else {
                        val = cell.innerText.trim().replace(/^获取失败$/, '');
                    }
                    if (!val) return;
                    if (colIndex === 4) val = `播放量：${val}`;
                    textList.push(val);
                });
                if (textList.length) copyToClipboard(textList.join('\n')).then(() => showToast(
                    `已复制该列共 ${textList.length} 条数据`));
            },

            parseViewCount(str) {
                if (!str || str.includes('失败')) return 0;
                str = str.trim();
                if (str.includes('亿')) return parseFloat(str) * 100000000;
                if (str.includes('w')) return parseFloat(str) * 10000;
                const num = parseInt(str.replace(/[^0-9]/g, ''));
                return isNaN(num) ? 0 : num;
            },

            toggleSortViews() {
                const tbody = document.querySelector('.youtube-table tbody');
                if (!tbody) return;
                const icon = document.getElementById('sortIcon');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                switch (STATE.sortState) {
                    case 'original':
                        rows.sort((a, b) => {
                            const viewA = this.parseViewCount(a.cells[4].innerText);
                            const viewB = this.parseViewCount(b.cells[4].innerText); return viewB - viewA;
                        });
                        STATE.sortState = 'desc';
                        icon.className = 'fas fa-sort-amount-down';
                        showToast('播放量已降序排列（从高到低）');
                        break;
                    case 'desc':
                        rows.sort((a, b) => {
                            const viewA = this.parseViewCount(a.cells[4].innerText);
                            const viewB = this.parseViewCount(b.cells[4].innerText); return viewA - viewB;
                        });
                        STATE.sortState = 'asc';
                        icon.className = 'fas fa-sort-amount-up';
                        showToast('播放量已升序排列（从低到高）');
                        break;
                    case 'asc':
                        if (STATE.originalRows.length > 0) {
                            tbody.innerHTML = '';
                            STATE.originalRows.forEach(row => tbody.appendChild(row));
                        }
                        STATE.sortState = 'original';
                        icon.className = 'fas fa-sort';
                        showToast('已恢复原始顺序');
                        break;
                }
                if (STATE.sortState !== 'original') { rows.forEach(row => tbody.appendChild(row)); }
            },

            convertToShort() {
                const textarea = document.getElementById('youtubeUrls');
                const text = textarea.value.trim();
                if (!text) return showToast('请先输入链接');
                const lines = text.split('\n').map(line => line.trim());
                const result = lines.map(line => {
                    const vid = this.extractVideoId(line); return vid ?
                        `https://www.youtube.com/shorts/${vid}` : line;
                });
                textarea.value = result.join('\n');
                showToast('已转换为 Shorts 标准链接');
            },

            // ⚡ ====================== 核心：并发批量查询 ======================
            async processYoutubeUrls() {
                const text = document.getElementById("youtubeUrls").value.trim();
                const lines = text.split("\n").map(i => i.trim()).filter(Boolean);
                if (lines.length === 0) return showToast("请输入至少一个YouTube链接");

                const btn = document.getElementById("youtubeFetchBtn");
                const bar = document.getElementById("youtubeProgressContainer");
                const pText = document.getElementById("youtubeProgressText");
                const pCount = document.getElementById("youtubeProgressCount");
                const pBar = document.getElementById("youtubeProgressBar");
                const area = document.getElementById("youtubeResultsArea");
                const batchSize = CONFIG.YT_CONCURRENT_BATCH_SIZE;

                btn.disabled = true;
                bar.style.display = "block";
                area.innerHTML = "";
                pBar.style.width = "0%";
                pText.innerText = "⚡ 正在准备并发查询...";
                pCount.innerText = `0/${lines.length}`;

                // 1. 解析所有URL，提取有效ID
                const parsedItems = [];
                for (let i = 0; i < lines.length; i++) {
                    const url = lines[i];
                    const vid = this.extractVideoId(url);
                    if (vid) {
                        parsedItems.push({ url, vid, idx: i, isShort: url.includes("shorts") });
                    }
                }

                if (parsedItems.length === 0) {
                    btn.disabled = false;
                    bar.style.display = "none";
                    return showToast("未找到有效的YouTube链接");
                }

                const validUrls = parsedItems.map(p => p.url);

                // 2. 创建表格（所有行先占位）
                const table = document.createElement("table");
                table.className = "youtube-table";
                table.innerHTML = `
    <thead>
        <tr>
            <th class="select-col">
                <div class="select-all-checkbox-wrap">
                    <input type="checkbox" id="selectAllCheckbox" onclick="toggleAllCheckboxes(this)" title="全选/取消全选">
                    <button class="btn-copy-selected" onclick="event.stopPropagation(); copySelectedUrls()" title="复制选中行的链接"><i class="fas fa-copy"></i><span>复制选中</span></button>
                </div>
            </th>
            <th onclick="window.copyYoutubeColumn(1)">视频链接<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制整列</small></th>
            <th onclick="window.copyYoutubeColumn(2)">标题<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(3)">频道<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(4)" style="cursor: pointer;">播放<button id="sortViewsBtn" class="sort-btn" onclick="event.stopPropagation(); window.toggleSortViews();" style="margin-left:5px;"><i id="sortIcon" class="fas fa-sort"></i></button></th>
            <th onclick="window.copyYoutubeColumn(5)">评论<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(6)">发布<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.copyYoutubeColumn(7)">时长<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击复制</small></th>
            <th onclick="window.downloadAllThumbnails()" title="点击打包下载所有缩略图">缩略图<br><small style="font-size:11px;opacity:0.6;font-weight:400;">点击打包下载</small></th>
        </tr>
    </thead>
    <tbody></tbody>`;
                area.appendChild(table);
                const tbody = table.querySelector("tbody");

                // 为每个有效URL创建占位行
                const rowRefs = [];
                for (const item of parsedItems) {
                    const { url, vid, idx, isShort } = item;
                    const tr = document.createElement("tr");
                    tr.setAttribute('data-url', url);

                    const tdCheck = document.createElement("td");
                    tdCheck.className = "select-col";
                    const cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.className = "row-checkbox";
                    cb.addEventListener('change', function () {
                        if (this.checked) tr.classList.add('row-selected');
                        else tr.classList.remove('row-selected');
                        const count = document.querySelectorAll('.row-checkbox:checked').length;
                        const span = document.querySelector('.btn-copy-selected span');
                        if (span) span.textContent = count > 0 ? `复制选中 (${count})` : '复制选中';
                    });
                    tdCheck.appendChild(cb);
                    tr.appendChild(tdCheck);

                    const td1 = document.createElement("td");
                    td1.innerHTML = `
    <div class="link-url-text" style="font-size:12px;word-break:break-all;margin-bottom:6px;">${url}</div>
    <div class="youtube-link-btns">
        <button class="youtube-link-btn play" onclick="window.showVideoPlayer('${url}')"><i class="fas fa-play"></i>播放</button>
        <button class="youtube-link-btn jump" onclick="window.open('${url}','_blank')"><i class="fas fa-external-link-alt"></i>打开</button>
        <button class="youtube-link-btn copy" onclick="navigator.clipboard.writeText('${url}').then(()=>showToast('链接已复制'))"><i class="fas fa-copy"></i>复制</button>
    </div>`;
                    tr.appendChild(td1);

                    const td2 = document.createElement("td");
                    td2.className = "youtube-title-cell";
                    td2.innerText = "加载中...";
                    tr.appendChild(td2);
                    const td3 = document.createElement("td");
                    td3.innerText = "...";
                    tr.appendChild(td3);
                    const td4 = document.createElement("td");
                    td4.innerText = "...";
                    tr.appendChild(td4);
                    const td5 = document.createElement("td");
                    td5.innerText = "...";
                    tr.appendChild(td5);
                    const td6 = document.createElement("td");
                    td6.innerText = "...";
                    tr.appendChild(td6);
                    const td7 = document.createElement("td");
                    td7.innerText = "...";
                    tr.appendChild(td7);

                    const td8 = document.createElement("td");
                    const wrap = document.createElement("div");
                    wrap.className = "youtube-thumbnail-container";
                    const img = document.createElement("img");
                    img.className = "youtube-thumbnail";
                    img.src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
                    img.onerror = function () { this.src = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`; };
                    const badge = document.createElement("div");
                    badge.className = "youtube-badge";
                    badge.innerText = isShort ? `#${idx + 1}竖` : `#${idx + 1}`;
                    wrap.appendChild(img);
                    wrap.appendChild(badge);
                    td8.appendChild(wrap);
                    tr.appendChild(td8);

                    tbody.appendChild(tr);

                    [td2, td3, td4, td5, td6, td7].forEach(cell => {
                        cell.onclick = () => copyToClipboard(cell.innerText);
                    });
                    img.onclick = async () => {
                        await this.copyImage(img);
                        badge.innerText = "已复制";
                        badge.classList.add('copied');
                    };

                    rowRefs.push({ tr, td2, td3, td4, td5, td6, td7, img, badge, url, vid, isShort, idx });
                }

                STATE.originalRows = Array.from(tbody.children);
                STATE.sortState = 'original';

                // 3. ⚡ 分批并发查询 
                let completedCount = 0;
                const totalCount = parsedItems.length;
                const startTime = Date.now();

                // 将parsedItems分批次
                const batches = [];
                for (let i = 0; i < parsedItems.length; i += batchSize) {
                    batches.push(parsedItems.slice(i, i + batchSize));
                }

                pText.innerText = `⚡ 并发查询中（${batchSize}个/批，共${batches.length}批）...`;
                pCount.innerText = `0/${totalCount}`;

                for (let batchIdx = 0; batchIdx < batches.length; batchIdx++) {
                    const batch = batches[batchIdx];
                    pText.innerText =
                        `⚡ 并发查询第 ${batchIdx + 1}/${batches.length} 批（${batch.length}个并发）...`;

                    // ⚡ 并发执行一批请求
                    const batchResults = await Promise.allSettled(
                        batch.map(item => this.fetchVideoDataWithRetry(item.vid, 3))
                    );

                    // 回填本批结果
                    for (let j = 0; j < batchResults.length; j++) {
                        const item = batch[j];
                        const result = batchResults[j];
                        const ref = rowRefs.find(r => r.vid === item.vid);
                        if (!ref) continue;

                        completedCount++;
                        pCount.innerText = `${completedCount}/${totalCount}`;
                        pBar.style.width = (completedCount / totalCount) * 100 + "%";

                        if (result.status === 'fulfilled' && result.value) {
                            const data = result.value;
                            const snippet = data.snippet;
                            const stats = data.statistics;
                            const contentDetails = data.contentDetails;

                            const title = snippet.title;
                            ref.td2.innerText = title.length > 22 ? title.substring(0, 22) + "..." : title;
                            ref.td2.title = title;
                            ref.td3.innerText = snippet.channelTitle;
                            ref.td4.innerHTML =
                                `<span class="youtube-view-count">${this.formatNumber(stats.viewCount || 0)}</span>`;
                            ref.td5.innerText = this.formatNumber(stats.commentCount || 0);
                            ref.td6.innerText = this.formatUploadDate(snippet.publishedAt);
                            ref.td7.innerText = this.parseDuration(contentDetails.duration);
                            ref.tr.setAttribute('data-likecount', stats.likeCount || '0');

                            // ⚡ 缩略图：优先使用API返回的maxres，Shorts异步裁剪
                            const apiThumb = this.getBestThumbnailFromSnippet(snippet);
                            if (apiThumb && !item.isShort) {
                                ref.img.src = apiThumb;
                            } else if (item.isShort) {
                                // Shorts异步裁剪（不阻塞主流程）
                                this.getLosslessShortThumbnail(item.vid).then(u => { ref.img.src = u; });
                            } else {
                                ref.img.src = `https://i.ytimg.com/vi/${item.vid}/maxresdefault.jpg`;
                                ref.img.onerror = function () {
                                    this.src =
                                        `https://i.ytimg.com/vi/${item.vid}/hqdefault.jpg`;
                                };
                            }
                        } else {
                            [ref.td2, ref.td3, ref.td4, ref.td5, ref.td6, ref.td7].forEach(c => c.innerHTML =
                                `<span class='youtube-error'>获取失败</span>`);
                        }
                    }
                }

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                btn.disabled = false;
                pText.innerText = `✅ 查询完成（${totalCount}个视频，耗时${elapsed}秒，${batchSize}并发）`;
                showToast(`YouTube 数据查询完成！${totalCount}个视频，耗时${elapsed}秒`);

                // 构造tableData用于保存历史
                const tableData = [];
                rowRefs.forEach(ref => {
                    tableData.push({
                        url: ref.url,
                        title: ref.td2.innerText || '',
                        channel: ref.td3.innerText || '',
                        viewCount: ref.td4.innerText || '',
                        commentCount: ref.td5.innerText || '',
                        published: ref.td6.innerText || '',
                        duration: ref.td7.innerText || '',
                        likeCount: ref.tr.getAttribute('data-likecount') || '0'
                    });
                });
                saveHistory(validUrls, tableData);
            }
        };

        window.onYouTubeIframeAPIReady = function () {
            STATE.youtubeApiReady = true;
            STATE.ytPlayer = new YT.Player('playerContainer', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
                events: {
                    onError: () => {
                        showToast("视频无法播放，已为你打开新标签页");
                        window.open(`https://youtu.be/${STATE.currentVideoId}`, "_blank");
                        Modules.hideVideoPlayer();
                    }
                }
            });
        };
