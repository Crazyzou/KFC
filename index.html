<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无情翻译工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --text-color: #2b2d42;
            --text-secondary: #5a6268;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --warning-color: #f8961e;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 15px 30px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            height: 100vh;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* 左侧功能区 - 纵向排列4个功能块 */
        .function-area {
            width: 380px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* 功能块样式优化 */
        .tool-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-color);
        }

        /* 选中功能块的高亮样式 */
        .tool-card.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.05), rgba(76, 201, 240, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title .icon {
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border-radius: 50%;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        /* 右侧结果区 - 占满剩余宽度，默认隐藏，选中功能后显示 */
        .result-area {
            flex: 1;
            min-height: calc(100vh - 3rem);
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 2rem;
            overflow-y: auto;
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        /* 功能操作面板（原card-body）- 右侧结果区的核心内容 */
        .function-panel {
            display: none;
            width: 100%;
            height: 100%;
        }

        .function-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .input-group {
            margin-bottom: 1.75rem;
            width: 100%;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 140px;
            resize: vertical;
            transition: var(--transition);
            background-color: var(--bg-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            position: relative;
            display: inline-flex;
            /* 保持原有布局方式 */
            align-items: center;
            width: 100%;
            justify-content: center;
            cursor: pointer;
            outline: none;
            border: 0;
            vertical-align: middle;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            text-transform: uppercase;
            padding: 1.25em 2em;
            /* 保持原有内边距 */
            background: #e0f7fa;
            border: 2px solid #4fc3f7;
            border-radius: 0.75em;
            transform-style: preserve-3d;
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                background 150ms cubic-bezier(0, 0, 0.58, 1);
            /* 移除 width: 100% 让宽度自适应内容 */
            white-space: nowrap;
            /* 防止文本换行 */
        }

        /* 其余所有样式保持不变 */
        .btn::before {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #80deea;
            border-radius: inherit;
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.625em 0 0 #b3e5fc;
            transform: translate3d(0, 0.75em, -1em);
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
            z-index: -1;
        }

        .btn:hover {
            background: #b2ebf2;
            transform: translate(0, 0.25em);
        }

        .btn:hover::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.5em 0 0 #b3e5fc;
            transform: translate3d(0, 0.5em, -1em);
        }

        .btn:active {
            background: #b2ebf2;
            transform: translate(0em, 0.75em);
        }

        .btn:active::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0 #b3e5fc;
            transform: translate3d(0, 0, -1em);
        }

        /* 禁用状态 */
        .btn:disabled {
            background: #e0e0e0;
            border-color: #bdbdbd;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: none;
            gap: 0.75rem;
        }

        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-container {
            margin-top: 1.75rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        .result-header {
            padding: 0.875rem 1.25rem;
            background-color: rgba(248, 249, 250, 0.9);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-content {
            padding: 0.5rem;
            line-height: 1.6;
            background-color: var(--card-bg);
            white-space: pre-wrap;
            font-size: 0.9rem;
            /* 删掉这行：max-height: 400px; */
            overflow-y: auto;
            /* 仅内容超屏时滚动，否则无滚动条 */
        }

        .result-line {
            position: relative;
            padding: 0.5rem 1.75rem 0.5rem 0.75rem;
            margin: 0;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .result-line:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }

        .line-copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .result-line:hover .line-copy-btn {
            opacity: 0.7;
        }

        .line-copy-btn:hover {
            opacity: 1 !important;
            color: var(--primary-color);
            background: rgba(67, 97, 238, 0.1);
        }

        .line-copy-btn i {
            font-size: 0.85rem;
        }

        /* 新增表格样式 - 适配链接语言提取 */
        .link-lang-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .link-lang-table thead {
            background-color: rgba(248, 249, 250, 0.9);
        }

        .link-lang-table th,
        .link-lang-table td {
            padding: 0.875rem 1.25rem;
            border: 1px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-lang-table th {
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
        }

        .link-lang-table td {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .link-lang-table tr:hover td {
            background-color: rgba(67, 97, 238, 0.05);
        }

        /* 表头复制按钮样式 */
        .header-copy-btn {
            margin-left: 0.75rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-secondary);
        }

        .header-copy-btn i {
            font-size: 0.7rem;
        }

        .header-copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn i {
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .toast i {
            font-size: 1.1rem;
        }

        /* 空状态提示 */
        .empty-tip {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            gap: 1rem;
        }

        .empty-tip i {
            font-size: 3rem;
            color: var(--border-color);
        }

        /* 语言识别结果样式 */
        .lang-result-box {
            margin-top: 1.5em;
            background-color: rgba(67, 97, 238, 0.05);
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-color);
        }

        .lang-result-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-result-value {
            font-size: 1rem;
        }

        /* Markdown样式 */
        .markdown-content {
            font-family: inherit;
            line-height: 1.7;
            color: var(--text-color);
            overflow-wrap: break-word;
        }

        /* 标题样式 */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }

        .markdown-content h1 {
            font-size: 1.8em;
        }

        .markdown-content h2 {
            font-size: 1.5em;
        }

        .markdown-content h3 {
            font-size: 1.3em;
        }

        .markdown-content h4 {
            font-size: 1.1em;
        }

        .markdown-content h5 {
            font-size: 1em;
        }

        .markdown-content h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        /* 段落和列表 */
        .markdown-content p {
            margin-bottom: 1.2em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1.2em;
            padding-left: 2em;
        }

        .markdown-content li {
            margin-bottom: 0.5em;
        }

        /* 代码块样式 */
        .markdown-content pre {
            position: relative;
            background-color: #282c34;
            border-radius: var(--radius-sm);
            padding: 1em;
            overflow-x: auto;
            margin: 1.2em 0;
        }

        .markdown-content pre code {
            display: block;
            padding: 0;
            background: transparent;
            color: #abb2bf;
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* 行内代码样式 */
        .markdown-content code.inline-code {
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            background-color: rgba(175, 184, 193, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
            color: #e06c75;
        }

        /* 添加复制按钮 */
        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #abb2bf;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            z-index: 1;
            transition: all 0.2s;
        }

        .code-copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .markdown-content pre:hover .code-copy-btn {
            opacity: 1;
        }

        /* 引用块 */
        .markdown-content blockquote {
            margin: 1.2em 0;
            padding: 0.8em 1.2em;
            border-left: 4px solid var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
            color: var(--text-secondary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        /* 链接 */
        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .markdown-content a:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        /* 表格 */
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2em 0;
            border: 1px solid var(--border-color);
        }

        .markdown-content th,
        .markdown-content td {
            padding: 0.75em 1em;
            border: 1px solid var(--border-color);
        }

        .markdown-content th {
            background-color: rgba(248, 249, 250, 0.9);
            font-weight: 600;
        }

        /* 水平线 */
        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.5em 0;
        }

        /* 图片 */
        .markdown-content img {
            max-width: 100%;
            border-radius: var(--radius-sm);
        }

        .ad-optimization-result {
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .ad-optimization-header {
            padding: 0.75rem 1rem;
            background-color: rgba(67, 97, 238, 0.1);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ad-optimization-content {
            padding: 1rem;
            background-color: var(--card-bg);
        }

        .ad-optimization-version {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .ad-optimization-text {
            margin-bottom: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ad-optimization-translation {
            padding: 0.75rem;
            background-color: rgba(76, 201, 240, 0.1);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-color);
        }

        .ad-optimization-translation-label {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--accent-color);
        }

        /* ====================== AI绘画提示词优化样式（仅修改这里） ====================== */
        .paint-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .paint-result-box {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .paint-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .paint-version-header h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .paint-copy-btn {
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .paint-copy-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .paint-prompt {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color);
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 0.75rem;

    <script>
        class AITitleProcessor {
            constructor() {
                this.apiKey = "6869437c-0d6b-42ee-8c6d-4c865ca9b475";
                this.apiUrl = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";
            }

            async getAIResponse(prompt) {
                try {
                    const response = await fetch(this.apiUrl, {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${this.apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "ep-20250813143100-7b9vf",
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`AI请求失败: ${response.status}`);
                    }

                    const result = await response.json();
                    return result.choices?.[0]?.message?.content?.trim() || '';
                } catch (error) {
                    console.error("AI请求错误:", error);
                    throw error;
                }
            }
        }

        // 简单的Markdown解析器 
        function parseMarkdown(text) {
            if (!text) return '';

            // 1. 转义 HTML 特殊字符（安全处理）
            const escapeHtml = (str) => {
                return str.replace(/[&<>'"]/g,
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag]));
            };

            // 2. 处理代码块（带语法高亮和复制按钮）
            text = text.replace(/```([a-z]*)\n([\s\S]*?)\n```/g, (match, lang, code) => {
                const language = lang || 'plaintext';
                try {
                    // 使用 highlight.js 进行语法高亮 
                    const highlighted = hljs.highlightAuto(code, [language]).value;
                    return `
        <div style="position:relative">
          <pre class="hljs"><code class="language-${language}">${highlighted}</code></pre>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button>
        </div>
      `;
                } catch (e) {
                    console.error('代码高亮失败:', e);
                    return `
        <div style="position:relative">
          <pre><code>${escapeHtml(code)}</code></pre>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button>
        </div>
      `;
                }
            });

            // 3. 处理行内代码
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

            // 4. 处理标题 
            text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            text = text.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
            text = text.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
            text = text.replace(/^###### (.*$)/gm, '<h6>$1</h6>');

            // 5. 处理粗体和斜体 
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
            text = text.replace(/_(.*?)_/g, '<em>$1</em>');

            // 6. 处理无序列表 
            text = text.replace(/^\s*[-*+] (.*$)/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)+/g, '<ul>$&</ul>');

            // 7. 处理有序列表 
            text = text.replace(/^\s*\d+\. (.*$)/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)+/g, '<ol>$&</ol>');

            // 8. 处理引用
            text = text.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

            // 9. 处理链接 
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

            // 10. 处理图片
            text = text.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="md-image">');

            // 11. 处理水平线
            text = text.replace(/^[-*_]{3,}$/gm, '<hr>');

            // 12. 处理换行（将两个换行转换为段落）
            text = text.replace(/\n\n+/g, '</p><p>');
            text = '<p>' + text + '</p>';

            // 13. 清理多余的段落标签
            text = text.replace(/<p><\/p>/g, '');
            text = text.replace(/<p>(<ul>|<ol>|<pre>|<blockquote>)/g, '$1');
            text = text.replace(/(<\/ul>|<\/ol>|<\/pre>|<\/blockquote>)<\/p>/g, '$1');

            return text;
        }

        // 复制代码块函数（需要在全局作用域中定义）
        function copyCodeBlock(button) {
            const code = button.parentElement.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = button.textContent;
                button.textContent = '已复制!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }

        // 获取当前时间
        function getCurrentTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent || element.innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }

        function copyLineText(button) {
            const lineText = button.parentElement.textContent.replace('复制', '').trim();
            navigator.clipboard.writeText(lineText).then(() => {
                showToast();
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }

        // 新增：存储提取的链接和语言数据，用于一键复制
        let extractedLinks = [];
        let extractedLangs = [];

        // 新增：一键复制所有链接 
        function copyAllLinks() {
            if (extractedLinks.length === 0) {
                alert('暂无链接可复制');
                return;
            }
            const text = extractedLinks.join('\n');
            navigator.clipboard.writeText(text).then(showToast).catch(err => {
                console.error('复制链接失败:', err);
            });
        }

        // 新增：一键复制所有语言
        function copyAllLangs() {
            if (extractedLangs.length === 0) {
                alert('暂无语言可复制');
                return;
            }
            const text = extractedLangs.join('\n');
            navigator.clipboard.writeText(text).then(showToast).catch(err => {
                console.error('复制语言失败:', err);
            });
        }

        //文案复制
        function copyOptimizedText(button) {
            const resultDiv = button.closest('.ad-optimization-result');
            const optimizedText = resultDiv.querySelector('.ad-optimization-text').textContent;
            const translation = resultDiv.querySelector('.ad-optimization-translation div:last-child').textContent;
            const textToCopy = `${optimizedText}`;
            navigator.clipboard.writeText(textToCopy).then(showToast).catch(err => {
                console.error('复制失败:', err);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const aiProcessor = new AITitleProcessor();
            const toolCards = document.querySelectorAll('.tool-card');
            const functionPanels = document.querySelectorAll('.function-panel');
            const resultArea = document.getElementById('resultArea');
            const emptyTip = document.getElementById('emptyTip');

            // 绑定一键复制按钮事件 
            document.getElementById('copy-all-links').addEventListener('click', copyAllLinks);
            document.getElementById('copy-all-langs').addEventListener('click', copyAllLangs);

            // 左侧功能块点击事件 - 切换右侧面板
            toolCards.forEach(card => {
                card.addEventListener('click', function () {
                    // 移除所有选中状态 
                    toolCards.forEach(c => c.classList.remove('active'));
                    functionPanels.forEach(p => p.classList.remove('active'));
                    // 添加当前选中状态
                    this.classList.add('active');
                    const targetPanel = document.getElementById(this.dataset.target);
                    targetPanel.classList.add('active');
                    // 显示结果区，隐藏空状态
                    resultArea.classList.add('show');
                    emptyTip.style.display = 'none';
                });
            });

            // 功能1: 符号分隔和语言识别 
            const separatorInput = document.getElementById('text-separator-input');
            const separatorBtn = document.getElementById('text-separator-btn');
            const separatorLoading = document.getElementById('separator-loading');
            const separatorResult = document.getElementById('text-separator-result');
            const separatorResultContainer = document.getElementById('text-separator-result-container');
            const langResult = document.getElementById('lang-detection-result');
            const langResultContainer = document.getElementById('lang-detection-result-container');

            separatorBtn.addEventListener('click', async function () {
                const text = separatorInput.value.trim();
                if (!text) {
                    alert('请输入需要分隔的文本');
                    return;
                }

                separatorBtn.disabled = true;
                separatorLoading.style.display = 'flex';
                separatorResult.innerHTML = '';
                separatorResultContainer.style.display = 'none';
                langResult.textContent = '';
                langResultContainer.style.display = 'none';

                try {
                    // 异步执行语言识别 
                    const langPrompt = `请识别以下文本使用的语言，只需返回语言名称(中文)，不要其他内容:
                    
${text}`;

                    const langDetectionPromise = aiProcessor.getAIResponse(langPrompt);

                    // 异步执行文本分隔 
                    const separatorPrompt = `请严格按照以下要求处理文本：
1. 输入文本: ${text}
2. 自动识别多语言分隔符号（包括但不限于：。！？、；：—…「」『』【】.?!;:-–—()[]{}"' **ฯ ฯลฯ**）
3. 特别包含泰语分隔符（如 ฯ 和 ฯลฯ）
4. 将文本按识别到的符号分隔，不需要按照逗号分隔 
5. 每个分隔后的项目单独一行显示
6. 保持原始内容不变
7. 不要添加任何额外说明 
8. 请直接输出分隔后的结果，不要包含其他内容。`;

                    const separatorPromise = aiProcessor.getAIResponse(separatorPrompt);

                    // 等待两个异步任务完成 
                    const [langResultText, separatorResultText] = await Promise.all([
                        langDetectionPromise,
                        separatorPromise
                    ]);

                    // 处理语言识别结果
                    langResult.textContent = langResultText;
                    langResultContainer.style.display = 'block';

                    // 处理分隔结果 
                    const lines = separatorResultText.split('\n').filter(line => line.trim() !== '');
                    separatorResult.innerHTML = lines.map(line => `
<div class="result-line">${line}
    <button class="line-copy-btn" onclick="copyLineText(this)" title="复制">
        <i class="far fa-copy"></i>
    </button>
</div>
`).join('');
                    separatorResultContainer.style.display = 'block';
                } catch (error) {
                    separatorResult.innerHTML = '<div class="result-line">处理出错，请重试</div>';
                    separatorResultContainer.style.display = 'block';
                    langResult.textContent = '语言识别失败';
                    langResultContainer.style.display = 'block';
                    console.error('处理错误:', error);
                } finally {
                    separatorBtn.disabled = false;
                    separatorLoading.style.display = 'none';
                }
            });

            // 功能2: 链接和语言提取 - 改造为表格渲染 
            const linkLangInput = document.getElementById('link-lang-input');
            const linkLangBtn = document.getElementById('link-lang-btn');
            const linkLangLoading = document.getElementById('link-lang-loading');
            const linkLangTbody = document.getElementById('link-lang-tbody');
            const linkLangResultContainer = document.getElementById('link-lang-result-container');

            linkLangBtn.addEventListener('click', async function () {
                const text = linkLangInput.value.trim();
                if (!text) {
                    alert('请输入包含链接的文本');
                    return;
                }

                linkLangBtn.disabled = true;
                linkLangLoading.style.display = 'flex';
                linkLangTbody.innerHTML = '';
                linkLangResultContainer.style.display = 'none';
                // 清空存储的链接和语言数据
                extractedLinks = [];
                extractedLangs = [];

                try {
                    const prompt = `请严格按照以下要求处理文本：
1. 输入文本: ${text}
2. 提取所有完整链接（http/https开头）
3. 识别每个链接内容的主要语言 
4. 将链接和对应语言分别列出，没有语言的或英语则返回通用
5. 链接在一列，语言在另一列，上下对应，不是英语则语言要用原缩写 
6. 不要添加任何额外说明或解释 
 7. 请按照以下格式返回结果：
||链接开始|| 
链接1 
链接2 
链接3 
||链接结束|| 
 
||语言开始|| 
语言1 
语言2
语言3 
||语言结束||`;

                    let result;
                    let retryCount = 0;
                    const maxRetries = 3;
                    let hasValidResult = false;

                    do {
                        result = await aiProcessor.getAIResponse(prompt);
                        const linkMatch = result.match(/\|\|链接开始\|\|([\s\S]*?)\|\|链接结束\|\|/);
                        const langMatch = result.match(/\|\|语言开始\|\|([\s\S]*?)\|\|语言结束\|\|/);

                        if (linkMatch && langMatch) {
                            extractedLinks = linkMatch[1].trim().split('\n').filter(Boolean);
                            extractedLangs = langMatch[1].trim().split('\n').filter(Boolean);
                            const hasInvalidResult = extractedLangs.some(lang =>
                                lang.includes('无法识别') ||
                                lang.includes('未识别') ||
                                lang.includes('未知')
                            );

                            if (!hasInvalidResult && extractedLinks.length > 0 && extractedLangs.length > 0) {
                                // 渲染表格内容 
                                let tableHtml = '';
                                // 取两者长度的最大值，保证行对齐 
                                const maxLen = Math.max(extractedLinks.length, extractedLangs.length);
                                for (let i = 0; i < maxLen; i++) {
                                    const link = extractedLinks[i] || '-';
                                    const lang = extractedLangs[i] || '-';
                                    tableHtml += `<tr><td>${link}</td><td>${lang}</td></tr>`;
                                }
                                linkLangTbody.innerHTML = tableHtml;
                                hasValidResult = true;
                            } else {
                                retryCount++;
                                if (retryCount < maxRetries) continue;
                                else {
                                    linkLangTbody.innerHTML = '<tr><td>无法提取有效链接</td><td>无法识别语言</td></tr>';
                                }
                            }
                        } else {
                            retryCount++;
                            if (retryCount < maxRetries) continue;
                            else {
                                linkLangTbody.innerHTML = '<tr><td>未找到链接</td><td>无法识别语言</td></tr>';
                            }
                        }
                    } while (!hasValidResult && retryCount < maxRetries);

                    linkLangResultContainer.style.display = 'block';
                } catch (error) {
                    linkLangTbody.innerHTML = '<tr><td>处理出错</td><td>处理出错</td></tr>';
                    linkLangResultContainer.style.display = 'block';
                    console.error('链接语言提取错误:', error);
                } finally {
                    linkLangBtn.disabled = false;
                    linkLangLoading.style.display = 'none';
                }
            });


            //功能3
            const adTextInput = document.getElementById('ad-text-input');
            const adTextBtn = document.getElementById('ad-text-btn');
            const adTextLoading = document.getElementById('ad-text-loading');
            const adTextResultsContainer = document.getElementById('ad-text-results-container');



            adTextBtn.addEventListener('click', async function () {
                const text = adTextInput.value.trim();
                if (!text) {
                    alert('请输入广告文案');
                    return;
                }

                adTextBtn.disabled = true;
                adTextLoading.style.display = 'flex';
                adTextResultsContainer.innerHTML = '';
                adTextResultsContainer.style.display = 'none';

                try {
                    // 使用单个请求获取所有优化版本
                    const prompt = `请严格按照以下要求优化广告文案：
1. 原始文案: ${text}
2. 目标受众: 欧美青少年(13-19岁)
3. 优化要求:
   - 符合欧美青少年语言文化习惯 
   - 不要使用emoji 
   - 提供3种不同风格的优化版本 
   - 每个版本后提供中文翻译 
   - 不要添加额外解释 
4. 输出格式:
优化版本 1
优化文案:
[优化后的文案]
中文翻译:
[翻译内容]
 
优化版本 2
优化文案:
[优化后的文案]
中文翻译:
[翻译内容]
 
优化版本 3
优化文案:
[优化后的文案]
中文翻译:
[翻译内容]`;

                    const result = await aiProcessor.getAIResponse(prompt);

                    // 处理并显示结果 
                    adTextResultsContainer.innerHTML = '';

                    // 使用正则表达式匹配所有版本 
                    const versionRegex = /优化版本 (\d+)\s*优化文案:\s*([\s\S]+?)\s*中文翻译:\s*([\s\S]+?)(?=\n优化版本 \d+|$)/g;
                    let match;
                    let count = 0;

                    while ((match = versionRegex.exec(result)) !== null && count < 3) {
                        count++;
                        const versionNum = match[1];
                        const optimizedText = match[2].trim();
                        const translation = match[3].trim();

                        const resultHtml = `
                <div class="ad-optimization-result">
                    <div class="ad-optimization-header">
                        优化版本 ${versionNum}
                        <button class="copy-btn" onclick="copyOptimizedText(this)" title="复制优化文案">
                            <i class="far fa-copy"></i>
                            复制 
                        </button>
                    </div>
                    <div class="ad-optimization-content">
                        <div class="ad-optimization-version">优化文案:</div>
                        <div class="ad-optimization-text">${optimizedText}</div>
                        <div class="ad-optimization-translation">
                            <div class="ad-optimization-translation-label">中文翻译:</div>
                            <div>${translation}</div>
                        </div>
                    </div>
                </div>
            `;

                        adTextResultsContainer.insertAdjacentHTML('beforeend', resultHtml);
                    }

                    // 如果没有匹配到格式化的结果，直接显示原始结果
                    if (count === 0) {
                        adTextResultsContainer.innerHTML = `
                <div class="ad-optimization-result">
                    <div class="ad-optimization-content">
                        <div class="ad-optimization-text">${result}</div>
                    </div>
                </div>
            `;
                    }

                    adTextResultsContainer.style.display = 'block';
                } catch (error) {
                    adTextResultsContainer.innerHTML = '<div class="result-line">优化失败，请重试</div>';
                    adTextResultsContainer.style.display = 'block';
                    console.error('文案优化错误:', error);
                } finally {
                    adTextBtn.disabled = false;
                    adTextLoading.style.display = 'none';
                }
            });

            hljs.highlightAll();
        });
    </script>
    <script>
        const POSITIVE_PROMPT = "masterpiece, best quality, 8K UHD, ultra detailed, hyper realistic, intricate details, sharp focus, cinematic lighting, professional photography, vibrant colors, depth of field, cinematic composition";
        const NEGATIVE_PROMPT = "worst quality, low quality, blurry, pixelated, ugly, deformed, disfigured, bad anatomy, extra limbs, missing fingers, watermark, text, signature";

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // 复制单版提示词
        function copySinglePrompt(text) {
            navigator.clipboard.writeText(text).then(() => showToast());
        }

        document.addEventListener('DOMContentLoaded', function () {
            const aiProcessor = new AITitleProcessor();
            const toolCards = document.querySelectorAll('.tool-card');
            const functionPanels = document.querySelectorAll('.function-panel');
            const resultArea = document.getElementById('resultArea');
            const emptyTip = document.getElementById('emptyTip');

            toolCards.forEach(card => {
                card.addEventListener('click', function () {
                    toolCards.forEach(c => c.classList.remove('active'));
                    functionPanels.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.target).classList.add('active');
                    resultArea.classList.add('show');
                    emptyTip.style.display = 'none';
                });
            });

            // ====================== 功能4：AI绘画预设优化（带中文翻译 + 一键复制） ======================
            const paintResultBox = document.getElementById('paint-result-box');
            const paintInput = document.getElementById('paint-input');
            const paintGenerateBtn = document.getElementById('paint-generate-btn');
            const paintClearBtn = document.getElementById('paint-clear-btn');

            async function generatePaintPrompt() {
                const userText = paintInput.value.trim();
                if (!userText) { alert('请输入绘画需求'); return; }

                paintGenerateBtn.disabled = true;
                paintResultBox.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;

                try {
                    let fullHtml = '';
                    for (let i = 1; i <= 3; i++) {
                        paintResultBox.innerHTML = fullHtml + `<div class="typing-indicator">正在生成第 ${i} 版预设，请稍候...</div>`;

                        // 生成提示词
                        const prompt = `你是顶级AI绘画提示词工程师，用户需求：${userText}，生成专业完整提示词，只输出结果`;
                        const optimized = await aiProcessor.getAIResponse(prompt);
                        const finalPrompt = `${optimized.trim()}, ${POSITIVE_PROMPT} --no ${NEGATIVE_PROMPT}`;

                        // 生成中文翻译
                        const translatePrompt = `请把这段AI绘画提示词翻译成通顺自然的中文：${finalPrompt}`;
                        const translateResult = await aiProcessor.getAIResponse(translatePrompt);

                        // 拼接带复制按钮 + 中文翻译
                        fullHtml += `
                        <div class="paint-version">
                            <div class="paint-version-header">
                                <h4><i class="fas fa-palette"></i> 第${i}版优化</h4>
                                <button class="paint-copy-btn" onclick='copySinglePrompt(\`${finalPrompt.replace(/`/g, "")}\`)'><i class="far fa-copy"></i>一键复制</button>
                            </div>
                            <div class="paint-prompt">${finalPrompt}</div>
                            <div class="paint-translate"><strong>中文参考：</strong>${translateResult}</div>
                        </div>`;

                        paintResultBox.innerHTML = fullHtml;
                        await delay(600);
                    }

                    fullHtml += `<div class="paint-success"><i class="fas fa-check-circle"></i> 3版提示词优化完成！带中文翻译，可直接复制使用</div>`;
                    paintResultBox.innerHTML = fullHtml;

                } catch (err) {
                    paintResultBox.innerHTML = `<div style="color:red; padding:10px;">优化失败，请重试</div>`;
                    console.error(err);
                } finally {
                    paintGenerateBtn.disabled = false;
                }
            }

            function clearPaintResult() {
                paintResultBox.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">输入你的绘画需求，点击生成，自动优化3版专业提示词（带中文翻译）</div>`;
                paintInput.value = '';
            }

            paintGenerateBtn.addEventListener('click', generatePaintPrompt);
            paintClearBtn.addEventListener('click', clearPaintResult);

            paintInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generatePaintPrompt();
                }
            });
        });
    </script>
</body>
