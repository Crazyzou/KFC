<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无情翻译工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --text-color: #2b2d42;
            --text-secondary: #5a6268;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --warning-color: #f8961e;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 15px 30px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
            --youtube-red: #ff0000;
            --youtube-pink: #FF8E8E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            height: 100vh;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* 左侧功能区 - 纵向排列4个功能块 */
        .function-area {
            width: 380px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* 功能块样式优化 */
        .tool-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-color);
        }

        /* 选中功能块的高亮样式 */
        .tool-card.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.05), rgba(76, 201, 240, 0.05));
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title .icon {
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border-radius: 50%;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        /* 右侧结果区 - 占满剩余宽度，默认隐藏，选中功能后显示 */
        .result-area {
            flex: 1;
            min-height: calc(100vh - 3rem);
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 2rem;
            overflow-y: auto;
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        /* 功能操作面板（原card-body）- 右侧结果区的核心内容 */
        .function-panel {
            display: none;
            width: 100%;
            height: 100%;
        }

        .function-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .input-group {
            margin-bottom: 1.75rem;
            width: 100%;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 140px;
            resize: vertical;
            transition: var(--transition);
            background-color: var(--bg-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            position: relative;
            display: inline-flex;
            /* 保持原有布局方式 */
            align-items: center;
            width: 100%;
            justify-content: center;
            cursor: pointer;
            outline: none;
            border: 0;
            vertical-align: middle;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            text-transform: uppercase;
            padding: 1.25em 2em;
            /* 保持原有内边距 */
            background: #e0f7fa;
            border: 2px solid #4fc3f7;
            border-radius: 0.75em;
            transform-style: preserve-3d;
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                background 150ms cubic-bezier(0, 0, 0.58, 1);
            /* 移除 width: 100% 让宽度自适应内容 */
            white-space: nowrap;
            /* 防止文本换行 */
        }

        /* 其余所有样式保持不变 */
        .btn::before {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #80deea;
            border-radius: inherit;
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.625em 0 0 #b3e5fc;
            transform: translate3d(0, 0.75em, -1em);
            transition: transform 150ms cubic-bezier(0, 0, 0.58, 1),
                box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
            z-index: -1;
        }

        .btn:hover {
            background: #b2ebf2;
            transform: translate(0, 0.25em);
        }

        .btn:hover::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0.5em 0 0 #b3e5fc;
            transform: translate3d(0, 0.5em, -1em);
        }

        .btn:active {
            background: #b2ebf2;
            transform: translate(0em, 0.75em);
        }

        .btn:active::before {
            box-shadow: 0 0 0 2px #4fc3f7, 0 0 #b3e5fc;
            transform: translate3d(0, 0, -1em);
        }

        /* 禁用状态 */
        .btn:disabled {
            background: #e0e0e0;
            border-color: #bdbdbd;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: none;
            gap: 0.75rem;
        }

        .spinner {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-container {
            margin-top: 1.75rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        .result-header {
            padding: 0.875rem 1.25rem;
            background-color: rgba(248, 249, 250, 0.9);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-content {
            padding: 0.5rem;
            line-height: 1.6;
            background-color: var(--card-bg);
            white-space: pre-wrap;
            font-size: 0.9rem;
            /* 删掉这行：max-height: 400px; */
            overflow-y: auto;
            /* 仅内容超屏时滚动，否则无滚动条 */
        }

        .result-line {
            position: relative;
            padding: 0.5rem 1.75rem 0.5rem 0.75rem;
            margin: 0;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .result-line:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }

        .line-copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .result-line:hover .line-copy-btn {
            opacity: 0.7;
        }

        .line-copy-btn:hover {
            opacity: 1 !important;
            color: var(--primary-color);
            background: rgba(67, 97, 238, 0.1);
        }

        .line-copy-btn i {
            font-size: 0.85rem;
        }

        /* 新增表格样式 - 适配链接语言提取 */
        .link-lang-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .link-lang-table thead {
            background-color: rgba(248, 249, 250, 0.9);
        }

        .link-lang-table th,
        .link-lang-table td {
            padding: 0.875rem 1.25rem;
            border: 1px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-lang-table th {
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
        }

        .link-lang-table td {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .link-lang-table tr:hover td {
            background-color: rgba(67, 97, 238, 0.05);
        }

        /* 表头复制按钮样式 */
        .header-copy-btn {
            margin-left: 0.75rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-secondary);
        }

        .header-copy-btn i {
            font-size: 0.7rem;
        }

        .header-copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn i {
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: white;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .toast i {
            font-size: 1.1rem;
        }

        /* 空状态提示 */
        .empty-tip {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            gap: 1rem;
        }

        .empty-tip i {
            font-size: 3rem;
            color: var(--border-color);
        }

        /* 语言识别结果样式 */
        .lang-result-box {
            margin-top: 1.5em;
            background-color: rgba(67, 97, 238, 0.05);
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-color);
        }

        .lang-result-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-result-value {
            font-size: 1rem;
        }

        /* Markdown样式 */
        .markdown-content {
            font-family: inherit;
            line-height: 1.7;
            color: var(--text-color);
            overflow-wrap: break-word;
        }

        /* 标题样式 */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }

        .markdown-content h1 {
            font-size: 1.8em;
        }

        .markdown-content h2 {
            font-size: 1.5em;
        }

        .markdown-content h3 {
            font-size: 1.3em;
        }

        .markdown-content h4 {
            font-size: 1.1em;
        }

        .markdown-content h5 {
            font-size: 1em;
        }

        .markdown-content h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        /* 段落和列表 */
        .markdown-content p {
            margin-bottom: 1.2em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1.2em;
            padding-left: 2em;
        }

        .markdown-content li {
            margin-bottom: 0.5em;
        }

        /* 代码块样式 */
        .markdown-content pre {
            position: relative;
            background-color: #282c34;
            border-radius: var(--radius-sm);
            padding: 1em;
            overflow-x: auto;
            margin: 1.2em 0;
        }

        .markdown-content pre code {
            display: block;
            padding: 0;
            background: transparent;
            color: #abb2bf;
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* 行内代码样式 */
        .markdown-content code.inline-code {
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            background-color: rgba(175, 184, 193, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
            color: #e06c75;
        }

        /* 添加复制按钮 */
        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #abb2bf;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            z-index: 1;
            transition: all 0.2s;
        }

        .code-copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .markdown-content pre:hover .code-copy-btn {
            opacity: 1;
        }

        /* 引用块 */
        .markdown-content blockquote {
            margin: 1.2em 0;
            padding: 0.8em 1.2em;
            border-left: 4px solid var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
            color: var(--text-secondary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        /* 链接 */
        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .markdown-content a:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        /* 表格 */
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2em 0;
            border: 1px solid var(--border-color);
        }

        .markdown-content th,
        .markdown-content td {
            padding: 0.75em 1em;
            border: 1px solid var(--border-color);
        }

        .markdown-content th {
            background-color: rgba(248, 249, 250, 0.9);
            font-weight: 600;
        }

        /* 水平线 */
        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.5em 0;
        }

        /* 图片 */
        .markdown-content img {
            max-width: 100%;
            border-radius: var(--radius-sm);
        }

        .ad-optimization-result {
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .ad-optimization-header {
            padding: 0.75rem 1rem;
            background-color: rgba(67, 97, 238, 0.1);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ad-optimization-content {
            padding: 1rem;
            background-color: var(--card-bg);
        }

        .ad-optimization-version {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .ad-optimization-text {
            margin-bottom: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ad-optimization-translation {
            padding: 0.75rem;
            background-color: rgba(76, 201, 240, 0.1);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-color);
        }

        .ad-optimization-translation-label {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--accent-color);
        }

        /* ====================== AI绘画提示词优化样式（仅修改这里） ====================== */
        .paint-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .paint-result-box {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .paint-version:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .paint-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .paint-version-header h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .paint-copy-btn {
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .paint-copy-btn:hover {
            background: var(--primary-color);
            color: white;

            border: 1px solid var(--border-color);

            background: #e9ecef;

        /* ====================== YouTube 查询功能 全新美化样式 ====================== */

            background: #fafbfc;

            outline: none;
            border-color: #ff0033;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.1);
        }

        /* 查询按钮 */
        .youtube-btn {
            margin-top: 12px;
            background: linear-gradient(90deg, #ff0000, #FF8E8E);

            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;

            align-items: center;
            gap: 8px;

            height: 8px;
            background: #f3f4f6;
            border-radius: 999px;
            overflow: hidden;
        }

            height: 100%;

            background: #f9fafb;

            font-weight: 600;

        /* 下载进度弹窗 */

            right: 30px;
            width: 320px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            display: none;
            z-index: 1000;
            border: 1px solid #e5e7eb;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .youtube-container {
                gap: 16px;
            }

            .youtube-input-area {
                padding: 18px;
            }

                padding: 14px;
            }

            .youtube-table td {
                padding: 10px 8px;

            }

                width: 100px;

            }

            .youtube-link-btn {
                padding: 4px 8px;

            }
        }

        /* 响应式适配 */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .function-area {
                width: 100%;
                height: auto;
                flex-direction: row;

            }

            .result-area {

            }
        }

        @media (max-width: 768px) {

                font-size: 15px;

            .youtube-thumbnail {
                object-fit: cover;
                width: 120px;
                height: 213px;
                /* 9:16 比例 */
                border-radius: 6px;
                cursor: pointer;
            }
        }
    </style>
</head>

    <script>
        // ================== 缩略图无损裁剪（专门给 Shorts 使用） ==================
        async function getLosslessShortThumbnail(videoId) {
            try {
                // 先获取最高清原图

                // 不是最高清就直接返回

                const canvas = document.createElement('canvas');
                canvas.width = img.height * (9 / 16);
                canvas.height = img.height;

                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.imageSmoothingEnabled = false;

                // 居中裁剪
                ctx.drawImage(
                    img,
                    Math.round((img.width - canvas.width) / 2),
                    0,
                    Math.round(canvas.width),
                    img.height,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // 返回裁剪后的 base64

        // 简单的Markdown解析器 
        function parseMarkdown(text) {
            if (!text) return '';

            // 1. 转义 HTML 特殊字符（安全处理）
            const escapeHtml = (str) => {
                return str.replace(/[&<>'"]/g,
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag]));
            };

            // 2. 处理代码块（带语法高亮和复制按钮）
            text = text.replace(/```([a-z]*)\n([\s\S]*?)\n```/g, (match, lang, code) => {
                const language = lang || 'plaintext';
                try {
                    // 使用 highlight.js 进行语法高亮 
                    const highlighted = hljs.highlightAuto(code, [language]).value;
                    return `
        <div style="position:relative">
          <pre class="hljs"><code class="language-${language}">${highlighted}</code></pre>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button>
        </div>
      `;
                } catch (e) {
                    console.error('代码高亮失败:', e);
                    return `
        <div style="position:relative">
          <pre><code>${escapeHtml(code)}</code></pre>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button>
        </div>
      `;
                }
            });

            // 3. 处理行内代码
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

            // 4. 处理标题 
            text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            text = text.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
            text = text.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
            text = text.replace(/^###### (.*$)/gm, '<h6>$1</h6>');

            // 5. 处理粗体和斜体 
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
            text = text.replace(/_(.*?)_/g, '<em>$1</em>');

            // 6. 处理无序列表 
            text = text.replace(/^\s*[-*+] (.*$)/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)+/g, '<ul>$&</ul>');

            // 7. 处理有序列表 
            text = text.replace(/^\s*\d+\. (.*$)/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)+/g, '<ol>$&</ol>');

            // 8. 处理引用
            text = text.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

            // 9. 处理链接 
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

            // 10. 处理图片
            text = text.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="md-image">');

            // 11. 处理水平线
            text = text.replace(/^[-*_]{3,}$/gm, '<hr>');

            // 12. 处理换行（将两个换行转换为段落）
            text = text.replace(/\n\n+/g, '</p><p>');
            text = '<p>' + text + '</p>';

            // 13. 清理多余的段落标签
            text = text.replace(/<p><\/p>/g, '');
            text = text.replace(/<p>(<ul>|<ol>|<pre>|<blockquote>)/g, '$1');
            text = text.replace(/(<\/ul>|<\/ol>|<\/pre>|<\/blockquote>)<\/p>/g, '$1');

            return text;
        }

                        const optimized = await aiProcessor.getAIResponse(prompt);
                        const finalPrompt = `${optimized.trim()}, ${POSITIVE_PROMPT} --no ${NEGATIVE_PROMPT}`;

                        // 生成中文翻译
                        const translatePrompt = `请把这段AI绘画提示词翻译成通顺自然的中文：${finalPrompt}`;
                        const translateResult = await aiProcessor.getAIResponse(translatePrompt);

                        // 拼接带复制按钮 + 中文翻译
                        fullHtml += `
                        <div class="paint-version">
                            <div class="paint-version-header">
                                <h4><i class="fas fa-palette"></i> 第${i}版优化</h4>
                                <button class="paint-copy-btn" onclick='copySinglePrompt(\`${finalPrompt.replace(/`/g, "")}\`)'><i class="far fa-copy"></i>一键复制</button>
                            </div>
                            <div class="paint-prompt">${finalPrompt}</div>
                            <div class="paint-translate"><strong>中文参考：</strong>${translateResult}</div>
                        </div>`;

                        paintResultBox.innerHTML = fullHtml;
                        await delay(600);
                    }

                    fullHtml += `<div class="paint-success"><i class="fas fa-check-circle"></i> 3版提示词优化完成！带中文翻译，可直接复制使用</div>`;
                    paintResultBox.innerHTML = fullHtml;

                } catch (err) {
                    paintResultBox.innerHTML = `<div style="color:red; padding:10px;">优化失败，请重试</div>`;
                    console.error(err);
                } finally {
                    paintGenerateBtn.disabled = false;
                }
            }

            function clearPaintResult() {
                paintResultBox.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">输入你的绘画需求，点击生成，自动优化3版专业提示词（带中文翻译）</div>`;
                paintInput.value = '';
            }

            paintGenerateBtn.addEventListener('click', generatePaintPrompt);
            paintClearBtn.addEventListener('click', clearPaintResult);

            paintInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generatePaintPrompt();
                }
            });

            document.getElementById('youtubeFetchBtn').addEventListener('click', processYoutubeUrls);
            document.getElementById('youtubeUrls').addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') processYoutubeUrls();
            });
            document.getElementById('closePlayer').addEventListener('click', hideVideoPlayer);
        });

        // ================== 优化版 YouTube查询功能 ==================
        const YT_API_KEYS = [
            "AIzaSyBX7YiD9hL6V5_uoG-5dVvoZ6mdNTvLWIM",
            "AIzaSyDIC5HCCD0UIjHu3F988-3rYg7Eax2hnAQ",
            "AIzaSyCYRu3QAFeX9fIqBBrA0LD5Hysut-NFpqs"
        ];
        const ytApiKeyStatus = YT_API_KEYS.reduce((acc, key) => {
            acc[key] = { lastUsed: null, errorCount: 0, isActive: true, quotaExceeded: false };
            return acc;
        }, {});

        let ytPlayer;
        let youtubeApiReady = false;
        let currentVideoId = "";

        function onYouTubeIframeAPIReady() {
            youtubeApiReady = true;
            ytPlayer = new YT.Player('playerContainer', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
                events: {
                    onError: () => {
                        showToast("视频无法播放，已为你打开新标签页");
                        window.open(`https://youtu.be/${currentVideoId}`, "_blank");
                        hideVideoPlayer();
                    }
                }
            });
        }

        function getAvailableYtApiKey() {
            for (const key of YT_API_KEYS) {
                if (ytApiKeyStatus[key].isActive && !ytApiKeyStatus[key].quotaExceeded) return key;
            }
            showToast("所有API今日配额已用尽，请明天再试");
            return null;
        }

        function extractVideoId(url) {
            try {
                if (url.includes('youtube.com/watch?v=')) return url.split('v=')[1].split('&')[0];
                if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
                if (url.includes('youtube.com/shorts/')) return url.split('shorts/')[1].split('?')[0];
            } catch (e) { }
            return null;
        }

        function formatNumber(num) {
            const n = parseInt(num);
            if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
            if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
            return n.toString();
        }

        function parseDuration(duration) {
            const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
            const m = duration.match(regex) || [];
            const h = m[1] || 0, min = m[2] || 0, s = m[3] || 0;
            return `${h ? h + '小时' : ''}${min ? min + '分钟' : ''}${s ? s + '秒' : ''}` || "未知";
        }

        function formatUploadDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const day = 86400000;
            const diff = Math.floor((now - d) / day);
            if (diff === 0) return "今天";
            if (diff === 1) return "昨天";
            if (diff < 30) return diff + "天前";
            if (diff < 365) return Math.floor(diff / 30) + "个月前";
            return Math.floor(diff / 365) + "年前";
        }

        async function getBestThumbnail(vid) {
            const list = ['maxresdefault', 'hqdefault', 'mqdefault', 'default'];
            for (const q of list) {
                const u = `https://i.ytimg.com/vi/${vid}/${q}.jpg`;
                try {
                    const r = await fetch(u, { method: 'HEAD' });
                    if (r.ok) return u;
                } catch { }
            }
            return `https://i.ytimg.com/vi/${vid}/default.jpg`;
        }

        async function fetchVideoData(vid) {
            const key = getAvailableYtApiKey();
            if (!key) return null;
            try {
                const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails,snippet&id=${vid}&key=${key}`);
                if (r.status === 403) {
                    ytApiKeyStatus[key].quotaExceeded = true;
                    return fetchVideoData(vid);
                }
                const j = await r.json();
                return j.items?.[0] || null;
            } catch {
                return null;
            }
        }

        async function copyImage(img) {
            try {
                // 1. 创建临时 Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                // 2. 处理跨域：必须在设置 src 前配置
                const tempImg = new Image();
                tempImg.crossOrigin = 'anonymous'; // 关键：允许跨域加载
                tempImg.src = img.src;

                // 3. 等待图片加载完成
                await new Promise((resolve, reject) => {
                    tempImg.onload = resolve;
                    tempImg.onerror = reject;
                });

                // 4. 设置 Canvas 尺寸并绘制
                canvas.width = tempImg.naturalWidth;
                canvas.height = tempImg.naturalHeight;
                ctx.drawImage(tempImg, 0, 0);

                // 5. Canvas 转 Blob 并写入剪贴板
                const blob = await new Promise(resolve =>
                    canvas.toBlob(resolve, 'image/png', 0.95)
                );
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);

                showToast("缩略图已复制");
            } catch (error) {
                console.error("复制失败:", error);
                // 降级：复制图片 URL（兜底方案）
                await navigator.clipboard.writeText(img.src);
                showToast("复制失败，已复制图片链接");
            }
        }

        async function downloadAllThumbnails() {
            const imgs = document.querySelectorAll(".youtube-thumbnail");
            if (!imgs.length) return;
            const zip = new JSZip();
            const f = zip.folder("youtube_thumbnails");
            const dp = document.getElementById("downloadProgress");
            dp.style.display = "block";

            for (let i = 0; i < imgs.length; i++) {
                try {
                    const r = await fetch(imgs[i].src);
                    const b = await r.blob();
                    f.file(`${i + 1}.jpg`, b);

                    const pct = Math.round(((i + 1) / imgs.length) * 100);
                    document.getElementById("downloadProgressBar").style.width = pct + "%";
                    document.getElementById("downloadProgressPercent").innerText = pct + "%";
                    document.getElementById("downloadProgressText").innerText = `打包中 ${i + 1}/${imgs.length}`;
                } catch { }
            }

            const blob = await zip.generateAsync({ type: "blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "youtube_thumbnails.zip";
            a.click();
            dp.style.display = "none";
            showToast("全部缩略图已打包下载");
        }

        function showVideoPlayer(url) {
            const vid = extractVideoId(url);
            if (!vid) return;
            currentVideoId = vid;
            const o = document.getElementById("videoPlayerOverlay");
            o.classList.add("show");
            if (youtubeApiReady) {
                setTimeout(() => {
                    ytPlayer.loadVideoById(vid);
                    ytPlayer.playVideo();
                }, 100);
            }
        }

        function hideVideoPlayer() {
            const o = document.getElementById("videoPlayerOverlay");
            o.classList.remove("show");
            if (ytPlayer) ytPlayer.stopVideo();
        }

        async function processYoutubeUrls() {
            const text = document.getElementById("youtubeUrls").value.trim();
            const lines = text.split("\n").map(i => i.trim()).filter(Boolean);
            if (lines.length === 0) {
                showToast("请输入至少一个YouTube链接");
                return;
            }

            const btn = document.getElementById("youtubeFetchBtn");
            const bar = document.getElementById("youtubeProgressContainer");
            const pText = document.getElementById("youtubeProgressText");
            const pCount = document.getElementById("youtubeProgressCount");
            const pBar = document.getElementById("youtubeProgressBar");
            const area = document.getElementById("youtubeResultsArea");

            btn.disabled = true;
            bar.style.display = "block";
            area.innerHTML = "";

            const table = document.createElement("table");
            table.className = "youtube-table";
            table.innerHTML = `
            <thead>
    <tr>
        <th onclick="copyYoutubeColumn(0)">视频链接<br><small style="font-size:12px;opacity:0.7">点击复制</small></th>
        <th onclick="copyYoutubeColumn(1)">标题<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th onclick="copyYoutubeColumn(2)">频道<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th onclick="copyYoutubeColumn(3)">播放<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th onclick="copyYoutubeColumn(4)">评论<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th onclick="copyYoutubeColumn(5)">发布<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th onclick="copyYoutubeColumn(6)">时长<br><small style="font-size:12px;opacity:0.7"></small></th>
        <th>缩略图</th>
    </tr>
</thead>
            <tbody></tbody>
            `;
            area.appendChild(table);
            const tbody = table.querySelector("tbody");
            const validUrls = [];

            for (let i = 0; i < lines.length; i++) {
                const url = lines[i];
                const vid = extractVideoId(url);
                pText.innerText = `正在查询 ${i + 1}/${lines.length}`;
                pCount.innerText = `${i + 1}/${lines.length}`;
                pBar.style.width = ((i + 1) / lines.length) * 100 + "%";

                if (!vid) continue;
                validUrls.push(url);
                const isShort = url.includes("shorts");

                const tr = document.createElement("tr");

                // 链接
                const td1 = document.createElement("td");
                td1.innerHTML = `
                <div style="font-size:12px;word-break:break-all;margin-bottom:6px;">${url}</div>
                <div class="youtube-link-btns">
                    <button class="youtube-link-btn play" onclick="showVideoPlayer('${url}')"><i class="fas fa-play"></i>播放</button>
                    <button class="youtube-link-btn jump" onclick="window.open('${url}','_blank')"><i class="fas fa-external-link-alt"></i>打开</button>
                    <button class="youtube-link-btn copy" onclick="navigator.clipboard.writeText('${url}').then(()=>showToast('链接已复制'))"><i class="fas fa-copy"></i>复制</button>
                </div>`;
                tr.appendChild(td1);

                // 标题
                const td2 = document.createElement("td");
                td2.className = "youtube-title-cell";
                td2.innerText = "加载中...";
                tr.appendChild(td2);

                // 频道
                const td3 = document.createElement("td");
                td3.innerText = "...";
                tr.appendChild(td3);

                // 播放
                const td4 = document.createElement("td");
                td4.innerText = "...";
                tr.appendChild(td4);

                // 评论
                const td5 = document.createElement("td");
                td5.innerText = "...";
                tr.appendChild(td5);

                // 发布
                const td6 = document.createElement("td");
                td6.innerText = "...";
                tr.appendChild(td6);

                // 时长
                const td7 = document.createElement("td");
                td7.innerText = "...";
                tr.appendChild(td7);

                // 缩略图
                const td8 = document.createElement("td");
                const wrap = document.createElement("div");
                wrap.className = "youtube-thumbnail-container";
                const img = document.createElement("img");
                img.className = "youtube-thumbnail";
                img.src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
                const badge = document.createElement("div");
                badge.className = "youtube-badge";
                badge.innerText = isShort ? `#${i + 1}竖` : `#${i + 1}`;
                wrap.appendChild(img);
                wrap.appendChild(badge);
                td8.appendChild(wrap);
                tr.appendChild(td8);

                tbody.appendChild(tr);

                // 点击复制
                [td2, td3, td4, td5, td6, td7].forEach(cell => {
                    cell.onclick = () => {
                        navigator.clipboard.writeText(cell.innerText).then(() => showToast("已复制"));
                    };
                });
                img.onclick = async () => {
                    await copyImage(img);
                    // 点击复制后，角标改成“已复制”
                    badge.innerText = "已复制";
                };

                // 拉取数据
                const data = await fetchVideoData(vid);
                if (data) {
                    const t = data.snippet.title;
                    td2.innerText = t.length > 22 ? t.substring(0, 22) + "..." : t;
                    td2.title = t;
                    td3.innerText = data.snippet.channelTitle;
                    td4.innerHTML = `<span class="youtube-view-count">${formatNumber(data.statistics.viewCount || 0)}</span>`;
                    td5.innerText = formatNumber(data.statistics.commentCount || 0);
                    td6.innerText = formatUploadDate(data.snippet.publishedAt);
                    td7.innerText = parseDuration(data.contentDetails.duration);
                    // 如果是 Shorts，使用裁剪后的竖版缩略图；否则正常显示
                    if (isShort) {
                        getLosslessShortThumbnail(vid).then(croppedUrl => {
                            img.src = croppedUrl;
                        });
                    } else {
                        getBestThumbnail(vid).then(u => img.src = u);
                    }
                } else {
                    [td2, td3, td4, td5, td6, td7].forEach(c => c.innerHTML = `<span class='youtube-error'>获取失败</span>`);
                }
            }

            // 一键复制所有链接 + 下载全部缩略图
            const ths = table.querySelectorAll("th");
            ths[0].onclick = () => {
                if (validUrls.length) {
                    navigator.clipboard.writeText(validUrls.join("\n")).then(() => showToast(`已复制 ${validUrls.length} 个链接`));
                }
            };
            ths[7].onclick = downloadAllThumbnails;

            btn.disabled = false;
            pText.innerText = "查询完成";
            showToast("YouTube 数据查询完成");
        }

        // YouTube 表头一键复制整列
        function copyYoutubeColumn(colIndex) {
            const table = document.querySelector('.youtube-table');
            if (!table) return;

            const rows = table.querySelectorAll('tbody tr');
            let textList = [];

            rows.forEach(row => {
                const cell = row.cells[colIndex];
                if (!cell) return;

                let val = cell.innerText.trim().replace(/^获取失败$/, '');
                if (!val) return;

                if (colIndex === 3) {
                    val = `播放量：${val}`;
                }

                textList.push(val);
            });

            const text = textList.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast(`已复制该列共 ${textList.length} 条数据`);
            });
        }

        // ================== 一键转 YouTube Shorts 链接 ==================
        document.getElementById('convertToShortBtn').addEventListener('click', function () {
            const textarea = document.getElementById('youtubeUrls');
            let text = textarea.value.trim();
            if (!text) {
                showToast('请先输入链接');
                return;
            }

            // 按行分割
            const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
            const result = [];

            for (let line of lines) {
                const vid = extractVideoId(line); // 你现成的提取ID函数
                if (vid) {
                    result.push(`https://www.youtube.com/shorts/${vid}`);
                } else {
                    result.push(line); // 无法识别的保留原样
                }
            }

            // 回填输入框
            textarea.value = result.join('\n');
            showToast('已转换为 Shorts 标准链接');
        });
    </script>
