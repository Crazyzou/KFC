<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八字四柱 · AI精准运势+流年可视化</title>
    <!-- 引入Markdown解析库 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 官方稳定版 lunar.js -->
    <script src="https://cdn.jsdelivr.net/gh/Crazyzou/KFC@main/lanur.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'KaiTi', 'SimSun', 'Microsoft YaHei', serif;
        }

        :root {
            --bg-color: #FDF6E9;
            --card-bg: #FEFBF3;
            --primary: #8B0000;
            --text-main: #3D2B1F;
            --text-sub: #6B4226;
            --good: #4caf50;
            --mid: #ff9800;
            --bad: #f44336;
            --border-gold: #D4B16A;
        }

        body {
            background: linear-gradient(135deg, #FDF6E9 0%, #F5F0E1 100%);
            min-height: 100vh;
            padding: 10px;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text-main);
        }

        /* 头部标题 */
        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #8B0000;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .page-desc {
            color: #6B4226;
            margin-top: 8px;
            font-size: 15px;
            line-height: 1.4;
        }

        /* 日期选择区 */
        .date-box {
            text-align: center;
            margin-bottom: 25px;
        }

        #datePicker {
            padding: 10px 16px;
            font-size: 15px;
            border: 2px solid #8B0000;
            border-radius: 8px;
            background: #FFFDF8;
            outline: none;
            transition: all 0.3s;
            cursor: pointer;
            color: #222;
            width: 220px;
            max-width: 90%;
        }

        #datePicker:focus {
            border-color: #D4B16A;
            box-shadow: 0 0 0 3px rgba(212, 177, 106, 0.2);
        }

        /* 实时四柱卡片 */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
            padding: 0 5px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .item-card {
            padding: 20px 15px;
            border-radius: 10px;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .item-card:hover {
            transform: translateY(-4px);
        }

        .card-bg1 {
            background: #2E7D32;
        }

        .card-bg2 {
            background: #C62828;
        }

        .card-bg3 {
            background: #F59E0B;
        }

        .card-bg4 {
            background: #0F766E;
        }

        .card-label {
            font-size: 13px;
            opacity: 0.95;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .card-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .card-text {
            font-size: 11px;
            opacity: 0.9;
            line-height: 1.4;
        }

        /* 主容器-大运+流年布局 */
        .container {
            display: flex;
            max-width: 1000px;
            margin: 0 auto 20px;
            gap: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 2px solid var(--border-gold);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.15);
            overflow: hidden;
            height: 600px;
        }

        /* 左侧大运列表 */
        .sidebar {
            width: 280px;
            background: #FFF8E6;
            border-right: 1px solid #EADBAF;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 10px;
            border-radius: 8px;
        }

        .yun-item {
            padding: 12px 15px;
            border-bottom: 1px solid #EADBAF;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid transparent;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .yun-item:hover {
            background-color: #F9EED0;
        }

        .yun-item.active {
            background-color: #FCEACC;
            border-left-color: var(--primary);
            font-weight: 600;
        }

        .yun-title {
            font-size: 1rem;
            margin-bottom: 4px;
            color: #8B0000;
        }

        .yun-range {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .yun-tag {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: white;
        }

        /* 右侧流年内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .liunian-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border-top: 5px solid #ccc;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.15);
        }

        .card.good {
            border-top-color: var(--good);
        }

        .card.mid {
            border-top-color: var(--mid);
        }

        .card.bad {
            border-top-color: var(--bad);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .year {
            font-size: 1.4rem;
            font-weight: bold;
            color: #8B0000;
        }

        .age {
            font-size: 0.9rem;
            background: #F5E9D7;
            padding: 2px 8px;
            border-radius: 20px;
            color: #6B4226;
        }

        .level-badge {
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .level-badge.good {
            background: var(--good);
        }

        .level-badge.mid {
            background: var(--mid);
        }

        .level-badge.bad {
            background: var(--bad);
        }

        .desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* AI主分析区 */
        .ai-container {
            background: #FAF6EE;
            border-radius: 12px;
            padding: 20px 15px;
            border-left: 5px solid #8B0000;
            margin: 0 auto 20px;
            max-width: 1000px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .ai-icon {
            font-size: 22px;
        }

        .ai-title-text {
            font-size: 18px;
            font-weight: 600;
            color: #8B0000;
        }

        .ai-content {
            line-height: 1.8;
            color: #3D2B1F;
            font-size: 15px;
            word-break: break-all;
        }

        .ai-content h3 {
            font-size: 16px;
            font-weight: 600;
            color: #6B4226;
            margin: 18px 0 10px 0;
            padding-left: 8px;
            border-left: 4px solid #8B0000;
            line-height: 1.4;
        }

        .ai-content h3:first-child {
            margin-top: 0 !important;
        }

        .ai-content p {
            margin: 8px 0;
            text-align: justify;
        }

        .ai-content ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .ai-content li {
            margin: 6px 0;
            position: relative;
        }

        .ai-content strong {
            color: #8B0000;
            font-weight: 600;
        }

        /* 加载样式 */
        .loading {
            text-align: center;
            padding: 20px 0;
            color: #8B0000;
            font-size: 14px;
        }

        .loading span {
            display: inline-block;
            animation: rotate 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .retry-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: #8B0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .retry-btn:hover {
            background: #6A0000;
        }

        /* AI 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-gold);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #EADBAF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFF8E6;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            color: #8B0000;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
            line-height: 1.8;
            font-size: 15px;
        }

        /* 弹窗Markdown样式 */
        .modal-body h1,
        .modal-body h2,
        .modal-body h3 {
            color: #8B0000;
            margin: 15px 0 10px;
        }

        .modal-body ul,
        .modal-body ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .modal-body li {
            margin: 5px 0;
        }

        .modal-body strong {
            color: #8B0000;
        }

        .modal-body p {
            margin: 8px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #EADBAF;
            }

            .grid-box {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 22px;
            }

            .grid-box {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .item-card {
                padding: 15px 10px;
            }

            .card-value {
                font-size: 22px;
            }

            .ai-container {
                padding: 18px 12px;
            }

            .liunian-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- 头部标题 -->
    <div class="page-header">
        <h1 class="page-title">八字四柱 · AI精准运势+流年可视化</h1>
        <p class="page-desc">选择日期自动获取大运/流年/流月/流日/流时 + AI专属分析 | 大运流年可视化查询</p>
    </div>

    <!-- 日期选择 -->
    <div class="date-box">
        <input type="date" id="datePicker" value="">
    </div>

    <!-- 实时四柱卡片 -->
    <div class="grid-box">
        <div class="item-card card-bg1">
            <div class="card-label">当前大运</div>
            <div class="card-value" id="dayun">--</div>
            <div class="card-text" id="dayunTime">--</div>
        </div>
        <div class="item-card card-bg2">
            <div class="card-label">流年</div>
            <div class="card-value" id="liunian">--</div>
        </div>
        <div class="item-card card-bg3">
            <div class="card-label">流月（节气）</div>
            <div class="card-value" id="liuyue">--</div>
            <div class="card-text" id="liuyueTime">--</div>
        </div>
        <div class="item-card card-bg4">
            <div class="card-label">流日</div>
            <div class="card-value" id="liuri">--</div>
        </div>
    </div>

    <!-- 大运+流年可视化容器 -->
    <div class="container">
        <div class="sidebar" id="sidebar"></div>
        <div class="main-content">
            <div id="liunian-container" class="liunian-grid"></div>
        </div>
    </div>

    <!-- AI主分析区 -->
    <div class="ai-container">
        <div class="ai-header">
            <div class="ai-icon">🤖</div>
            <div class="ai-title-text">AI 精准运势+原神专属建议</div>
        </div>
        <div class="ai-content" id="aiResult">
            <div class="loading"><span>⌛</span>请选择日期，AI正在精准分析...</div>
        </div>
    </div>

    <!-- 流年详细AI弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">AI 流年详细建议</span>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modal-content">
            </div>
        </div>
    </div>

    <script>
        // 工具函数：延迟
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===================== 命主精准配置（核心修正） =====================
        const MINGZHU = {
            name: '男命',
            bazi: ['癸未', '丙辰', '甲戌', '乙丑'],
            rizhu: '甲木',
            xiyong: ['水', '木'],
            jishen: ['土', '金'],
            xianshen: ['火'],
            baseInfo: '身弱财旺，地支辰戌丑未四库俱全，土多木折，需水木生扶帮身',
            dayunList: [
                { ganzhi: '乙卯', start: '2011-01-01', end: '2021-01-01', age: '8-18岁', shishen: '比肩', desc: '喜用帮身，学业顺遂，长辈助力多' },
                { ganzhi: '甲寅', start: '2021-01-01', end: '2031-01-01', age: '18-28岁', shishen: '比肩', desc: '喜用强旺，人生起步黄金期，利升学深造、职场积累' },
                { ganzhi: '癸丑', start: '2031-01-01', end: '2041-01-01', age: '28-38岁', shishen: '正印', desc: '第一喜用到位，事业家庭双稳定，利升职扎根' },
                { ganzhi: '壬子', start: '2041-01-01', end: '2051-01-01', age: '38-48岁', shishen: '偏印', desc: '喜用极旺，人生巅峰期，事业财富达到顶峰' },
                { ganzhi: '辛亥', start: '2051-01-01', end: '2061-01-01', age: '48-58岁', shishen: '正官', desc: '亥水为用，整体平稳，以守成为主' },
                { ganzhi: '庚戌', start: '2061-01-01', end: '2071-01-01', age: '58-68岁', shishen: '七杀', desc: '忌神渐旺，以养生守成为主' },
                { ganzhi: '己酉', start: '2071-01-01', end: '2081-01-01', age: '68-78岁', shishen: '正财', desc: '忌神旺，安享晚年，重点关注健康' },
                { ganzhi: '戊申', start: '2081-01-01', end: '2091-01-01', age: '78-88岁', shishen: '偏财', desc: '晚年安稳，子女孝顺，修身养性为主' },
                { ganzhi: '丁未', start: '2091-01-01', end: '2101-01-01', age: '88岁后', shishen: '伤官', desc: '晚年颐养天年' }
            ]
        };

        // ===================== 八字精准计算器（适配lunar.js 1.7.7） =====================
        class BaziCalculator {
            static getLunar(dateStr) {
                const [y, m, d] = dateStr.split('-');
                const solar = Solar.fromYmd(Number(y), Number(m), Number(d));
                return solar.getLunar();
            }

            static getYearGanZhi(dateStr) {
                return this.getLunar(dateStr).getYearInGanZhiExact();
            }

            static getLiuyue(dateStr) {
                const lunar = this.getLunar(dateStr);
                const ganzhi = lunar.getMonthInGanZhiExact();
                const jieQiTable = lunar.getJieQiTable();
                const jieQiList = Object.values(jieQiTable)
                    .filter(item => item)
                    .sort((a, b) => a.toYmd() - b.toYmd());

                const currentMonthZhi = lunar.getMonthZhiExact();
                const zhiJieQiMap = {
                    '寅': ['立春', '惊蛰'], '卯': ['惊蛰', '清明'], '辰': ['清明', '立夏'],
                    '巳': ['立夏', '芒种'], '午': ['芒种', '小暑'], '未': ['小暑', '立秋'],
                    '申': ['立秋', '白露'], '酉': ['白露', '寒露'], '戌': ['寒露', '立冬'],
                    '亥': ['立冬', '大雪'], '子': ['大雪', '小寒'], '丑': ['小寒', '立春']
                };
                const [startJie, endJie] = zhiJieQiMap[currentMonthZhi] || [];
                const start = jieQiTable[startJie]?.toYmd() || '';
                const end = jieQiTable[endJie]?.toYmd() || '';
                return { ganzhi, start, end };
            }

            static getDayGanZhi(dateStr) {
                return this.getLunar(dateStr).getDayInGanZhiExact();
            }

            static getDayun(dateStr) {
                const d = new Date(dateStr);
                return MINGZHU.dayunList.find(item =>
                    d >= new Date(item.start) && d < new Date(item.end)
                ) || MINGZHU.dayunList.at(-1);
            }

            static SHICHEN_TIME = [
                { name: '子', start: 23, end: 1, index: 0 }, { name: '丑', start: 1, end: 3, index: 1 },
                { name: '寅', start: 3, end: 5, index: 2 }, { name: '卯', start: 5, end: 7, index: 3 },
                { name: '辰', start: 7, end: 9, index: 4 }, { name: '巳', start: 9, end: 11, index: 5 },
                { name: '午', start: 11, end: 13, index: 6 }, { name: '未', start: 13, end: 15, index: 7 },
                { name: '申', start: 15, end: 17, index: 8 }, { name: '酉', start: 17, end: 19, index: 9 },
                { name: '戌', start: 19, end: 21, index: 10 }, { name: '亥', start: 21, end: 23, index: 11 },
            ];

            static getLiushi(riGan) {
                const wushuDun = {
                    '甲': '甲', '己': '甲', '乙': '丙', '庚': '丙', '丙': '戊', '辛': '戊',
                    '丁': '庚', '壬': '庚', '戊': '壬', '癸': '壬'
                };
                const tianGan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
                const diZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
                const now = new Date();
                const hour = now.getHours();
                const currentShichen = this.SHICHEN_TIME.find(item => {
                    if (item.start < item.end) return hour >= item.start && hour < item.end;
                    return hour >= item.start || hour < item.end;
                }) || this.SHICHEN_TIME[6];
                const ziGan = wushuDun[riGan];
                const ziGanIndex = tianGan.indexOf(ziGan);
                const shichenGan = tianGan[(ziGanIndex + currentShichen.index) % 10];
                const shichenZhi = diZhi[currentShichen.index];
                return { ganzhi: shichenGan + shichenZhi, name: currentShichen.name, time: `${currentShichen.start}:00-${currentShichen.end}:00` };
            }
        }

        // ===================== 流年可视化数据 =====================
        const data = [
            {
                name: "乙卯 劫财大运", range: "2011–2020", age: "9-18岁", level: "good", levelText: "大吉",
                summary: "青少年平顺期，帮身强旺，学业家庭顺遂。",
                years: [
                    { year: 2011, age: 9, gz: "辛卯", level: "good", text: "木水旺年，学业稳步提升，生活顺心。" },
                    { year: 2012, age: 10, gz: "壬辰", level: "good", text: "贵人运好，家庭和睦，学业进步。" },
                    { year: 2013, age: 11, gz: "癸巳", level: "good", text: "思路清晰，学习效率高，有小成就。" },
                    { year: 2014, age: 12, gz: "甲午", level: "good", text: "精力充沛，积极向上，整体吉利。" },
                    { year: 2015, age: 13, gz: "乙未", level: "good", text: "比劫帮身，有同辈相助，心情愉悦。" },

                        body: JSON.stringify({

                                { role: "user", content: prompt }
                            ],

                        })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split("\n").filter(line => line.trim() !== "");
                        for (const line of lines) {
                            if (!line.startsWith("data: ")) continue;
                            const data = line.replace("data: ", "").trim();
                            if (data === "[DONE]") continue;
                            try {
                                const json = JSON.parse(data);
                                const content = json.choices?.[0]?.delta?.content || "";
                                if (content) onChunk(content);
                            } catch (e) { }
                        }
                    }
                } catch (error) {
                    console.error("流式输出错误：", error);

                .replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>')
                .replace(/- (.*?)(\n|$)/g, '<li>$1</li>')
                .replace(/<li>(.*?)<\/li>/g, '<ul>$&</ul>')
                .replace(/<\/ul>\s*<ul>/g, '')
                .replace(/\n\n/g, '</p><p>')

            if (!html.startsWith('<h3') && !html.startsWith('<ul')) html = '<p>' + html + '</p>';
