        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===================== 命主精准配置（核心修正） =====================

                { ganzhi: '丁未', start: '2091-01-01', end: '2101-01-01', age: '88岁后', shishen: '伤官', desc: '晚年颐养天年' }

        // ===================== 八字精准计算器（适配lunar.js 1.7.7） =====================
        class BaziCalculator {
            // 获取农历对象（支持真太阳时逻辑）
            static getLunar(dateStr) {
                const [y, m, d] = dateStr.split('-');
                const solar = Solar.fromYmd(Number(y), Number(m), Number(d));
                return solar.getLunar();
            }

            // 流年：立春换年，精准干支
            static getYearGanZhi(dateStr) {
                return this.getLunar(dateStr).getYearInGanZhiExact();
            }

            // 流月：节气换月，精准干支+起止时间
            static getLiuyue(dateStr) {
                const lunar = this.getLunar(dateStr);
                const ganzhi = lunar.getMonthInGanZhiExact();
                // 获取当月节气起止
                const jieQiTable = lunar.getJieQiTable();

                // 安全排序（直接用对象本身比较，不用getSolar）
                const jieQiList = Object.values(jieQiTable)
                    .filter(item => item)
                    .sort((a, b) => a.toYmd() - b.toYmd());

                const currentMonthZhi = lunar.getMonthZhiExact();
                const zhiJieQiMap = {
                    '寅': ['立春', '惊蛰'],
                    '卯': ['惊蛰', '清明'],
                    '辰': ['清明', '立夏'],
                    '巳': ['立夏', '芒种'],
                    '午': ['芒种', '小暑'],
                    '未': ['小暑', '立秋'],
                    '申': ['立秋', '白露'],
                    '酉': ['白露', '寒露'],
                    '戌': ['寒露', '立冬'],
                    '亥': ['立冬', '大雪'],
                    '子': ['大雪', '小寒'],
                    '丑': ['小寒', '立春']
                };
                const [startJie, endJie] = zhiJieQiMap[currentMonthZhi] || [];

                // 直接取 toYmd()，不需要 getSolar()
                const start = jieQiTable[startJie]?.toYmd() || '';
                const end = jieQiTable[endJie]?.toYmd() || '';

                return { ganzhi, start, end };
            }// 流日：23点换日，精准干支
            static getDayGanZhi(dateStr) {
                return this.getLunar(dateStr).getDayInGanZhiExact();
            }

            // 大运：精准匹配日期区间
            static getDayun(dateStr) {
                const d = new Date(dateStr);
                return MINGZHU.dayunList.find(item =>
                    d >= new Date(item.start) && d < new Date(item.end)
                ) || MINGZHU.dayunList.at(-1);
            }

            // 新增1：十二时辰对应时间（固定不变）
            static SHICHEN_TIME = [
                { name: '子', start: 23, end: 1, index: 0 },
                { name: '丑', start: 1, end: 3, index: 1 },
                { name: '寅', start: 3, end: 5, index: 2 },
                { name: '卯', start: 5, end: 7, index: 3 },
                { name: '辰', start: 7, end: 9, index: 4 },
                { name: '巳', start: 9, end: 11, index: 5 },
                { name: '午', start: 11, end: 13, index: 6 },
                { name: '未', start: 13, end: 15, index: 7 },
                { name: '申', start: 15, end: 17, index: 8 },
                { name: '酉', start: 17, end: 19, index: 9 },
                { name: '戌', start: 19, end: 21, index: 10 },
                { name: '亥', start: 21, end: 23, index: 11 },
            ];

            // 新增2：根据流日天干+当前时间，自动计算精准流时（五鼠遁日上起时法）
            static getLiushi(riGan) {
                // 五鼠遁固定口诀：日干对应子时的天干
                const wushuDun = {
                    '甲': '甲', '己': '甲',
                    '乙': '丙', '庚': '丙',
                    '丙': '戊', '辛': '戊',
                    '丁': '庚', '壬': '庚',
                    '戊': '壬', '癸': '壬'
                };

                // 十天干顺序，用于顺排时辰
                const tianGan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
                const diZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

                // 获取当前时间，匹配对应时辰
                const now = new Date();
                const hour = now.getHours();
                const currentShichen = this.SHICHEN_TIME.find(item => {
                    if (item.start < item.end) {
                        return hour >= item.start && hour < item.end;
                    } else {
                        // 处理子时23点-次日1点的跨天情况
                        return hour >= item.start || hour < item.end;
                    }
                }) || this.SHICHEN_TIME[6]; // 默认午时

                // 计算时辰天干
                const ziGan = wushuDun[riGan];
                const ziGanIndex = tianGan.indexOf(ziGan);
                const shichenGan = tianGan[(ziGanIndex + currentShichen.index) % 10];
                const shichenZhi = diZhi[currentShichen.index];

                return {
                    ganzhi: shichenGan + shichenZhi,
                    name: currentShichen.name,
                    time: `${currentShichen.start}:00-${currentShichen.end}:00`
                };
            }
        }




        // ===================== AI分析处理器（深度适配命主原局） =====================
        class AITitleProcessor {
            constructor() {
                this.apiKey = "6869437c-0d6b-42ee-8c6d-4c865ca9b475";
                this.apiUrl = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";
            }

            async getAIResponse(prompt, retries = 2) {
                for (let i = 0; i <= retries; i++) {
                    try {
                        const response = await fetch(this.apiUrl, {
                            method: "POST",
                            headers: {
                                Authorization: `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                model: "doubao-1-5-pro-32k-250115",
                                messages: [
                                    { role: "system", content: this.getSystemPrompt() },
                                    { role: "user", content: prompt }
                                ],
                                temperature: 0.05,
                                max_tokens: 2500
                            })
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const result = await response.json();
                        const content = result.choices?.[0]?.message?.content?.trim();
                        if (content) return content;
                        throw new Error("Empty response");
                    } catch (error) {
                        console.error(`AI请求错误 (尝试 ${i + 1})`, error);
                        if (i === retries) throw error;
                        await delay(800);
                    }
                }
            }

            getSystemPrompt() {
                return `【角色】你是精通子平八字正宗体系的专业命理师，同时深度适配《原神》游戏机制，所有分析必须100%锚定命主原局，严格遵循旺衰平衡、刑冲合害、伏吟反吟、调候为急的核心命理规则，绝对禁止喜用万能论、喜用大运全吉化的偏颇判定，必须兼顾吉中藏凶的隐象与精准应事细节。
【命主核心档案（必须严格遵循，不得擅自修改）】
- 八字：${MINGZHU.bazi.join(' ')}
- 日主：${MINGZHU.rizhu}（甲木，身弱财旺，需水木印比帮身，调候为急）
- 原局格局：${MINGZHU.baseInfo}
- 喜用神：${MINGZHU.xiyong.join('、')}（水为第一喜用，主印星生身调候；木为第二喜用，主比劫帮身扶旺）
- 忌神：${MINGZHU.jishen.join('、')}（土为核心忌神，主财星耗身；金为次忌神，主官杀克身）
- 闲神：${MINGZHU.xianshen.join('、')}（火为食伤，适度利才华发挥，过旺则泄木气、生忌神土，反转为凶）
- 原局核心特点：原局无寅木禄神根气，第一喜用癸水虚浮无根，需大运/流月流日帮扶发力
- 核心神煞：寅木为日主甲木禄神（身之本气）、驿马星（主出行、交通、变动、机械）
- 婚姻宫：日支戌土（忌神），逢辰戌冲、戌未刑、戌丑刑，婚姻宫不稳，忌早婚
- 性别：男命，阴年生逆行大运

【分析核心逻辑（必须严格执行，优先级从上到下，禁止颠倒、遗漏）】
1.  权重优先级铁则（绝对不可突破）
    以日主甲木为核心，严格遵循「大运定基调→流年定应期→流月催吉凶→流日定落地→流时调细节」的层级，权重占比固定为：**大运40% > 流年30% > 流月15% > 流日10% > 流时5%**
    - 低维周期的吉凶无法突破高维周期定下的整体框架，高维周期的生克合冲优先级，绝对高于低维周期的任何作用关系
    - 流时5%权重仅为当日吉凶框架内的操作时机微调，**凶日无论时辰吉凶，均不可逆转整体凶性，仅可选择相对吉时做低风险基础操作，严禁高风险操作**，禁止以流时吉凶覆盖当日及以上周期的整体判定
2.  干支作用优先级铁则（优先级绝对高于普通五行生克）
    同层级内，优先级排序严格遵循：**伏吟/反吟 > 六冲 > 三刑/六害/自刑 > 六合/三合/三会/暗合拱合 > 空亡 > 普通五行生克**
    - 伏吟定义：同层级/跨层级干支完全相同（如大运甲寅、流日甲寅）；反吟定义：同层级/跨层级干支完全天克地冲（如大运甲寅、流日庚申）
    - 伏吟反吟核心逻辑：伏吟反吟，必有动应；吉凶核心取决于伏吟干支的十神喜忌，而非直接定凶
3.  喜用大运吉凶强制降档铁则（一票否决制，优先度最高，必须先执行，禁止先定吉再补理由）
    触发本条任意一条规则，必须按规则强制下调吉凶等级，不得突破上限
    3.1  禄神根气异常强制降档规则（完善纯增益逻辑，避免过度否定喜用）
        【前置判定】命主原局无寅木禄神根气，大运甲寅为日主核心喜用纯增益，核心基调为禄神帮身扶旺，仅当出现以下异常情况时，执行对应降档，无冲克刑害则正常按喜用旺相判定，禁止无脑否定喜用核心价值
        - 遇申金冲克、寅巳申三刑全格凑齐，禄神根气受损，当日吉凶最高不得超过小吉；流年+流月+流日双申冲寅，根气彻底受损，直接降为平运及以下，必须标注出行意外、磕碰伤病、机械故障风险
        - 遇亥寅合木、寅卯辰三会木、寅午戌三合火，导致木气过旺/被泄，根气异常，当日吉凶最高不得超过小吉
        - 禄神逢空亡、被合绊，喜用虚浮无力，当日吉凶最高不得超过平运
    3.2  伏吟反吟强制降档规则（分级处理，贴合十神本质定吉凶）
        - 忌神伏吟/反吟：流日与大运/原局日柱，触发忌神干支伏吟/反吟，无论其他格局，当日吉凶最高不得超过小吉；叠加其他降档规则，直接降为平运
        - 喜用伏吟/反吟：流日与大运/原局日柱，触发喜用干支伏吟/反吟，当日吉凶最高不得超过小吉，不直接降平运，必须标注「喜用旺极、防过刚易折、冲动失控」的隐凶；仅当叠加2条及以上其他降档规则时，才降为平运
        - 流日与原局日柱伏吟/反吟，触发婚姻宫/身宫动，无论喜忌，当日吉凶最高不得超过平运
        - 伏吟反吟铁律保留：无论喜忌，触发即必有动应，必须在生活建议中标注对应风险，禁止只提吉不提险
    3.3  物极必反强制降档规则（优化动态阈值，适配身弱原局）
        - 针对命主身弱财旺、喜用无根的特点，临界值规则为：同五行喜用干支在大运+流年+流月+流日中累计≥4个，即为旺极无制、身弱不受生，无论喜忌，当日吉凶最高不得超过小吉；喜用叠见≤3个，均按正常喜用帮扶判定，不触发旺极降档
        - 单日四柱（流月+流日+流时）中，单一五行干支占比≥50%，即为五行偏枯，无论喜忌，当日吉凶最高不得超过小吉
        - 旺极/偏枯叠加驿马动/伏吟/三刑，当日吉凶直接降为平运，主急躁冒进、动作失控、出行磕碰
    3.4  六冲强制降档规则
        - 冲禄破根：流日/流月地支申金冲克大运寅木禄神，当日吉凶最高不得超过小吉，必须标注出行意外、磕碰伤病、机械故障风险
        - 冲喜用：流日/流月地支冲克第一喜用水（亥子水），喜用受损，当日吉凶最高不得超过小吉
        - 冲忌神带凶：流日地支辰土冲原局婚姻宫戌土（忌神），虽冲忌神但动婚姻宫，当日吉凶最高不得超过平运，主是非、破财、人际矛盾

    3.5  三刑六害自刑强制降档规则（严格成格标准，新增叠加效应加权）
        - 三刑必须三字全齐成格才触发降档：寅巳申三刑、丑戌未三刑，必须在大运+流年+流月+流日中三字全齐成格，无论喜忌，当日吉凶最高不得超过小吉；单支相见仅标注风险提示，不触发强制降档
        - 寅巳申三刑全格凑齐，直接伤大运寅木禄神，当日吉凶直接降为平运，必须标注出行磕碰、金属划伤、机械故障、决策失误风险
        - 丑戌未三刑全格凑齐，动原局婚姻宫忌神戌土，当日吉凶直接降为平运；若同时触发「辰戌冲婚姻宫」+「丑戌未三刑全格」，直接在原有吉凶等级上再降一档，额外加权处理
        - 自刑规则：辰辰/午午/酉酉/亥亥自刑，触发即主自我内耗、决策失误、意外磕碰，当日吉凶最高不得超过小吉
        - 流日与大运/原局触发六害，主暗损、是非、分心失误、隐性破财，当日吉凶不得高于小吉
    3.6  合局异常强制降档规则（新增虚浮癸水吉凶转换规则）
        - 合化忌神：流日与大运/流月/原局合化成核心忌神土、次忌神金，无论原局喜忌，当日吉凶最高不得超过小吉；合局成势无制，直接判凶
        - 合化闲神泄身：寅午戌三合火局，合化闲神火泄甲木气、生忌神土，当日吉凶最高不得超过平运
        - 贪合忘生/合绊喜用：喜用干支被合绊，无法生扶日主，喜用失效，当日吉凶最高不得超过小吉
        - 虚浮喜用帮扶规则：原局癸水（第一喜用）虚浮无根，大运/流月流日见壬子/癸亥，水势强根帮扶，优先按喜用旺相判定；仅当水五行干支叠见≥4个时，才触发旺极降档
    3.7  空亡强制降档规则
        - 喜用空亡：流日/流时喜用神（水、木）落空亡，喜用虚浮无力，当日吉凶最高不得超过小吉，禁止大额抽卡、高风险操作
        - 禄神/驿马空亡：大运寅木禄神、驿马星空亡，主虚惊一场、出行意外、计划落空，当日吉凶最高不得超过平运
        - 空亡叠加伏吟反吟/三刑六害，无论喜忌，当日吉凶直接降为平运
    3.8  忌神旺相强制降档规则
        - 流年+流月+流日，2个及以上周期核心忌神土/次忌神金旺相，当日吉凶不得高于小吉；3个及以上周期忌神旺相无制，直接判凶

        - 七杀（庚金）旺相无制，当日吉凶直接降档，主突发意外、无妄之灾
    3.10 财多身弱强制降档规则
        - 流年+流月+流日，2个及以上周期核心忌神土旺相，财多耗身，当日吉凶最高不得超过小吉
        - 3个及以上周期忌神土旺相无制，财多身弱，直接判凶，主破财、分心失误、贪念出错、身体沉重摔跌
        - 财星叠见叠加婚姻宫动，当日吉凶直接降为平运
    3.11 闲神失控强制降档规则
        闲神火叠见形成火局，或连续2个及以上周期火旺，泄木气生忌神土，当日吉凶不得高于平运，必须标注分心、口舌、失误风险
    3.12 驿马星强制规则
        寅为日主驿马星，凡大运、流年、流月、流日中，驿马星（寅、申、巳、亥）叠见≥2个，必须优先判定出行、交通、意外磕碰风险，即使整体为吉，也必须在生活建议中强制标注出行安全注意事项
    3.13 核心凶煞强制降档规则
        当日触发劫煞、灾煞、白虎煞任意凶煞，无论喜用是否旺相，当日吉凶最高不得超过小吉；叠加2个及以上凶煞，直接降为平运，必须标注对应风险
4.  十神应事与操作匹配铁则（必须严格执行）
    - 比劫星（木，第二喜用）：旺相得宜，利组队、合作、日常任务、角色养成；旺极无制，忌大额抽卡、冲动消费、骑车飙速、冒险操作，主比劫夺财、失控失误
    - 印星（水，第一喜用）：旺相得宜，利抽卡、武器强化、深渊闯关、决策判断；空亡/被合绊，喜用失效，忌高风险操作，主判断失误、计划落空
    - 食伤星（火，闲神）：适度旺相，利社交、创意操作；旺极无制，泄木气生忌神，主分心走神、急躁出错、操作变形，忌抽卡、长途骑行
    - 财星（土，核心忌神）：旺相无制，主破财、贪念上头、抽卡保底歪、分心摔跌，严禁大额抽卡、高风险投资、疲劳骑行
    - 官杀星（金，次忌神）：旺相无制，主意外伤灾、金属磕碰、机械故障、无妄之灾，严禁飙车、冒险操作、抽卡、强化装备
5.  吉凶等级判定标准（必须严格对应，不得超标）
    - 大吉日：喜用旺相且无损、忌神有制、无任何降档规则触发、无婚姻宫动、无驿马凶动，高层级框架全吉，低维无凶象
    - 小吉日：喜用无损、小忌有制，仅触发单条降档规则，无多重凶象叠加，吉中带小险
    - 平运日：喜用无增益、忌神无制也无强冲克，或触发2条及以上降档规则，吉凶相抵，无大起大落
    - 凶日：喜用受损、忌神旺相无制，多重凶象叠加，直接判凶
6.  原神建议规则（强化适配性+分级量化，明确禁忌边界）
    必须100%贴合当日整体吉凶等级与喜忌，先定当日整体吉凶，再在框架内优选时辰执行对应操作，禁止突破吉凶等级给出超纲建议：
    - 大吉日：可在水旺（子、亥）、木旺（寅、卯）喜用神时辰，进行任意抽卡、刷圣遗物（优先水/木属性角色养成、武器强化）、打深渊、开宝箱等核心操作，无原石消耗上限
    - 小吉日：仅可在水旺、木旺喜用神时辰，做少量低风险抽卡，**单天抽卡不建议超过10抽**，优先完成日常任务，不建议大额原石投入，土旺（辰、戌、丑、未）时辰严禁任何高风险操作
    - 平运日：建议佛系游戏，完成日常任务即可，**不建议任何抽卡/武器强化操作**，不做任何高风险、高期待值的操作
    - 凶日：无论时辰好坏，均建议囤原石、囤体力、刷基础材料，**严禁任何抽卡/武器强化/打深渊等高风险操作**
7.  生活建议规则
    必须贴合命主身弱财旺、喜用无根的原局特点，严格遵循当日吉凶基调，只要触发任意降档规则，必须优先标注对应风险的规避建议，重点围绕事业财运、健康情绪、人际出行给出可落地的精准建议，禁止空泛表述，禁止只提吉不提凶。

        // ===================== 工具函数：Markdown转HTML =====================
        function parseMarkdown(text) {
            if (!text) return "";
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>')
                .replace(/- (.*?)(\n|$)/g, '<li>$1</li>')
                .replace(/<li>(.*?)<\/li>/g, '<ul>$&</ul>')
                .replace(/<\/ul>\s*<ul>/g, '')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            if (!html.startsWith('<h3') && !html.startsWith('<ul')) html = '<p>' + html + '</p>';
            return html;
        }

        // ===================== 页面主渲染逻辑 =====================
        const ai = new AITitleProcessor();

            document.getElementById('liuyue').innerText = liuyue.ganzhi;
            document.getElementById('liuyueTime').innerText = `${liuyue.start} 至 ${liuyue.end}`;
            document.getElementById('liuri').innerText = liuri;

            // 构建AI提示词
            const prompt = `【精准测算数据】
所选日期：${dateStr}

当前大运：${dayun.ganzhi}（${dayun.shishen}，${dayun.desc}，日主甲木喜用禄神+驿马星，原局无寅木根气，核心为帮身扶旺基调）

流月干支：${liuyue.ganzhi}
流日干支：${liuri}

【命理分析优先级规则（必须严格执行，禁止颠倒顺序、遗漏规则）】
1.  运势影响力权重从大到小，严格遵循：**大运40% > 流年30% > 流月15% > 流日10% > 流时5%**，低维周期的吉凶无法突破高维周期定下的整体基调，所有分析必须先锚定大运核心框架，再逐层向下拆解；流时仅为操作时机微调，凶日吉时不可逆转整体凶性
2.  同层级干支作用中，优先级严格遵循：**伏吟/反吟 > 六冲 > 三刑/六害/自刑 > 六合/三合/三会/暗合拱合 > 空亡 > 普通五行生克**；不同层级间，高层级的普通生克，优先级仍高于低层级的合冲刑害
3.  强制降档铁则（一票否决制，必须优先执行，触发即按规则降档，禁止超标定吉凶）
    - 优先判定大运寅木禄神根气：原局无寅木，大运甲寅为纯增益，仅当遇申冲、寅巳申三刑全格、合局过旺/被泄、空亡合绊时，才触发降档；无异常则正常按喜用帮身判定，不否定大运核心增益
    - 伏吟降档需结合十神：忌神伏吟强制降档，喜用伏吟仅限制吉凶上限（最高小吉）、不直接降平运，叠加2条及以上降档规则才深度降档
    - 三刑必须三字全齐成格才触发降档，单支相见仅标注风险、不触发强制降档；同时触发辰戌冲+丑戌未三刑全格，额外加权降一档
    - 物极必反阈值：喜用同五行叠见≥4个判旺极降档，≤3个按正常喜用帮扶判定，适配原局身弱、喜用无根特点
    - 原局癸水虚浮无根，大运/流日见壬子/癸亥，优先按喜用旺相判定，仅水叠见≥4个才触发旺极降档
    - 流年+流月+流日，2个及以上周期忌神土金旺相，当日吉凶不得高于小吉；3个及以上直接判凶
    - 流日触发婚姻宫辰戌冲、戌未刑、戌丑刑，当日吉凶不得高于平运
    - 流日天干庚辛金官杀克身，当日吉凶最高不得超过小吉；七杀无制直接降档
    - 驿马星（寅申巳亥）叠见≥2个，必须优先标注出行交通风险
4.  核心喜忌判定：第一喜用为水、第二喜用为木；核心忌神为土、次忌神为金；闲神为火。优先判定各周期对喜用神的增益、对忌神的制化，同时兼顾旺衰平衡，杜绝喜用万能论
5.  原神操作匹配规则：优先水/木属性角色养成，水旺/木旺时辰操作，土旺时辰严禁高风险操作；抽卡严格按吉凶等级分级，小吉日不超10抽，平运日不建议抽，凶日严禁抽卡`;

            // 渲染AI结果
            const resBox = document.getElementById('aiResult');
            resBox.innerHTML = '<div class="loading"><span>⌛</span>AI精准测算中...</div>';

            try {
                const aiText = await ai.getAIResponse(prompt);
                resBox.innerHTML = parseMarkdown(aiText);
            } catch (e) {
                resBox.innerHTML = `
                <div style="text-align:center;color:#e53e3e">❌ AI请求失败，请检查网络后重试</div>
                <div style="text-align:center">
                    <button class="retry-btn" onclick="render(document.getElementById('datePicker').value)">重新测算</button>
                </div>`;
            }
        }

        // 页面初始化：默认选中今天
        const picker = document.getElementById('datePicker');
        const today = new Date().toISOString().split('T')[0];
        picker.value = today;
        // 绑定日期变化事件
        picker.addEventListener('change', e => render(e.target.value));
        // 首次渲染
        render(today);
    </script>
